name: Aggiorna una chiave di config plugin sul VPS

# Deploy MIRATO di UNA singola chiave di un file di config di un plugin (es.
# messages.yml / config.yml) sul VPS, SENZA sovrascrivere il resto del file.
# Serve perche' l'auto-deploy dei plugin (deploy-plugin.yml) copia SOLO il jar:
# i file di config gia' presenti nella cartella dati del plugin sul VPS NON
# vengono toccati (e Messages.reload()/getConfig usano quelli, il jar e' solo
# il default per le chiavi mancanti). Quindi cambiare un valore gia' esistente
# nel repo non basta a vederlo live: va cambiato anche il file sul VPS.
#
# Grazie a questo workflow il passo VPS e' eseguibile da QUALSIASI sessione,
# cloud inclusa (la sessione non ha SSH, ma la Action si': usa gli stessi
# secret VPS_HOST / VPS_USER / VPS_SSH_KEY del deploy sito/plugin).
#
# La modifica e' MIRATA: cambia SOLO la riga della chiave indicata (match sul
# nome-foglia della chiave), lascia intatto tutto il resto — commenti compresi —
# e fa un backup timestampato del file sul VPS. Poi (opzionale) ricarica il
# plugin senza riavviare (screen `mc`).
#
# Solo manuale (workflow_dispatch): non parte da solo su push.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Cartella del plugin (es. MagixFactions)"
        required: true
      file:
        description: "File di config nella cartella dati del plugin"
        required: true
        default: "messages.yml"
      key:
        description: "Nome-foglia della chiave da cambiare (es. ally-prefix)"
        required: true
      value:
        description: "Nuovo valore della riga (tutto cio' che segue i due punti, virgolette comprese)"
        required: true
      reload_cmd:
        description: "Comando di reload da mandare in console (vuoto = nessun reload, la config parte al prossimo riavvio)"
        required: false
        default: "mf reload"

concurrency:
  group: deploy-plugin-config
  cancel-in-progress: false

jobs:
  patch-config:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che i secret VPS ci siano
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Secret VPS non configurati. Vedi website/vps/AUTO-DEPLOY.md"
            exit 1
          fi

      - name: Prepara la chiave SSH
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Aggiorna la chiave e ricarica
        if: steps.check.outputs.ok == 'true'
        env:
          DEST: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          IN_PLUGIN: ${{ inputs.plugin }}
          IN_FILE: ${{ inputs.file }}
          IN_KEY: ${{ inputs.key }}
          IN_VALUE: ${{ inputs.value }}
          IN_RELOAD: ${{ inputs.reload_cmd }}
        run: |
          set -euo pipefail
          KEY=~/.ssh/deploy_key
          SSH="ssh -i $KEY -o StrictHostKeyChecking=yes $DEST"

          REMOTE_PATH="/home/ubuntu/magicadventure/plugins/$IN_PLUGIN/$IN_FILE"
          # base64 per passare chiave/valore senza problemi di quoting (spazi, &, », ...).
          KEY_B64="$(printf '%s' "$IN_KEY" | base64 -w0)"
          VAL_B64="$(printf '%s' "$IN_VALUE" | base64 -w0)"

          # Script Python che modifica IN-PLACE solo la riga della chiave, preservando
          # commenti e resto del file. Lavora sul testo grezzo (niente reparse YAML, che
          # cancellerebbe i commenti). Lo copiamo sul VPS ed eseguiamo li'.
          cat > /tmp/patch_key.py <<'PY'
          import os, re, base64, shutil, time, sys
          path = os.environ['REMOTE_PATH']
          key  = base64.b64decode(os.environ['KEY_B64']).decode('utf-8')
          val  = base64.b64decode(os.environ['VAL_B64']).decode('utf-8')
          if not os.path.exists(path):
              print('ERRORE: file inesistente sul VPS:', path); sys.exit(2)
          with open(path, encoding='utf-8') as f:
              txt = f.read()
          pat = re.compile(r'(?m)^([ \t]*' + re.escape(key) + r':[ \t]*).*$')
          if not pat.search(txt):
              print('ERRORE: chiave non trovata nel file:', key); sys.exit(3)
          bak = path + '.bak-' + time.strftime('%Y%m%d-%H%M%S')
          shutil.copy2(path, bak)
          new, n = pat.subn(lambda m: m.group(1) + val, txt, count=1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(new)
          for line in new.splitlines():
              if re.match(r'^[ \t]*' + re.escape(key) + r':', line):
                  print('OK ->', line.strip()); break
          print('Backup:', bak)
          PY

          scp -i "$KEY" -o StrictHostKeyChecking=yes /tmp/patch_key.py "$DEST:/tmp/patch_key.py"
          $SSH "REMOTE_PATH='$REMOTE_PATH' KEY_B64='$KEY_B64' VAL_B64='$VAL_B64' python3 /tmp/patch_key.py; rm -f /tmp/patch_key.py"

          # Reload opzionale, senza riavviare, se il server e' su (screen `mc`).
          # Il comando di reload viaggia in base64 fino al VPS per evitare problemi di quoting.
          if [ -n "${IN_RELOAD:-}" ]; then
            RELOAD_B64="$(printf '%s' "$IN_RELOAD" | base64 -w0)"
            $SSH "RELOAD_B64='$RELOAD_B64' bash -s" <<'REMOTE'
          set -e
          CMD="$(printf '%s' "$RELOAD_B64" | base64 -d)"
          if screen -list 2>/dev/null | grep -qE '[0-9]+\.mc[[:space:]]'; then
            screen -S mc -p 0 -X stuff "$(printf '%s\r' "$CMD")"
            echo "Reload inviato: $CMD"
          else
            echo "Server non in esecuzione: la config verra caricata al prossimo avvio."
          fi
          REMOTE
          fi

      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
