name: Diagnostica di un plugin sul VPS

# Fotografia in SOLA LETTURA di come sta un plugin sul server live: versione del jar
# caricato, config vera nella cartella dati, file di dati e righe di log che lo riguardano.
#
# Serve alle sessioni CLOUD, che non hanno SSH verso il VPS: la Action si' (stessi secret
# VPS_HOST / VPS_USER / VPS_SSH_KEY del deploy). Il risultato finisce nel log del run, che
# la sessione puo' rileggere. Non modifica NULLA sul server.
#
# Attenzione: quello che viene stampato qui e' visibile nei log del run, quindi il workflow
# stampa solo file innocui (config e dati dei plugin) e mai credenziali.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Cartella del plugin (es. MagixEntities), 'tutti' per l'elenco delle chiavi di tutti i Magix, 'sistema' per risorse/porte/firewall/servizi della macchina"
        required: true
        default: "MagixEntities"
      file:
        description: "File o SOTTOCARTELLA (elenca invece di stampare) della cartella dati, vuoto = nessuno (es. entities.yml o CustomAlias)"
        required: false
        default: ""
      grep:
        description: "Testo da cercare nel log del server (vuoto = il nome del plugin)"
        required: false
        default: ""
      righe:
        description: "Quante righe di log mostrare"
        required: false
        default: "120"
      storico:
        description: "si = cerca anche nei log vecchi (logs/*.log.gz), no = solo latest.log"
        required: false
        default: "si"
      quanti_vecchi:
        description: "Quanti file .log.gz vecchi guardare (i riavvii ravvicinati ne consumano in fretta: alza questo numero per cercare piu' indietro nel tempo)"
        required: false
        default: "8"

concurrency:
  group: diagnostica-vps
  cancel-in-progress: false

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che i secret VPS ci siano
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secret VPS non configurati. Vedi website/vps/AUTO-DEPLOY.md"
            exit 1
          fi

      - name: Prepara la chiave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Raccogli le informazioni dal VPS
        env:
          DEST: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          IN_PLUGIN: ${{ inputs.plugin }}
          IN_FILE: ${{ inputs.file }}
          IN_GREP: ${{ inputs.grep }}
          IN_RIGHE: ${{ inputs.righe }}
          IN_STORICO: ${{ inputs.storico }}
          IN_QUANTI_VECCHI: ${{ inputs.quanti_vecchi }}
        run: |
          set -euo pipefail
          KEY=~/.ssh/deploy_key
          PLUGIN_B64="$(printf '%s' "$IN_PLUGIN" | base64 -w0)"
          FILE_B64="$(printf '%s' "${IN_FILE:-}" | base64 -w0)"
          GREP_B64="$(printf '%s' "${IN_GREP:-}" | base64 -w0)"
          ssh -i "$KEY" -o StrictHostKeyChecking=yes "$DEST" \
            "PLUGIN_B64='$PLUGIN_B64' FILE_B64='$FILE_B64' GREP_B64='$GREP_B64' RIGHE='${IN_RIGHE:-120}' STORICO='${IN_STORICO:-si}' QUANTI_VECCHI='${IN_QUANTI_VECCHI:-8}' bash -s" <<'REMOTE'
          set -uo pipefail
          PLUGIN="$(printf '%s' "$PLUGIN_B64" | base64 -d)"
          FILE="$(printf '%s' "$FILE_B64" | base64 -d)"
          CERCA="$(printf '%s' "$GREP_B64" | base64 -d)"
          [ -n "$CERCA" ] || CERCA="$PLUGIN"
          BASE=/home/ubuntu/magicadventure/faction; [ -d "$BASE/plugins" ] || BASE=/home/ubuntu/magicadventure  # fino allo spostamento le fazioni stavano direttamente in magicadventure/
          LOG="$BASE/logs/latest.log"

          echo "=== SERVER ==="
          ( cd "$BASE" && ls -la *.jar 2>/dev/null )
          grep -m1 -E "This server is running|Starting minecraft server version" "$LOG" 2>/dev/null
          java -version 2>&1 | head -n1
          SCR="$(screen -list 2>/dev/null | grep -oE '[0-9]+\.(faction|mc)[[:space:]]' | head -n1 | sed -E 's/^[0-9]+\.//; s/[[:space:]]+$//' || true)"; SCR="${SCR:-faction}"  # screen del server fazioni (vecchio nome: mc)
          if screen -list 2>/dev/null | grep -qE '[0-9]+\.(faction|mc)[[:space:]]'; then echo "screen $SCR: attivo"; else echo "screen fazioni: NON attivo"; fi
          systemctl show magicadventure.service --property=Restart,RestartSec 2>/dev/null \
            || echo "(systemctl non raggiungibile o servizio magicadventure non installato con questo nome)"
          echo "Ora e fuso orario del VPS: $(date) ($(timedatectl show --property=Timezone --value 2>/dev/null || echo '?'))"
          echo "Crontab di ubuntu:"
          crontab -l 2>/dev/null || echo "(nessun crontab)"

          echo
          echo "=== PLUGIN INSTALLATI ==="
          ls -la "$BASE/plugins"/*.jar 2>/dev/null

          echo
          # 'tutti': non la fotografia di un plugin, ma l'elenco delle CHIAVI dei config vivi di
          # tutti i Magix. Serve a confrontarle con quelle del repo: una chiave rimasta col nome
          # vecchio sul VPS il plugin non la legge piu' e riparte dal default del jar, in silenzio.
          if [ "$PLUGIN" = "tutti" ]; then
            for D in "$BASE/plugins"/Magix*/; do
              NOME="$(basename "$D")"
              for F in config.yml messages.yml; do
                [ -f "$D$F" ] || continue
                echo "### $NOME/$F"
                python3 - "$D$F" <<'PYKEYS'
          # Niente PyYAML (sul VPS puo' non esserci): le chiavi si leggono dall'indentazione,
          # che per questi file basta e avanza. Interessa il NOME della chiave, non il valore.
          import sys, re
          riga = re.compile(r'^(\s*)([A-Za-z0-9_.\-]+):(\s|$)')
          pila = []
          with open(sys.argv[1], encoding='utf-8', errors='replace') as f:
              for l in f:
                  if l.lstrip().startswith('#'):
                      continue
                  m = riga.match(l)
                  if not m:
                      continue
                  ind, chiave = len(m.group(1)), m.group(2)
                  while pila and pila[-1][0] >= ind:
                      pila.pop()
                  pila.append((ind, chiave))
                  print('.'.join(k for _, k in pila))
          PYKEYS
              done
            done
            exit 0
          fi

          # 'sistema': la macchina invece di un plugin. Serve a progettare altri server sullo
          # stesso VPS (hub, proxy Velocity): risorse libere, porte in ascolto, firewall, servizi.
          if [ "$PLUGIN" = "sistema" ]; then
            echo "=== RISORSE ==="
            nproc; free -h; df -h / "$BASE" 2>/dev/null
            echo; echo "=== PROCESSI JAVA (memoria) ==="
            ps -eo pid,rss,args --sort=-rss | grep -a '[j]ava' | cut -c1-220
            echo; echo "=== PORTE IN ASCOLTO (TCP e UDP, con il processo) ==="
            # 0.0.0.0 / * / [::] = raggiungibile da fuori se il firewall lo lascia passare;
            # 127.0.0.1 / [::1] = solo dalla macchina stessa.
            sudo -n ss -tulpn 2>/dev/null | sed -E 's/users:\(\("([^"]+)".*/\1/' || ss -tuln 2>/dev/null
            echo; echo "=== FIREWALL (ufw) ==="
            sudo -n ufw status verbose 2>/dev/null || echo "(ufw non leggibile senza sudo)"
            echo; echo "--- regole numerate (anche IPv6) ---"
            sudo -n ufw status numbered 2>/dev/null
            echo; echo "=== PORTE PUBBLICHE SENZA REGOLA ufw (ascoltano su tutte le interfacce) ==="
            APERTE="$(sudo -n ufw status 2>/dev/null | awk 'NR>4 {print $1}' | cut -d/ -f1 | sort -u)"
            sudo -n ss -tulnH 2>/dev/null | awk '{print $1, $5}' | grep -vE ' (127\.|\[::1\]|\[::ffff:127\.)' \
              | while read -r proto addr; do
                  porta="${addr##*:}"
                  echo "$APERTE" | grep -qx "$porta" && stato="regola ufw presente" || stato="NESSUNA regola: bloccata (ufw nega di serie)"
                  echo "  $proto $addr -> $stato"
                done | sort -u
            echo; echo "=== server.properties di tutti i server (rete, query, rcon) ==="
            for d in /home/ubuntu/magicadventure/*/; do
              [ -f "$d/server.properties" ] || continue
              echo "## $d"
              grep -E '^(server-ip|server-port|online-mode|enable-query|query.port|enable-rcon|rcon.port|white-list|enforce-whitelist)=' "$d/server.properties"
            done
            echo; echo "=== porte dei plugin che aprono servizi (MagixPack, Votifier, dynmap...) ==="
            grep -rhE '^(port|public-host|host):' /home/ubuntu/magicadventure/*/plugins/MagixPack/config.yml 2>/dev/null
            ls /home/ubuntu/magicadventure/*/plugins/ 2>/dev/null | grep -iE 'votifier|dynmap|bluemap|plan|geyser' || echo "(nessuno di quelli noti)"
            echo; echo "=== SERVIZIO magicadventure ==="
            systemctl cat magicadventure.service 2>/dev/null || echo "(unit non trovata)"
            echo; echo "=== ALTRE UNIT systemd personalizzate ==="
            ls /etc/systemd/system/*.service 2>/dev/null
            echo; echo "=== CARTELLE IN /home/ubuntu ==="
            ls -la /home/ubuntu
            echo; echo "=== JAVA INSTALLATI ==="
            ls /usr/lib/jvm 2>/dev/null
            echo; echo "=== server.properties (rete) ==="
            grep -E '^(server-ip|server-port|online-mode|prevent-proxy-connections|network-compression-threshold|enforce-secure-profile|max-players)=' "$BASE/server.properties"
            echo; echo "=== spigot.yml (bungeecord) ==="
            grep -n 'bungeecord' "$BASE/spigot.yml"
            echo; echo "=== paper-global.yml (proxies) ==="
            sed -n '/^proxies:/,/^[a-z]/p' "$BASE/config/paper-global.yml" | grep -v -i 'secret'
            echo; echo "=== TCPShield ==="
            ls -la "$BASE/plugins/TCPShield" 2>/dev/null
            [ -f "$BASE/plugins/TCPShield/config.yml" ] && grep -v '^[[:space:]]*#' "$BASE/plugins/TCPShield/config.yml" | grep -v '^[[:space:]]*$'
            echo; echo "=== nginx: server_name ==="
            grep -rh 'server_name' /etc/nginx/sites-enabled 2>/dev/null | sort -u
            exit 0
          fi

          echo "=== CARTELLA DATI $PLUGIN ==="
          ls -la "$BASE/plugins/$PLUGIN" 2>/dev/null || echo "(cartella assente)"

          # Il valore di una chiave "sensibile" (password, webhook, token...) non esce mai nel
          # log di questa Action, leggibile da chiunque abbia accesso al repo: si vede che la
          # chiave c'e' ed e' valorizzata, mai il segreto vero. Il NOME della chiave resta
          # visibile apposta: e' quello che serve per capire cosa e' configurato.
          oscura() {
            sed -E 's/^([[:space:]]*[A-Za-z0-9_-]*(password|secret|token|webhook|api[_-]?key)[A-Za-z0-9_-]*:)[[:space:]]*.+$/\1 "[nascosto]"/I'
          }

          echo
          echo "=== config.yml ATTIVO ($PLUGIN) ==="
          if [ -f "$BASE/plugins/$PLUGIN/config.yml" ]; then
            sed -e 's/[[:space:]]*$//' "$BASE/plugins/$PLUGIN/config.yml" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | oscura
          else
            echo "(nessun config.yml)"
          fi

          # MagixPack genera parte del contenuto (items.yml, glyphs.yml) DENTRO lo zip in memoria,
          # mai su disco (a differenza di overrides/, una cartella vera): un ls sulla cartella dati
          # non lo trova mai, per progetto. L'unico modo di controllare che un file sia DAVVERO nel
          # pacchetto e' scaricarlo per davvero e guardarci dentro, non fidarsi solo del log.
          if [ "$PLUGIN" = "MagixPack" ]; then
            echo
            echo "=== CONTENUTO DI pack.zip (scaricato in locale, sola lettura) ==="
            PORT="$(grep -E '^port:' "$BASE/plugins/$PLUGIN/config.yml" 2>/dev/null | head -n1 | grep -oE '[0-9]+')"
            if [ -z "$PORT" ]; then
              echo "(porta non trovata in config.yml)"
            elif ! curl -sf -o /tmp/diag-pack.zip "http://127.0.0.1:${PORT}/pack.zip"; then
              echo "(download da 127.0.0.1:${PORT}/pack.zip fallito: il servizio HTTP non risponde)"
            else
              echo "Scaricato $(stat -c%s /tmp/diag-pack.zip 2>/dev/null || echo '?') byte da 127.0.0.1:${PORT}/pack.zip"
              python3 -c "import zipfile; z = zipfile.ZipFile('/tmp/diag-pack.zip'); names = z.namelist(); mp = sorted(n for n in names if n.startswith('assets/magixpack/')); legacy = sorted(n for n in names if n.startswith('assets/minecraft/models/item/') and b'magixpack' in z.read(n)); print(f'{len(names)} file nello zip, {len(mp)} sotto assets/magixpack/ (oggetti/icone custom di MagixPack), {len(legacy)} override legacy su modelli vanilla (CustomModelData):'); [print('  ' + n, '(' + str(len(z.read(n))) + ' byte)') for n in mp + legacy]; print(); print('--- contenuto dei .json (per controllare che siano scritti davvero cosi) ---'); [print(n + ':', z.read(n).decode('utf-8', 'replace')) for n in mp + legacy if n.endswith('.json')]"
              rm -f /tmp/diag-pack.zip
            fi
          fi

          # La coda di traduzione del sito (site_translations) sta nel database del sito, non in
          # un file: per MagixLanguage e MagixBridge se ne stampano i CONTEGGI per lingua e stato,
          # con la stessa connessione del sito (includes/db.php). Mai testi ne' credenziali: un
          # errore stampa solo il tipo e il codice, non il messaggio (puo' contenere l'utente DB).
          if [ "$PLUGIN" = "MagixLanguage" ] || [ "$PLUGIN" = "MagixBridge" ]; then
            echo
            echo "=== CODA TRADUZIONI DEL SITO (site_translations, solo conteggi) ==="
            echo "lingua  stato  righe  max-tentativi  ultimo-aggiornamento"
            php -r 'try { require "/var/www/magicadventure/includes/db.php";
                foreach (db()->query("SELECT lang, status, COUNT(*) AS n, MAX(attempts) AS att, MAX(updated_at) AS ultimo FROM site_translations GROUP BY lang, status ORDER BY lang, status") as $r) { echo implode("  ", $r), "\n"; }
              } catch (Throwable $e) { echo "lettura fallita: ", get_class($e), " ", $e->getCode(), "\n"; }' 2>&1 \
              || echo "(php da riga di comando non disponibile sul VPS)"
          fi

          # Il ponte dei placeholder di MagixBridge: chi e' online dove, e i valori globali
          # pubblicati (classifiche, totali: dati pubblici). Di quelli per giocatore solo i conteggi.
          if [ "$PLUGIN" = "MagixBridge" ]; then
            echo
            echo "=== PONTE DEI PLACEHOLDER (network_presence, network_placeholders) ==="
            php -r 'try { require "/var/www/magicadventure/includes/db.php";
                echo "-- presenza (ultimi 60s): server  giocatori\n";
                foreach (db()->query("SELECT server, COUNT(*) FROM network_presence WHERE seen_at > NOW() - INTERVAL 60 SECOND GROUP BY server") as $r) { echo implode("  ", $r), "\n"; }
                echo "-- valori per giocatore: server  placeholder  giocatori  ultimo-aggiornamento\n";
                foreach (db()->query("SELECT server, placeholder, COUNT(*), MAX(updated_at) FROM network_placeholders WHERE mc_uuid <> \"\" GROUP BY server, placeholder ORDER BY server, placeholder") as $r) { echo implode("  ", $r), "\n"; }
                echo "-- valori globali: server  placeholder  valore  aggiornato\n";
                foreach (db()->query("SELECT server, placeholder, value, updated_at FROM network_placeholders WHERE mc_uuid = \"\" ORDER BY server, placeholder") as $r) { echo implode("  ", $r), "\n"; }
              } catch (Throwable $e) { echo "lettura fallita: ", get_class($e), " ", $e->getCode(), "\n"; }' 2>&1 \
              || echo "(php da riga di comando non disponibile sul VPS)"
          fi

          if [ -n "$FILE" ]; then
            echo
            echo "=== $FILE ($PLUGIN) ==="
            if [ -d "$BASE/plugins/$PLUGIN/$FILE" ]; then
              ls -la "$BASE/plugins/$PLUGIN/$FILE" 2>/dev/null || echo "(cartella assente)"
            elif [ -f "$BASE/plugins/$PLUGIN/$FILE" ]; then
              tail -n 400 "$BASE/plugins/$PLUGIN/$FILE" | oscura
            else
              echo "(file assente)"
            fi
          fi

          # I log ruotano a ogni riavvio: latest.log copre solo l'ultima accensione, quindi
          # di default si guarda anche nei .log.gz di prima (la sessione cerca spesso qualcosa
          # successo PRIMA dell'ultimo riavvio).
          VECCHI=""
          if [ "${STORICO:-si}" = "si" ]; then
            VECCHI="$(ls -t "$BASE/logs"/*.log.gz 2>/dev/null | head -n "${QUANTI_VECCHI:-8}" | tr '\n' ' ')"
          fi
          echo "Log esaminati: latest.log $VECCHI"

          # Il taglio a $RIGHE va fatto tenendo le righe PIU' RECENTI, e le due sorgenti sono
          # ordinate al contrario: latest.log e' cronologico (recenti in fondo -> tail), i
          # .log.gz arrivano dal piu' nuovo al piu' vecchio (recenti in cima -> head). Con un
          # solo tail finale si finiva per stampare i riavvii di stamattina e perdere l'ultimo.
          cerca_tutto() {  # $1 = regex estesa, case-insensitive
            grep -a -i -H -E -- "$1" "$LOG" 2>/dev/null | tail -n "$RIGHE"
            [ -n "$VECCHI" ] && zgrep -a -i -H -E -- "$1" $VECCHI 2>/dev/null | head -n "$RIGHE"
            return 0
          }

          echo
          echo "=== LOG: righe che parlano di '$CERCA' (le piu' recenti, max $RIGHE per sorgente) ==="
          cerca_tutto "$CERCA"

          echo
          echo "=== LOG: errori ed eccezioni dei plugin Magix (le piu' recenti) ==="
          cerca_tutto "ERROR|Exception|Caused by|at com\.teolo|Could not pass event|Unhandled exception" \
            | grep -av "Unknown minor version"
          # Nessuna riga trovata non e' un errore: senza questo il passo risulterebbe fallito
          # solo perche' l'ultimo grep non ha trovato niente (che di solito e' una buona notizia).
          exit 0
          REMOTE

      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
