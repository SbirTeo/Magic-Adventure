name: Togli un plugin dal server Minecraft

# Toglie dal VPS il jar di un plugin e riavvia il server. Serve quando una funzione passa a un
# plugin nostro e quello vecchio va tolto di mezzo: due plugin sulla stessa cosa (la MOTD, il
# tablist) non si spartiscono il lavoro, se lo strappano di mano.
#
# NON cancella: sposta il jar in plugins/.rimossi/ col timestamp nel nome. Un plugin tolto per
# sbaglio si rimette indietro con un mv, e il .rimossi non viene letto da Bukkit (guarda solo i
# .jar dentro plugins/). La cartella dati del plugin (config, dati) resta dov'e': si toglie a
# mano, quando si e' sicuri.
#
# Serve alle sessioni CLOUD, che non hanno SSH verso il VPS. Stessi secret del deploy
# (VPS_HOST / VPS_USER / VPS_SSH_KEY) e stesso riavvio con preavviso in chat.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Prefisso del jar da togliere (es. CustomMOTD -> CustomMOTD-*.jar)"
        required: true
      riavvia:
        description: "si = riavvia il server (serve perche' il plugin sparisca davvero), no = solo sposta"
        required: false
        default: "si"

concurrency:
  group: deploy-plugin       # stesso gruppo del deploy: mai un riavvio dentro l'altro
  cancel-in-progress: false

jobs:
  rimuovi:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che i secret VPS ci siano
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Secret VPS non configurati. Vedi website/vps/AUTO-DEPLOY.md"
            exit 1
          fi

      - name: Controlla il nome del plugin
        env:
          IN_PLUGIN: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          # Solo lettere, numeri, punto, trattino e underscore: il nome finisce dentro un comando
          # remoto, e un nome con spazi o barre li' dentro sarebbe un'altra cosa.
          if ! printf '%s' "$IN_PLUGIN" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::Nome non valido: '$IN_PLUGIN' (ammessi lettere, numeri, . _ -)"
            exit 1
          fi

      - name: Prepara la chiave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sposta il jar e riavvia
        env:
          DEST: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          IN_PLUGIN: ${{ inputs.plugin }}
          IN_RIAVVIA: ${{ inputs.riavvia }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes $DEST"
          $SSH "PLUGIN='$IN_PLUGIN' RIAVVIA='${IN_RIAVVIA:-si}' bash -s" <<'REMOTE'
          set -e
          PLUGDIR=/home/ubuntu/magicadventure/plugins
          STAMP="$(date +%Y%m%d-%H%M%S)"
          cd "$PLUGDIR"

          TROVATI="$(ls -1 "$PLUGIN"-*.jar "$PLUGIN".jar 2>/dev/null || true)"
          if [ -z "$TROVATI" ]; then
            echo "Nessun jar che cominci per '$PLUGIN': non c'e' niente da togliere."
            echo "Nella cartella ci sono:"; ls -1 *.jar
            exit 0
          fi

          mkdir -p .rimossi
          echo "Tolgo:"; printf '%s\n' "$TROVATI"
          printf '%s\n' "$TROVATI" | while IFS= read -r J; do
            [ -z "$J" ] && continue
            mv "$J" ".rimossi/$J.$STAMP"
            echo "  $J -> .rimossi/$J.$STAMP"
          done

          echo "Rimasti nella cartella plugins:"; ls -1 *.jar

          if [ "$RIAVVIA" != "si" ]; then
            echo "Riavvio saltato: il plugin resta caricato fino al prossimo riavvio."
            exit 0
          fi

          dì() { screen -S mc -p 0 -X stuff "$(printf '%s\r' "$1")"; }
          annuncia() { dì "say $1"; }
          if screen -list 2>/dev/null | grep -qE '[0-9]+\.mc[[:space:]]'; then
            annuncia "[Manutenzione] Il server si riavvia tra 60 secondi..."
            sleep 40
            annuncia "[Manutenzione] Riavvio tra 20 secondi..."
            sleep 15
            annuncia "[Manutenzione] Riavvio tra 5 secondi!"
            sleep 5
            dì "save-all"
            sleep 3
          fi
          sudo systemctl restart magicadventure.service
          echo "Riavvio richiesto."
          REMOTE

      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
