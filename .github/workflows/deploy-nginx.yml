name: Deploy configurazione nginx sul VPS

# Porta website/nginx-magicadventure.conf (e lo snippet delle intestazioni di sicurezza) sul
# VPS e ricarica nginx. L'auto-deploy del sito copia solo i file del sito in /var/www: la
# configurazione di nginx sta in /etc/nginx, e senza questo workflow cambiarla voleva dire
# entrare in SSH a mano (impossibile da una sessione cloud).
#
# Sicurezze:
# - applica=no (default): mostra solo le differenze fra il file vivo e quello del repo, e
#   se sudo e' disponibile senza password. Non tocca niente.
# - applica=si: copia di backup del file vivo in ~/.bak/nginx/ (fuori da /etc), sostituzione,
#   "nginx -t" e, SOLO se passa, reload (non restart: le connessioni aperte non cadono). Se
#   "nginx -t" fallisce il file vecchio torna al suo posto e il workflow fallisce.
# - Il file da sostituire non si indovina: e' quello, fra i siti abilitati, che contiene
#   "server_name magicadventure.it;" (seguendo il link simbolico fino al file vero).
#
# Solo manuale (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      applica:
        description: "si = sostituisce e ricarica nginx; no = mostra solo le differenze"
        required: true
        default: "no"
        type: choice
        options: ["no", "si"]

concurrency:
  group: deploy-nginx
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla che i secret VPS ci siano
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secret VPS non configurati. Vedi website/vps/AUTO-DEPLOY.md"
            exit 1
          fi

      - name: Prepara la chiave SSH
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copia i file nuovi in una cartella temporanea del VPS
        if: steps.check.outputs.ok == 'true'
        env:
          DEST: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEST" 'mkdir -p ~/nginx-nuovo'
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            website/nginx-magicadventure.conf website/nginx-intestazioni-sicurezza.conf \
            "$DEST:nginx-nuovo/"

      - name: Confronta ed eventualmente applica
        if: steps.check.outputs.ok == 'true'
        env:
          DEST: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          APPLICA: ${{ inputs.applica }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEST" "APPLICA='$APPLICA' bash -s" <<'REMOTE'
          set -uo pipefail
          NUOVO=~/nginx-nuovo
          SITO=""
          for f in /etc/nginx/sites-enabled/*; do
            if grep -qE '^[[:space:]]*server_name[[:space:]]+magicadventure\.it;' "$f" 2>/dev/null; then
              SITO="$(readlink -f "$f")"; break
            fi
          done
          SNIPPET=/etc/nginx/snippets/magicadventure-sicurezza.conf
          if [ -z "$SITO" ]; then
            echo "ERRORE: nessun sito abilitato con 'server_name magicadventure.it;' in /etc/nginx/sites-enabled"; exit 2
          fi
          echo "File del sito sul VPS: $SITO"
          echo
          echo "=== DIFFERENZE sito (vivo -> repo) ==="
          diff -u "$SITO" "$NUOVO/nginx-magicadventure.conf" && echo "(identici)"
          echo
          echo "=== DIFFERENZE snippet sicurezza (vivo -> repo) ==="
          if [ -f "$SNIPPET" ]; then
            diff -u "$SNIPPET" "$NUOVO/nginx-intestazioni-sicurezza.conf" && echo "(identici)"
          else
            echo "(snippet assente sul VPS)"
          fi
          echo
          if sudo -n true 2>/dev/null; then
            echo "sudo senza password: disponibile"
          else
            echo "sudo senza password: NON disponibile"
            if [ "$APPLICA" = "si" ]; then
              echo "ERRORE: per applicare serve sudo senza password per cp, nginx e systemctl reload nginx."
              exit 3
            fi
          fi

          if [ "$APPLICA" != "si" ]; then
            echo "applica=no: nessuna modifica."
            rm -rf "$NUOVO"
            exit 0
          fi

          ORA="$(date -u +%Y%m%d-%H%M%S)"
          mkdir -p ~/.bak/nginx
          cp "$SITO" ~/.bak/nginx/"$(basename "$SITO")".bak-"$ORA"
          [ -f "$SNIPPET" ] && cp "$SNIPPET" ~/.bak/nginx/magicadventure-sicurezza.conf.bak-"$ORA"
          echo "Backup in ~/.bak/nginx/ (*.bak-$ORA)"

          sudo -n cp "$NUOVO/nginx-magicadventure.conf" "$SITO"
          sudo -n cp "$NUOVO/nginx-intestazioni-sicurezza.conf" "$SNIPPET"
          if sudo -n nginx -t; then
            sudo -n systemctl reload nginx
            echo "OK: configurazione nuova attiva (reload fatto)."
          else
            echo "ERRORE: nginx -t fallito, rimetto i file di prima."
            sudo -n cp ~/.bak/nginx/"$(basename "$SITO")".bak-"$ORA" "$SITO"
            [ -f ~/.bak/nginx/magicadventure-sicurezza.conf.bak-"$ORA" ] \
              && sudo -n cp ~/.bak/nginx/magicadventure-sicurezza.conf.bak-"$ORA" "$SNIPPET"
            sudo -n nginx -t && echo "Configurazione di prima ripristinata e valida (nessun reload fatto)."
            rm -rf "$NUOVO"
            exit 4
          fi
          rm -rf "$NUOVO"
          REMOTE

      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
