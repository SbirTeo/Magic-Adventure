name: Deploy plugin sul server Minecraft

# Auto-deploy dei PLUGIN: a ogni push su main che tocca plugins-src/, i plugin cambiati
# vengono compilati (Maven/JDK 25), il jar viene copiato sul VPS in
# /home/ubuntu/magicadventure/plugins/ (togliendo la versione vecchia) e il server viene
# riavviato PER CARICARLI, con un preavviso in chat ai giocatori online.
#
# REGOLA (CLAUDE.md): lo STOP del server si fa con il comando CMI `stopserverfast` in console
# (salva tutto e chiude pulito), NON con un systemctl restart "secco". systemctl restart si usa
# solo per riportare su il server dopo lo stop (se systemd non lo rilancia da solo) e come
# fallback se stopserverfast non lo ferma in tempo -- cosi' non si resta mai offline.
#
# Usa gli stessi secret del deploy sito: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# Serve inoltre, lato VPS, che l'utente possa riavviare il servizio senza password:
#   ubuntu ALL=(root) NOPASSWD: /usr/bin/systemctl restart magicadventure.service
# (in /etc/sudoers.d/deploy-mc). Dettagli in website/vps/AUTO-DEPLOY.md.
#
# Convenzione: il nome della cartella in plugins-src/ coincide con il prefisso del jar
# (es. MagixFactions -> MagixFactions-<versione>.jar), cosi' la vecchia versione si rimuove
# con MagixFactions-*.jar.

on:
  push:
    branches: [main]
    paths:
      - 'plugins-src/**'
      - '.github/workflows/deploy-plugin.yml'
  workflow_dispatch:
    inputs:
      plugin:
        description: "Cartella del plugin da compilare (es. MagixFactions), oppure 'all'"
        required: false
        default: 'all'

concurrency:
  group: deploy-plugin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che i secret VPS ci siano
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret VPS non configurati: deploy saltato. Vedi website/vps/AUTO-DEPLOY.md"
          fi

      - name: Scarica il codice
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          # Storia intera: serve a risalire fino a github.event.before (il commit su cui stava
          # main PRIMA di questo push), non solo a HEAD^. Con un push che e' un MERGE COMMIT
          # (due sessioni che pushano su main quasi insieme: capita davvero, vedi sotto) HEAD^ e'
          # solo il primo genitore, e un diff HEAD^..HEAD perde tutte le modifiche portate dal
          # SECONDO genitore — cioe' esattamente i plugin che l'altra sessione aveva appena
          # cambiato: sono spariti dall'elenco "da compilare" senza nessun errore, e sul VPS
          # restava il jar vecchio con la build verde. Successo davvero il 2026-09-23.
          fetch-depth: 0

      - name: Java 25 + Maven
        if: steps.check.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Decidi quali plugin compilare
        if: steps.check.outputs.ok == 'true'
        id: plugins
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.plugin }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
              LIST="$(ls -1 plugins-src)"
            else
              LIST="$INPUT"
            fi
          else
            # push: solo le cartelle di primo livello cambiate sotto plugins-src/, confrontando
            # con COM'ERA main PRIMA di questo push (github.event.before), non con HEAD^ — che
            # per un merge commit e' solo il primo genitore e perderebbe le modifiche del secondo
            # (vedi il commento sopra su fetch-depth). Se "before" non e' utilizzabile (primo
            # push di un branch nuovo, oppure storia riscritta e commit non piu' raggiungibile) si
            # compilano TUTTI i plugin per sicurezza, invece di rischiare di saltarne uno in
            # silenzio: costa qualche minuto di build in piu', non un deploy a meta'.
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "$BEFORE" 2>/dev/null; then
              LIST="$(git diff --name-only "$BEFORE" HEAD -- plugins-src/ \
                      | sed -n 's#^plugins-src/\([^/]*\)/.*#\1#p' | sort -u)"
            else
              echo "::warning::github.event.before non utilizzabile: compilo tutti i plugin per sicurezza."
              LIST="$(ls -1 plugins-src)"
            fi
          fi
          echo "Plugin da compilare:"; echo "${LIST:-(nessuno)}"
          printf '%s\n' "$LIST" > "$RUNNER_TEMP/plugin_list"
          if [ -n "$LIST" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

      - name: Installa MagixLanguage nel repo Maven locale
        # Gli altri plugin compilano contro MagixLanguageAPI con una dipendenza Maven
        # 'provided' (com.teolo:MagixLanguage): non e' su nessun repository pubblico, quindi
        # va installata qui, PRIMA di compilare qualunque altro plugin di questo lancio,
        # cambiata o no lei stessa in questo push. 'install' (non solo 'package') la mette nel
        # repo Maven locale del runner, da cui gli altri 'mvn package' di questo stesso job la
        # risolvono. A runtime non cambia nulla: resta un softdepend vero, gestito dal codice
        # (vedi lang/Messages.java di ogni plugin), non da questa dipendenza di compilazione.
        if: steps.check.outputs.ok == 'true' && steps.plugins.outputs.any == 'true'
        run: mvn -q -B -f plugins-src/MagixLanguage/pom.xml install -DskipTests

      - name: Compila i plugin
        if: steps.check.outputs.ok == 'true' && steps.plugins.outputs.any == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jars"
          : > "$RUNNER_TEMP/manifest"   # righe "cartella<TAB>nomejar"
          while IFS= read -r P; do
            [ -z "$P" ] && continue
            if [ ! -f "plugins-src/$P/pom.xml" ]; then
              echo "salto '$P' (nessun pom.xml)"; continue
            fi
            echo "::group::Compilo $P"
            mvn -q -B -f "plugins-src/$P/pom.xml" package -DskipTests
            # il jar finale: esclude original-*.jar (artefatto dello shade) e *-sources.jar
            JAR="$(ls -1 "plugins-src/$P/target/"*.jar 2>/dev/null | grep -vE '/(original-|.*-sources|.*-javadoc)' | head -n1)"
            if [ -z "$JAR" ]; then echo "::error::Nessun jar prodotto per $P"; exit 1; fi
            cp "$JAR" "$RUNNER_TEMP/jars/"
            printf '%s\t%s\n' "$P" "$(basename "$JAR")" >> "$RUNNER_TEMP/manifest"
            echo "$P -> $(basename "$JAR")"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/plugin_list"
          echo "Jar pronti:"; ls -la "$RUNNER_TEMP/jars"

      - name: Prepara la chiave SSH
        if: steps.check.outputs.ok == 'true' && steps.plugins.outputs.any == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copia i jar e riavvia con preavviso
        if: steps.check.outputs.ok == 'true' && steps.plugins.outputs.any == 'true'
        env:
          DEST: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
        run: |
          set -euo pipefail
          KEY=~/.ssh/deploy_key
          SSH="ssh -i $KEY -o StrictHostKeyChecking=yes $DEST"
          PLUGDIR=/home/ubuntu/magicadventure/plugins

          # 1) Copia ogni jar; per ciascuno rimuove prima le vecchie versioni dello stesso
          #    plugin, poi mette al suo posto quello nuovo (copiato con nome temporaneo).
          # ATTENZIONE allo stdin: ssh legge lo standard input, che qui e' il manifest del
          # ciclo. Senza </dev/null si mangia le righe rimanenti e il ciclo finisce dopo il
          # PRIMO plugin -- gli altri venivano compilati e mai copiati, in silenzio, e il
          # server ripartiva coi jar vecchi (successo verde, deploy a meta').
          while IFS=$'\t' read -r P JARNAME; do
            [ -z "$P" ] && continue
            echo "Aggiorno $P -> $JARNAME"
            scp -i "$KEY" -o StrictHostKeyChecking=yes "$RUNNER_TEMP/jars/$JARNAME" \
                "$DEST:$PLUGDIR/.__new_$JARNAME" </dev/null
            $SSH "cd '$PLUGDIR' && rm -f '$P'-*.jar '$P'.jar && mv '.__new_$JARNAME' '$JARNAME'" </dev/null
            echo "  ok: $JARNAME in posizione"
          done < "$RUNNER_TEMP/manifest"

          # Controllo esplicito: quanti ne dovevano andare, quanti ne sono andati.
          ATTESI=$(grep -c . "$RUNNER_TEMP/manifest")
          echo "Plugin da aggiornare: $ATTESI"
          while IFS=$'\t' read -r P JARNAME; do
            [ -z "$P" ] && continue
            $SSH "test -f '$PLUGDIR/$JARNAME'" </dev/null \
              || { echo "::error::$JARNAME NON e' sul VPS: deploy incompleto"; exit 1; }
          done < "$RUNNER_TEMP/manifest"
          echo "Tutti i $ATTESI jar sono sul VPS."

          # 2) Preavviso ai giocatori (se il server e' su) e stop pulito via CMI stopserverfast
          #    (start.sh rilancia da solo); systemd solo se il server e' spento.
          $SSH 'bash -s' <<'REMOTE'
          set -e
          # dì manda un COMANDO in console; annuncia manda un MESSAGGIO ai giocatori.
          # Senza "say" davanti, il preavviso finiva in console come comando inesistente
          # ("Unknown or incomplete command") e in chat non arrivava niente: il server si
          # riavviava sotto i piedi di chi stava giocando, senza un avviso.
          dì() { screen -S mc -p 0 -X stuff "$(printf '%s\r' "$1")"; }
          annuncia() { dì "say $1"; }
          if screen -list 2>/dev/null | grep -qE '[0-9]+\.mc[[:space:]]'; then
            annuncia "[Aggiornamento] Il server si riavvia tra 60 secondi per aggiornare i plugin..."
            sleep 40
            annuncia "[Aggiornamento] Riavvio tra 20 secondi..."
            sleep 15
            annuncia "[Aggiornamento] Riavvio tra 5 secondi!"
            sleep 5
            # REGOLA (CLAUDE.md): lo STOP si fa con il comando CMI `stopserverfast` in console, che
            # salva tutto e chiude pulito -- NON con un systemctl restart "secco" (SIGTERM). Come per
            # il riavvio notturno (che manda solo `stop`), lo screen `mc` esegue server/start.sh
            # (while true; do java ...; done): quando java esce, start.sh rilancia da solo il server
            # qualche secondo dopo, e i jar nuovi (gia' copiati sopra) vengono caricati.
            dì "stopserverfast"
            echo "Inviato stopserverfast: start.sh rilancera' il server con i plugin aggiornati."
          else
            # Server non in esecuzione (nessuno screen 'mc'): niente da fermare con stopserverfast,
            # lo si avvia via systemd (il sudoers consente systemctl restart senza password).
            sudo systemctl restart magicadventure.service
            echo "Server non attivo: avviato via systemd."
          fi
          echo "Riavvio completato."
          REMOTE

      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
