name: Pulizia file .bak sul VPS

# Sposta (NON cancella) tutte le copie di scorta ".bak-<data>" che ConfigAlign (e CmiModules)
# mettono accanto a un file PRIMA di ogni scrittura — vedi CLAUDE.md, sezione "I CONFIG SUL VPS
# SONO SEMPRE ALLINEATI AL SORGENTE". Normalmente si autolimitano da sole a 10 copie per file, ma
# con tanti plugin e tanti riavvii la cartella del server si riempie lo stesso di file che nessuno
# legge piu'. Non tocca NESSUN file vivo: solo quelli con ".bak-" nel nome.
#
# Cerca in TUTTA la cartella principale del server (/home/ubuntu/magicadventure), non solo dentro
# plugins/: un .bak-... lasciato li' per sbaglio (o da un altro script) rientra comunque.
#
# Finiscono in magicadventure/.bak/..., con lo stesso percorso relativo, tranne per il prefisso
# "plugins/" che viene tolto (un .bak resta organizzato per PLUGIN, senza un livello in piu' inutile
# visto che .bak/ e' gia' fuori da plugins/): quindi
# plugins/CMI/Settings/Modules.yml.bak-20260918-193233 diventa
# .bak/CMI/Settings/Modules.yml.bak-20260918-193233, mentre un .bak trovato direttamente nella
# cartella principale (fuori da plugins/) mantiene il suo percorso cosi' com'e'.
#
# Se trova ancora la vecchia plugins/.bak/ (da una versione precedente di questo workflow, quando
# finiva li'), la fonde dentro la nuova posizione una tantum, PRIMA di cercare — cosi' un run vecchio
# non lascia due cartelle .bak in giro.
#
# Stessa filosofia di rimuovi-plugin.yml (sposta in .rimossi/, non cancella): un file spostato per
# sbaglio si rimette a posto con un mv, uno cancellato no.
#
# Serve alle sessioni CLOUD, che non hanno SSH verso il VPS. Stessi secret del deploy
# (VPS_HOST / VPS_USER / VPS_SSH_KEY). Elenca sempre cosa sposta, cosi' il log del run resta la
# prova di cosa e' cambiato.
#
# Con dry-run=si (default) NON sposta niente: elenca solo cosa sposterebbe. Serve a controllare
# prima di lanciarlo per davvero con dry-run=no.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "si = elenca soltanto (non sposta nulla), no = sposta davvero in magicadventure/.bak/"
        required: false
        default: "si"

jobs:
  pulizia:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che i secret VPS ci siano
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Secret VPS non configurati. Vedi website/vps/AUTO-DEPLOY.md"
            exit 1
          fi

      - name: Prepara la chiave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Elenca (ed eventualmente sposta) i file .bak
        env:
          DEST: "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          IN_DRYRUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes $DEST"
          $SSH "DRYRUN='${IN_DRYRUN:-si}' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/home/ubuntu/magicadventure
          BAKDIR="$BASE/.bak"
          OLDBAKDIR="$BASE/plugins/.bak"
          RIMOSSIDIR="$BASE/plugins/.rimossi"

          # Una tantum: la posizione precedente di questo workflow era plugins/.bak/. Se esiste
          # ancora, si fonde dentro la nuova cartella (cp -a + rm, non una semplice mv: cosi'
          # funziona anche se BAKDIR esiste gia' con dentro qualcosa).
          if [ -d "$OLDBAKDIR" ]; then
            mkdir -p "$BAKDIR"
            cp -a "$OLDBAKDIR"/. "$BAKDIR"/
            rm -rf "$OLDBAKDIR"
            echo "Portata la vecchia plugins/.bak/ dentro $BAKDIR/."
          fi

          # Lo stesso schema di nome usato da ConfigAlign/CmiModules: "<file>.bak-<yyyyMMdd-HHmmss>".
          # -name con '*.bak-*' prende sia config.yml.bak-... sia Modules.yml.bak-... OVUNQUE sotto
          # la cartella del server, non solo dentro plugins/. -path esclude BAKDIR stesso (un run
          # gia' eseguito non deve rispostare quello che ha gia' spostato lui) e RIMOSSIDIR: i .bak
          # dentro un plugin gia' disinstallato (plugins/.rimossi/<Plugin>.dati.<data>/...) sono
          # backup di un backup ormai inutile, e restano dov'erano.
          mapfile -d '' -t TROVATI < <(find "$BASE" -type f -name '*.bak-*' \
              -not -path "$BAKDIR/*" -not -path "$RIMOSSIDIR/*" -print0 | sort -z)

          if [ "${#TROVATI[@]}" -eq 0 ]; then
            echo "Nessun file .bak trovato sotto $BASE (fuori da .bak/ e plugins/.rimossi/)."
            exit 0
          fi

          echo "Trovati ${#TROVATI[@]} file .bak:"
          TOTALE=0
          DESTS=()
          for F in "${TROVATI[@]}"; do
            DIM="$(stat -c%s "$F" 2>/dev/null || echo 0)"
            TOTALE=$((TOTALE + DIM))
            REL="${F#"$BASE"/}"
            # Sotto plugins/ resta organizzato per PLUGIN (si toglie il prefisso "plugins/", un
            # livello in piu' che non aggiunge niente visto che .bak/ e' gia' fuori da li'); un .bak
            # trovato altrove nella cartella del server mantiene il suo percorso relativo cosi' com'e'.
            case "$REL" in
              plugins/*) DEST_REL="${REL#plugins/}" ;;
              *) DEST_REL="$REL" ;;
            esac
            DESTS+=("$BAKDIR/$DEST_REL")
            echo "  $F  ->  $BAKDIR/$DEST_REL"
          done
          echo "Spazio occupato: $((TOTALE / 1024)) KB"

          if [ "${DRYRUN:-si}" = "si" ]; then
            echo
            echo "dry-run=si: NON ho spostato nulla. Rilancia con dry-run=no per spostarli davvero."
            exit 0
          fi

          echo
          echo "Sposto..."
          for i in "${!TROVATI[@]}"; do
            F="${TROVATI[$i]}"
            DEST_F="${DESTS[$i]}"
            mkdir -p "$(dirname "$DEST_F")"
            mv -- "$F" "$DEST_F"
          done
          echo "Fatto: spostati ${#TROVATI[@]} file .bak in $BAKDIR/ ($((TOTALE / 1024)) KB)."
          REMOTE

      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
