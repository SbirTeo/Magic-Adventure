# ============================================================
#  MAGICADVENTURE - istanze governabili dal gestionale del sito
#  (Gestione sito -> scheda "Server")
# ============================================================
#  Va in /etc/magicadventure/istanze.conf ed e' l'UNICO elenco di
#  cose che il sito puo' accendere, spegnere e comandare: quello
#  che non e' scritto qui, dal sito non si tocca.
#  Dopo averlo modificato non serve riavviare niente: la pagina
#  lo rilegge a ogni aggiornamento.
#
#  Formato di una riga (i campi si separano con "|", l'ordine non conta):
#
#    istanza <id> | chiave=valore | chiave=valore | ...
#
#      nome      etichetta mostrata sul sito
#      screen    nome della sessione screen (screen -ls)
#      servizio  unita' systemd che la avvia/ferma (consigliato)
#      cartella  cartella di lavoro del server
#      log       file di log da mostrare in console (anche relativo a "cartella");
#                se manca, si mostra la copia della screen
#      utente    utente di sistema proprietario della screen (di serie: ubuntu)
#      porta     porta Minecraft, per leggere online/giocatori dal sito
#      processo  pezzo di riga di comando che identifica il processo (per "e' vivo?"
#                e per la chiusura forzata)
#      avvio     comando di avvio, SOLO per le istanze senza servizio systemd
# ------------------------------------------------------------

istanza mc | nome=Server principale (Paper) | screen=mc | servizio=magicadventure.service | cartella=/home/ubuntu/magicadventure | log=logs/latest.log | utente=ubuntu | porta=25565 | processo=paper.jar

# ------------------------------------------------------------
#  Le modalita' che verranno: si aggiungono qui, una riga a testa,
#  e compaiono da sole nel gestionale con i loro pulsanti.
#  Esempi pronti da adattare (togliere il # davanti):
#
# istanza proxy  | nome=Proxy Velocity      | screen=proxy  | servizio=magix-proxy.service  | cartella=/home/ubuntu/proxy  | log=logs/latest.log | porta=25577 | processo=velocity
# istanza lobby  | nome=Lobby               | screen=lobby  | servizio=magix-lobby.service  | cartella=/home/ubuntu/lobby  | log=logs/latest.log | porta=25566 | processo=lobby/paper.jar
# istanza eventi | nome=Mondo eventi        | screen=eventi | cartella=/home/ubuntu/eventi | log=logs/latest.log | porta=25567 | processo=eventi/paper.jar | avvio=./start.sh
# ------------------------------------------------------------

# ============================================================
#  Opzioni generali
# ============================================================
#  screen_esterni: cosa si puo' fare, dal sito, con le screen che NON
#  sono elencate qui sopra (quelle aperte a mano via SSH).
#     lettura = si vedono e si legge cosa c'e' dentro (predefinito)
#     pieno   = si puo' anche scrivere dentro e chiuderle. ATTENZIONE:
#               una screen aperta su una shell diventa una shell di root-utente
#               comandabile dal browser, quindi si usa solo se serve davvero.
#     no      = non si vedono nemmeno
opzione screen_esterni=lettura

# Utenti di cui elencare le screen, oltre a quelli delle istanze qui sopra.
# Piu' di uno: separati da virgola.
opzione utenti=ubuntu
