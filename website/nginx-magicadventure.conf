# Indirizzi senza .php: qui si calcola dove mandare (301) chi arriva ancora al vecchio
# indirizzo col .php. Valore vuoto = nessun redirect.
# Solo GET/HEAD: un 301 su una POST farebbe perdere i dati del modulo (il browser la
# rispedisce come GET). Le riscritture interne di try_files non entrano qui perche'
# $request_uri resta quello chiesto dal client, senza .php.
map "$request_method|$request_uri" $indirizzo_pulito {
    default                                                     "";
    # Indirizzi "parlanti" di blog e forum: chi arriva al vecchio indirizzo con la domanda
    # in coda (?slug=, ?id=) viene mandato una volta per tutte a quello nuovo. Vale sia col
    # .php sia senza, perche' il primo giro di pulizia toglie solo l'estensione.
    "~^(?:GET|HEAD)\|/blog/post(?:\.php)?\?slug=(?<bs>[a-z0-9-]+)$"           "/blog/$bs";
    "~^(?:GET|HEAD)\|/forum/category(?:\.php)?\?slug=(?<fc>[a-z0-9-]+)$"      "/forum/$fc";
    "~^(?:GET|HEAD)\|/forum/topic(?:\.php)?\?id=(?<ft>[0-9]+)$"               "/forum/discussione/$ft";
    "~^(?:GET|HEAD)\|/page\.php\?slug=(?<pg>[A-Za-z0-9._-]+)$"  "/pagina/$pg";
    "~^(?:GET|HEAD)\|/index\.php(?<qh>\?.*)?$"                  "/$qh";
    "~^(?:GET|HEAD)\|(?<dir>/.+)/index\.php(?<qi>\?.*)?$"       "$dir$qi";
    "~^(?:GET|HEAD)\|(?<pt>[^?]*)\.php(?<qs>\?.*)?$"            "$pt$qs";
}

# Immagini in WebP per chi le capisce (praticamente tutti i browser dal 2020). Accanto a
# ogni copertina caricata dal gestionale c'e' un gemello "<nome>.png.webp" che pesa un
# quinto (lo crea includes/immagini.php); qui si decide quale dei due mandare, senza che
# cambi nulla nell'indirizzo, nelle pagine o nel database.
map $http_accept $webp_gemello {
    default          "";
    "~*image/webp"   ".webp";
}

# HTTP: tutto redirige a HTTPS sul dominio canonico (apex)
server {
    listen 80;
    listen [::]:80;
    server_name magicadventure.it www.magicadventure.it;
    return 301 https://magicadventure.it$request_uri;
}

# HTTPS www: redirige sempre all'apex (dominio canonico)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.magicadventure.it;

    ssl_certificate /etc/letsencrypt/live/magicadventure.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicadventure.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://magicadventure.it$request_uri;
}

# HTTPS apex: sito vero
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Una connessione sola per tutta la pagina invece di sei: con una ventina di file fra
    # foglio di stile, copioni e faccine dei giocatori si sente, soprattutto da telefono.
    http2 on;
    server_name magicadventure.it;

    root /var/www/magicadventure/public;
    index index.php;

    include snippets/magicadventure-sicurezza.conf;

    # Compressione: di serie nginx comprime SOLO l'HTML, quindi il foglio di stile (135 kB)
    # partiva intero a ogni prima visita. Con questa lista scende a una trentina di kB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/xml+rss
               application/json application/javascript text/javascript image/svg+xml;

    # Immagini caricate dal gestionale: servono qualche MB in piu' del solito (di serie
    # nginx si ferma a 1 MB, e il caricamento fallirebbe prima ancora di arrivare a PHP).
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/magicadventure.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicadventure.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- INDIRIZZI PARLANTI ---------------------------------------------------------
    # Stanno qui, a livello di server, e non dentro una location: cosi' agiscono sulla
    # richiesta ORIGINALE, prima che nginx scelga dove mandarla, e non c'e' modo che una
    # riscrittura interna (che finisce sempre in .php) ripassi da qui e giri a vuoto.
    # Gli slug del sito sono solo minuscole, cifre e trattini (vedi slugify), quindi
    # "/blog/post.php" non puo' mai finire per sbaglio in questi schemi.
    # I nomi dei file veri (post, new, index, topic...) restano fuori: se li riscrivessi,
    # il vecchio indirizzo /blog/post?slug=xxx finirebbe su se stesso perdendo lo slug,
    # invece di prendersi il suo bel redirect definitivo qualche riga piu' sotto.
    rewrite ^/blog/(?!new$|post$|index$)([a-z0-9-]+)/?$   /blog/post.php?slug=$1 last;
    rewrite ^/forum/discussione/([0-9]+)/?$              /forum/topic.php?id=$1 last;
    rewrite ^/forum/(?!new_topic$|topic$|category$|index$|discussione$)([a-z0-9-]+)/?$
                                                         /forum/category.php?slug=$1 last;

    # Mappa del sito per i motori di ricerca: si costruisce da sola dal database.
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    location / {
        # /regolamento serve regolamento.php. ATTENZIONE: il .php deve stare nell'ULTIMO
        # parametro di try_files. Solo l'ultimo e' una riscrittura interna che ripassa dalle
        # location (e quindi esegue PHP); gli altri servono il file cosi' com'e', e con
        # "$uri.php" in mezzo nginx spedirebbe al browser il CODICE SORGENTE della pagina.
        try_files $uri $uri/ $uri.php$is_args$args;
    }

    # store.php e la cartella store/ si chiamano uguale: senza questa riga /store finirebbe
    # sulla cartella (che non ha un index) invece che sulla pagina dello store.
    location = /store {
        rewrite ^ /store.php last;
    }

    # Forum e blog sono cartelle con dentro un index.php, non file singoli: nginx da solo
    # aggiungerebbe la barra finale (/forum/). Qui li serviamo senza barra, come tutto il resto.
    location ~ ^/(forum|blog)$ {
        rewrite ^ $uri/index.php last;
    }

    # E chi arriva con la barra finale viene mandato (301) all'indirizzo senza.
    location ~ ^/(forum|blog|store)/$ {
        return 301 /$1$is_args$args;
    }

    # Pagine create dal gestionale: /pagina/<slug> invece di /page.php?slug=<slug>
    location ^~ /pagina/ {
        rewrite ^/pagina/([A-Za-z0-9._-]+)/?$ /page.php?slug=$1 last;
        return 404;
    }

    # Pagina dedicata di un pacchetto dello store: /pacchetto/<slug>
    location ^~ /pacchetto/ {
        rewrite ^/pacchetto/([A-Za-z0-9._-]+)/?$ /pacchetto.php?slug=$1 last;
        return 404;
    }

    # Il singolo provvedimento: /sanzione/<numero>. L'elenco (/sanzioni) passa dal
    # try_files generale, come /regolamento.
    location ^~ /sanzione/ {
        rewrite ^/sanzione/([0-9]+)/?$ /sanzione.php?id=$1 last;
        return 404;
    }

    # In /assets/ ci finiscono anche i file caricati dal gestionale: li' dentro PHP non si
    # esegue mai. Il nome dei file lo decide il server (estensione dedotta dal contenuto),
    # questa e' la rete di sicurezza sotto.
    location ^~ /assets/ {
        location ~ \.php$ { return 404; }

        # Foglio di stile e copioni: un anno di cache, senza nemmeno richiedere conferma al
        # server ("immutable"). Si puo' osare perche' l'indirizzo porta sempre in coda
        # ?v=<data del file> (vedi header.php): cambiato il file, cambia l'indirizzo, e il
        # browser e' costretto a riscaricarlo.
        location ~ ^/assets/(?:css|js)/ {
            include snippets/magicadventure-sicurezza.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Fotografie e disegni: un mese di cache e, quando esiste, il gemello in WebP al
        # posto dell'originale. "Vary: Accept" e' obbligatorio, se no una cache di mezzo
        # (o quella del browser) rischia di riproporre il WebP a chi non lo capisce.
        # Qui niente "immutable": il nome del file resta lo stesso anche se lo si sostituisce.
        location ~* \.(?:png|jpe?g)$ {
            include snippets/magicadventure-sicurezza.conf;
            add_header Cache-Control "public, max-age=2592000";
            add_header Vary "Accept";
            try_files $uri$webp_gemello $uri =404;
        }

        location ~* \.(?:gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
            include snippets/magicadventure-sicurezza.conf;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        try_files $uri =404;
    }

    location ~ \.php$ {
        # Chi arriva col vecchio indirizzo .php viene mandato a quello pulito.
        if ($indirizzo_pulito) {
            return 301 $indirizzo_pulito;
        }
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
