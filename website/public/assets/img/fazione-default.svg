    <clipPath id="dentro"><path d="M32 9.5 51 15.5v15.8c0 11.6-8 20.4-19 25.2C21 51.700 13 42.900 13 31.300V15.500Z"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>
