      <path d="M13.500 47c0-6.500 3.600-10.500 9-10.500s9 4 9 10.500Z"/>
      <circle cx="41.500" cy="29.500" r="4"/>
      <path d="M32.500 47c0-6.500 3.600-10.500 9-10.500s9 4 9 10.500Z"/>
    </g>
    <g fill="#fff" stroke="#5a2fb8" stroke-width="1.600" paint-order="stroke">
