  <path d="M32 9.500 51 15.500v15.800c0 11.600-8 20.400-19 25.200C21 51.700 13 42.900 13 31.300V15.500Z" fill="none" stroke="#f0d9ff" stroke-opacity=".7" stroke-width="1.500" stroke-linejoin="round"/>
