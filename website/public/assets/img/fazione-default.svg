  <g fill="url(#oro)">
    <path d="m32 11.600 1.300 2.700 2.900.4-2.100 2 .5 2.900-2.600-1.400-2.600 1.400.5-2.900-2.100-2 2.900-.4Z" transform="translate(0 -.8)"/>
