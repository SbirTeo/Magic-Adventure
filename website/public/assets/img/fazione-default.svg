<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stemma di fazione">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34265c"/>
      <stop offset="1" stop-color="#171129"/>
    </linearGradient>
    <linearGradient id="scudo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6cf0"/>
      <stop offset="1" stop-color="#5a2fb8"/>
