# Intestazioni di sicurezza del sito — va in /etc/nginx/snippets/magicadventure-sicurezza.conf
#
# Sta in un file a parte perche' nginx ha una regola scomoda: appena una "location" scrive
# un suo add_header, PERDE tutti quelli del blocco server. Quindi ogni location che aggiunge
# intestazioni (per esempio la cache di /assets/) deve rimetterle, e riscriverle a mano in
# cinque punti diversi e' il modo migliore per dimenticarsene una.

# Un anno di solo-HTTPS: il browser non prova nemmeno a chiedere la versione in chiaro.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Niente "indovina il tipo di file": un .txt caricato resta un .txt, non diventa uno script.
add_header X-Content-Type-Options "nosniff" always;
# Il sito non si puo' incorniciare dentro un altro sito (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;
# Verso l'esterno esce il dominio, non l'indirizzo completo della pagina di provenienza.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Il sito non usa posizione, microfono e telecamera: qui glieli si toglie proprio.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
