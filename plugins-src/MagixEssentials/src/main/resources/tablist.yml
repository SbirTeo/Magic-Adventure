# ============================================================
#  MagixEssentials - Tablist
# ============================================================
# Le impostazioni del TABLIST, la lista giocatori che si apre col tasto Tab: intestazione, fondo,
# nome dei giocatori e caselle fisse.
#
# Questo file dice COM'E' FATTO il tablist, non se c'e': l'interruttore sta nel modules.yml
# (tablist: true/false). A modulo spento questo file resta qui, intatto, e torna in uso appena lo
# si riaccende.
#
# NB: il tablist ce l'ha chi scrive per ultimo. Se lo gestiamo noi, DISATTIVA quello di CMI
# (plugins/CMI/Settings/Modules.yml -> tablist: false) per evitare che si sovrascrivano a vicenda.

# Ogni quanti tick (20 = 1 secondo) si riaggiornano intestazione, fondo e nomi. Abbassalo pure
# per un'animazione piu' fluida (vedi animation-period-seconds sotto): le 80 slot finte NON
# seguono questo numero, si rimandano al massimo una volta al secondo per conto loro (vedi
# fixed-slots piu' sotto) — quindi un valore basso qui non intasa il pacchetto piu' pesante.
update-interval-ticks: 20

# Durata di un giro completo di una sfumatura animata ({gradient-phase}/{rainbow-phase}, vedi
# sotto), in secondi. Un'animazione e' fatta a scatti: si vede scorrere solo se update-interval-
# ticks e' piu' rapido di questo numero, quindi abbassarlo sotto l'intervallo di aggiornamento
# non serve a nulla — abbassa prima quello. Per {rainbow-phase} c'e' anche un tetto naturale:
# vale solo un intero da 0 a 9 (limite del tag <rainbow>), quindi sotto i 10 redraw per giro non
# si guadagna altro — con animation-period-seconds: 1.0 bastano gia' update-interval-ticks: 2.
animation-period-seconds: 4.0

# --- CHI VINCE SUL TABLIST ---
# Il tablist non ha un proprietario: ce l'ha chi ha scritto per ultimo. Se anche CMI gestisce il
# tablist, i due si sovrascrivono a vicenda e il risultato dipende dall'ordine, cioe' dal caso.
# Questa sezione ci fa scrivere DOPO di lui.
# ATTENZIONE, il limite: valgono intestazione, fondo e nomi. Le caselle FINTE che CMI inietta
# (le 80 slot, con testa e tacchette di connessione) sono voci sue mandate via pacchetto: da qui
# non si tolgono. Per farle sparire si spegne il suo modulo:
# plugins/CMI/Settings/Modules.yml -> tablist: false
priority:
  # Se true, ogni aggiornamento viene riscritto una seconda volta poco dopo, per arrivare dopo
  # chi ha scritto nello stesso tick. Spegnila se il tablist e' gestito solo da noi: dimezza il lavoro.
  enabled: true
  # Quanti tick dopo arriva la seconda scrittura. 2 basta contro un plugin che scrive nello stesso
  # tick; alzalo (5-10) solo se vedi ancora il tablist di CMI comparire per un istante.
  reassert-delay-ticks: 2

# Segnaposto speciale {logo}: viene sostituito con il carattere del LOGO del server
# (la texture nel resource pack di MagixFactions). Dimensione/posizione del logo si regolano
# nel config di MagixFactions (tablist.logo.height/ascent).
#
# Supporta i codici colore & e &#RRGGBB, i placeholder di PlaceholderAPI (%server_online%,
# %magixfactions_*%, %magixtime_*%, ...) E i tag di MiniMessage: <bold>, <color:#C046E8>,
# <gradient:#C046E8:#A8DC2C>Testo</gradient>, <rainbow>Testo</rainbow>. In una riga vale l'uno O
# l'altro: se c'e' un tag (< seguito da una lettera), quella riga si legge come tag e le &
# restano scritte com'erano — stessa regola della MOTD.
#
# --- ANIMARE UNA SFUMATURA ---
# <gradient:...> e <rainbow> accettano un ultimo numero, la "fase": cambiandolo nel tempo la
# sfumatura SCORRE invece di restare ferma. Il plugin lo calcola da solo e lo mette al posto di
# due segnaposto, uno per tag (i numeri che vogliono i due tag NON sono compatibili fra loro):
#   <gradient:#C046E8:#A8DC2C:{gradient-phase}>Testo</gradient>   (decimale, -1.0..1.0)
#   <rainbow:{rainbow-phase}>Testo</rainbow>                       (intero, 0..9)
# Un giro completo dura animation-period-seconds (sotto). Nessun altro colore del tablist si
# anima da solo: {gradient-phase}/{rainbow-phase} funzionano SOLO dentro questi due tag, scritti
# a mano dove servono.
#
# --- BANDA PIU' STRETTA (ripetere l'animazione piu' volte sullo stesso testo) ---
# Un <rainbow> o <gradient> solo fa un giro di colori largo quanto tutto il testo dentro il tag:
# per farlo ripetere (bande piu' strette) servirebbe spezzare il testo a mano in piu' tag uguali,
# scomodo da scrivere. Scorciatoia pronta, un tag SOLO:
#   <rainbow-x3>Testo</rainbow-x3>                          (il numero = quante ripetizioni)
#   <gradient-x3:#C046E8:#A8DC2C>Testo</gradient-x3>         (stessi colori di sempre, prima del testo)
# Il plugin spezza "Testo" in altrettanti pezzi (il piu' possibile uguali) e mette ciascuno nel suo
# <rainbow:{rainbow-phase}>/<gradient:...:{gradient-phase}> vero, gia' con la fase — non serve
# scriverla. Piu' alto il numero, piu' stretta la banda. Con piu' lettere del testo non succede
# niente di male: il plugin non fa piu' pezzi di quante lettere ci sono.
#
# Le righe " " (spazio) sotto {logo} servono a dare aria: il logo NON e' testo, e' un carattere
# alto quanto un'immagine (assets/magicadventure/textures/gui/logo.png, iniettato nel font di
# MagixFactions), e la sua altezza NON si adatta da sola alle righe che vengono dopo. Se le righe
# vuote sono troppo poche, il logo finisce SOTTO la sua stessa riga e copre quella successiva.
#
# Quante servono si calcola da due numeri di MagixFactions (config.yml -> tablist.logo, in pixel
# di gioco): height (quanto e' alto il logo) e ascent (quanto sale sopra la riga — puo' essere
# negativo, e allora il logo scende TUTTO sotto la riga invece di salire sopra). Il logo si estende
# da 'ascent' pixel sopra la riga fino a 'ascent - height' pixel sotto: quanto scende sotto e'
# quindi 'height - ascent'. Una riga di testo normale e' alta 9 pixel, quindi le righe vuote che
# servono sono (height - ascent) / 9, arrotondato per eccesso.
# Esempio con i valori di ORA (height: 78, ascent: -8): (78 - (-8)) / 9 = 9,6 -> servono almeno 10
# righe vuote; qui ce ne sono 11, con un margine di una riga.
# Cambiando quei due numeri in MagixFactions vanno ricalcolate anche queste: se il logo torna a
# coprire le informazioni, e' segno che sono di nuovo troppo poche.
header:
  - '{logo}'
  - ' '
  - ' '
  - ' '
  - ' '
  - ' '
  - ' '
  - ' '
  - ' '
  - ' '
  - ' '
  - '&8&m                                                  '
  - '&7Giocatori online &8» &a%server_online%&7/&f%server_max_players%    &8•    &7Ping &8» &a%player_ping%&7ms'
  - '&8&m                                                  '

footer:
  - '&8&m                                                  '
  - '&7Fazione &8» &d%magixfactions_faction%     &7Potenza &8» &a%magixfactions_power_player%&7/&f%magixfactions_maxpower_player%     &7Claim &8» &f%magixfactions_claims%'
  - '&7Saldo &8» &6%vault_eco_balance_formatted%     &7Mondo &8» &f%player_world% &8(&7%player_x%&8, &7%player_y%&8, &7%player_z%&8)'
  - '&5%magixtime_time%  &8•  &d%magixtime_date%     &8•     &7Stagione &8» &a%magixtime_season%     &8•     &7Meteo &8» &f%magixtime_weather%'
  - '&8&m                                                  '
  - '&8» &d&lmagicadventure.it &8«'

# Nome del giocatore nella lista. {name} = nome del giocatore. Supporta colori e placeholder
# (es. %magixweb_namecolor% = colore del grado, come sul sito).
player-name: '&7%magixweb_namecolor%{name}'

# --- ORDINE DEI GIOCATORI ---
# Il gioco, di suo, mette prima chi non ha una squadra (scoreboard team) e poi ordina per nome:
# non per grado. Con questo acceso, i giocatori VERI vengono messi avanti a tutto (comprese le
# caselle finte, sempre in fondo) e ordinati fra loro dal PESO piu' alto al piu' basso del loro
# gruppo LuckPerms (lo stesso 'weight' che decide anche il colore del nome, vedi
# %magixweb_namecolor%): il grado piu' importante sta per primo.
# Richiede LuckPerms: se manca, questa chiave non fa niente e resta l'ordine del gioco.
sort-by-rank-weight: true

# --- 80 SLOT FISSE ---
# Il gioco decide da solo quante colonne disegnare in base a quante voci ci sono: con pochi
# giocatori il tab e' una colonna sottile, con tanti si allarga. Se sotto ci deve stare una
# pergamena, quella misura non puo' ballare. Con questo acceso il tablist mostra SEMPRE 'total'
# caselle: quelle senza giocatore sono decorative, SENZA testa (skin trasparente) e SENZA
# tacchette di connessione (latenza -1).
# Le colonne sono anche larghe quanto un nickname vanilla puo' esserlo (16 caratteri), non
# strette quanto il nome vero piu' corto in lista: il plugin aggiunge da solo spazi invisibili
# al testo delle caselle vuote apposta per questo, vedi FixedSlots.WIDTH_PADDING nel codice.
# C'e' un limite che NESSUN plugin puo' togliere: dietro ogni voce del tablist (vera o finta) il
# client disegna sempre un rettangolo semitrasparente, e il colore lo decide un'opzione del SUO
# client (Opzioni -> Chat -> Trasparenza sfondo chat), non il server: chi lo vuole invisibile la
# spegne da solo, per tutte le voci.
# Richiede ProtocolLib: se manca, il plugin lo dice nel log e resta il tablist dinamico.
# NB: perche' si vedano, il tablist dev'essere NOSTRO. Se lo gestisce ancora CMI, spegni il suo
# modulo (plugins/CMI/Settings/Modules.yml -> tablist: false).
# NB: restano sempre IN FONDO alla lista, dopo tutti i giocatori veri (vedi sort-by-rank-weight):
# e' cosi' che 'primo' vuol dire davvero primo, non "primo fra le caselle finte".
# NB: il pacchetto che le manda (80 voci, ProtocolLib) e' la cosa piu' pesante di questo modulo, e
# NON segue update-interval-ticks: si rimanda al massimo una volta al secondo, sempre, anche se
# update-interval-ticks e' bassissimo per un'animazione. Un valore fisso, non configurabile: non
# serve mai piu' spesso di cosi', dato che il contenuto delle caselle vuote non cambia da solo.
fixed-slots:
  # Interruttore delle caselle fisse.
  enabled: true
  # Quante caselle in tutto. Il gioco ne disegna al massimo 80 (4 colonne x 20): oltre, le voci
  # in piu' non si vedrebbero, e il plugin taglia a 80.
  total: 80
  # Cosa c'e' scritto in una casella vuota. Uno spazio = casella muta. Valgono i codici colore &.
  empty-text: ' '
