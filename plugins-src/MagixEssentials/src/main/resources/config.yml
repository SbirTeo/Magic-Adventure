# ============================================================
#  MagixEssentials - Configurazione di base
# ============================================================
# Qui stanno le impostazioni che valgono per il PLUGIN INTERO, non per una funzione sola.
# Per ora non ce n'e' nessuna: il plugin fa una cosa sola, e quella cosa ha il suo file.
#
# Come sono divisi i file, sul modello di CMI:
#   modules.yml   - l'elenco delle funzioni, una riga ciascuna: acceso o spento.
#   <funzione>.yml - le impostazioni di quella funzione (oggi: tablist.yml).
#   config.yml    - questo file: la configurazione di base del plugin.
#
# Cosi' per sapere che cosa sta facendo il plugin si apre modules.yml, e per cambiare come lo fa
# si apre il file di quella funzione: non c'e' un file unico che cresce all'infinito.
