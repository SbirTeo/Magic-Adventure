# ============================================================
#  MagixEssentials - Chat
# ============================================================
# Il FORMATO della chat pubblica: come si legge in gioco una riga scritta da un giocatore (o dalla
# chat del sito). Su ogni server della rete è questo modulo a scriverla: CMI la chat non la tocca
# più (vedi cmi.disable-module in fondo).
#
# Questo file dice COM'E' FATTA la riga, non se c'è: l'interruttore sta nel modules.yml
# (chat: true/false).
#
# Valgono i codici colore & e &#RRGGBB, i tag <bold>/<gradient:...> (MiniMessage) e TUTTI i
# placeholder di PlaceholderAPI, risolti per chi scrive (%luckperms_prefix%, %magixweb_namecolor%...),
# compresi quelli relazionali %rel_...% (fra chi legge e chi scrive). Segnaposto:
#   {name}     il nome di chi scrive
#   {message}  il messaggio, sempre come testo semplice: chi scrive non può metterci colori né
#              placeholder
# Solo con MagixFactions sullo stesso server (sul faction):
#   {faction}  la fazione di chi scrive
#   {relcolor} il colore della relazione fra la fazione di chi legge e quella di chi scrive
#              (verde la tua, magenta un'alleata, rosso le altre: relations.colors di MagixFactions)
#   {rank}     il tag del suo grado di fazione, nel colore della relazione
#
# PEZZI FACOLTATIVI: quello che sta fra [[ e ]] sparisce se TUTTI i segnaposto e i placeholder che
# contiene risultano vuoti. Così "[[&8[{faction}&8] ]]" mostra [Fazione] a chi ce l'ha e niente a chi
# non ce l'ha (o la nasconde col permesso magixfactions.chat.hidefactions), senza bisogno di due righe.
#
# I canali di fazione e alleati (/f chat) restano a MagixFactions: sono una funzione delle fazioni,
# e una riga scritta lì non arriva mai qui.

# La riga scritta a mano per QUESTO server: se c'è, vince su tutto (anche sugli stili qui sotto).
# Vuota (di fabbrica) = decide lo stile: è così che lo stesso jar va bene su ogni modalità.
custom-format: ""

# Quale stile si usa quando custom-format è vuota:
#   auto          - (di fabbrica) il primo dell'elenco qui sotto i cui plugin ci sono TUTTI. È la
#                   rilevazione della modalità: sul faction (c'è MagixFactions) esce lo stile
#                   factions, sull'hub (non c'è) quello senza requisiti.
#   <nome stile>  - quello e basta, che i suoi plugin ci siano o no.
# Quale ha scelto lo scrive nel log all'avvio e a ogni /magixessentials reload.
style: auto

# Gli stili: una voce per modalità di gioco, come gli stili del nametag (nametag.yml). Si leggono
# dall'alto in basso e vince il primo che va bene: quelli con più pretese in cima, quello che non
# chiede niente (requires vuoto) in fondo. Di ogni voce: 'name' il nome, 'requires' i plugin che
# devono esserci TUTTI (è una E: per due modalità si scrivono due voci), 'format' la riga.
# Fra i requisiti vanno solo i plugin senza cui lo stile non ha senso: MagixBridge
# (%magixweb_namecolor%) no, se manca il nome resta senza colore; MagixFactions in uno stile che
# scrive la fazione sì. I plugin si cercano fra quelli CARICATI (l'ordine di accensione non conta).
# Per una modalità NUOVA si aggiunge una voce qui, sopra quella senza requisiti: è un elenco, e
# l'allineamento dei config non tocca le voci in più.
styles:
  # Fazioni: [grado+fazione] nel colore della relazione di chi legge, poi grado di server e nome.
  # Chi non ha una fazione perde da solo il pezzo fra [[ ]].
  - name: factions
    requires: [MagixFactions]
    format: "[[&8[{rank}{relcolor}{faction}&8] ]]%luckperms_prefix%&7%magixweb_namecolor%{name} &8» &f{message}"
  # Nessuna modalità riconosciuta (l'hub): grado di server e nome col colore del grado. Non chiede
  # niente, quindi va sempre bene: per questo sta in fondo.
  - name: plain
    requires: []
    format: "%luckperms_prefix%&7%magixweb_namecolor%{name} &8» &f{message}"

# Icona messa davanti ai messaggi che arrivano dalla chat del sito (plugin MagixBridge). Vuota di
# serie: da dove arriva il messaggio lo dice il suggerimento qui sotto. Es. "&b☁ " per vederla sempre.
web-prefix: ""

# Il suggerimento che compare passando il mouse su una riga: ora e provenienza. In chiaro davanti
# a ogni riga ruberebbero spazio; nel suggerimento si vedono solo quando servono.
tooltip:
  enabled: true
  # {ora} = l'ora del messaggio, {origine} = una delle due righe sotto
  format: "&7{ora}  &8•  {origine}"
  game: "&a⛏ scritto in gioco"
  web: "&b☁ scritto dal sito"

# CMI ha una sua chat (formato, colori, filtri, menzioni, fumetti sopra la testa): con questo
# modulo acceso non deve fare niente, altrimenti due plugin scrivono la stessa riga. Acceso, il
# modulo spegne una volta per tutte i controlli della chat di CMI nei suoi file (Settings/Chat.yml,
# Settings/ChatFilter.yml, Settings/Modules.yml), con una copia di scorta in .bak/. Il filtro della
# chat (pubblicità, spam, insulti) lo fa MagixGuard. CMI quei file li legge all'avvio: vale dal
# riavvio dopo. I messaggi privati (/msg) restano a CMI.
cmi:
  disable-module: true
