name: MagixEssentials
version: '${project.version}'
main: com.teolo.magixessentials.MagixEssentials
api-version: '26.1'
author: teolo
description: "Utilita' del server (MOTD, nametag, chat e, in futuro, cio' che oggi fa CMI)."
# PlaceholderAPI: opzionale. Se presente, i placeholder %...% nei nametag vengono risolti
# (compresi i relazionali %rel_...%). Senza di lui restano scritti come sono.
# ProtocolLib: opzionale. Serve al nametag in modalita' display (entita' di testo).
softdepend: [PlaceholderAPI, ProtocolLib]
commands:
  magixessentials:
    description: "Comandi di MagixEssentials (per ora, reload)."
    aliases: [mess, magixess]
    permission: magixessentials.admin
permissions:
  magixessentials.admin:
    description: "Gestione di MagixEssentials (reload)."
    default: op
  magixessentials.chat.links:
    description: "I link scritti nella chat pubblica diventano cliccabili. Vale anche il vecchio magixfactions.chat.links."
    default: op
