name: MagixEssentials
version: '${project.version}'
main: com.teolo.magixessentials.MagixEssentials
api-version: '26.1'
author: teolo
description: "Utilita' del server (tablist, MOTD, nametag, chat, valute, oggetti fissi dell'inventario e, in futuro, cio' che oggi fa CMI)."
# PlaceholderAPI: opzionale. Se presente, i placeholder %...% nel tablist e nei nametag vengono
# risolti (compresi i relazionali %rel_...%). Senza di lui restano scritti come sono.
# ProtocolLib: opzionale. Serve al nametag in modalita' display (entita' di testo).
# LuckPerms: opzionale. Se presente, il tablist puo' ordinare i giocatori per peso del grado
# (tablist.yml -> sort-by-rank-weight). Senza di lui resta l'ordine del gioco.
# MagixLanguage: opzionale. Se presente, i messaggi delle valute vengono tradotti nella lingua
# di chi legge. Senza di lui restano in italiano.
softdepend: [PlaceholderAPI, ProtocolLib, LuckPerms, MagixLanguage]
commands:
  magixessentials:
    description: "Comandi di MagixEssentials (reload, joinitems)."
    aliases: [mess, magixess]
    permission: magixessentials.admin
permissions:
  magixessentials.admin:
    description: "Gestione di MagixEssentials (reload)."
    default: op
  magixessentials.chat.links:
    description: "I link scritti nella chat pubblica diventano cliccabili. Vale anche il vecchio magixfactions.chat.links."
    default: op
  magixessentials.customjoinitems.bypass:
    description: "Salta le regole del modulo customjoinitems: muovere, buttare, raccogliere, rompere e piazzare come in vanilla. Non salta la consegna degli oggetti."
    default: op
