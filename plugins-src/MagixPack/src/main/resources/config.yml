# ==========================================================================================
#  MagixPack - il resource pack UNICO del server.
#
#  Un client Minecraft applica un solo pacchetto risorse alla volta: qui dentro finiscono,
#  fuse in un unico zip, i contenuti di TUTTI i plugin che ne hanno (MagixFactions per lo
#  shader della minimap/mappa e il logo del tablist, MagixAuth per le schermate di accesso,
#  e ogni plugin futuro che si registri). Nessuno dei due spedisce un pacchetto proprio: si
#  registrano qui via API (vedi README.md), e questo plugin costruisce lo zip, lo serve via
#  un piccolo server HTTP integrato (nessun hosting esterno richiesto) e lo rende
#  obbligatorio al join.
# ==========================================================================================

# Porta del server HTTP che serve lo zip. Va aperta sul firewall del VPS: i client la
# raggiungono da fuori.
port: 8443

# IP pubblico del VPS: i client scaricano il pacchetto da qui. Vuoto = pacchetto disabilitato
# (nessun errore bloccante, semplicemente nessun client lo riceve).
public-host: "141.94.123.249"

# Ogni quanti secondi il plugin verifica DA SOLO che il pacchetto sia ancora scaricabile (una
# richiesta in loopback su 127.0.0.1). Se non risponde, il servizio HTTP viene riavviato al volo.
# È la rete di sicurezza contro il blocco visto in passato: dopo qualche ora di uptime nessuno
# riusciva più a scaricare il pacchetto finché non si riavviava l'intero server.
# 0 = controllo disattivato (sconsigliato).
watchdog-seconds: 120

# ---- PACCHETTO OBBLIGATORIO ----
# true (default): il pacchetto è RICHIESTO per giocare. Viene inviato a TUTTI al join con il
# flag "obbligatorio" del protocollo — il client vanilla in quel caso non offre nemmeno il
# tasto "No". Se comunque non viene caricato (client modificato, mod che disattiva i pack,
# download fallito, o il giocatore che lo rimuove dalle impostazioni), il giocatore viene
# ESPULSO con i messaggi qui sotto.
# false = pacchetto facoltativo, nessuna espulsione.
required: true

# Ritardo (in tick, 20 = 1 s) tra l'ingresso del giocatore e l'invio del pacchetto. Un secondo
# di respiro evita di chiedere il pacchetto mentre il client sta ancora ricevendo chunk e
# inventario.
send-delay-ticks: 20

# Secondi di attesa di una risposta dal client prima di espellerlo (messaggio 'timeout'). Il
# conto RIPARTE a ogni segnale di vita (pacchetto accettato / scaricato), quindi una
# connessione lenta non viene punita: il timeout scatta solo se il client tace del tutto.
# 0 = nessun timeout (chi non risponde mai resta dentro senza pacchetto).
timeout-seconds: 30

# Testo mostrato dal client nella richiesta del pacchetto ("Questo server richiede...").
# Supporta i codici colore & e \n per andare a capo.
prompt: "&e&lMAGICADVENTURE\n&7Il pacchetto risorse è &cobbligatorio&7 per giocare qui."

# Messaggi di espulsione (schermata di disconnessione), uno per motivo. Colori & e \n per
# andare a capo. Se un motivo è vuoto viene usato quello di 'declined'.
#  - declined: il giocatore ha RIFIUTATO il pacchetto.
#  - failed:   download fallito / URL non valido / il client non è riuscito ad applicarlo o
#              l'ha rimosso (è il caso "per qualche strano motivo non si è caricato").
#  - timeout:  il client non ha mai risposto entro timeout-seconds.
kick-messages:
  declined: "&c&lPACCHETTO RISORSE OBBLIGATORIO\n\n&7Su &6MAGICADVENTURE&7 il pacchetto risorse è &cobbligatorio&7.\n&7Rientra e premi &aAccetta&7 quando ti viene chiesto.\n\n&8(Impostazioni > Multigiocatore > Pacchetti del server: consenti)"
  failed: "&c&lPACCHETTO RISORSE NON CARICATO\n\n&7Il pacchetto risorse &cobbligatorio&7 non è stato scaricato dal tuo client.\n&7Riprova tra poco; se continua, controlla la connessione o\n&7svuota la cartella &fserver-resource-packs&7 del gioco.\n\n&8(Impostazioni > Multigiocatore > Pacchetti del server: consenti)"
  timeout: "&c&lPACCHETTO RISORSE OBBLIGATORIO\n\n&7Il tuo client non ha risposto alla richiesta del pacchetto.\n&7Il pacchetto è &cobbligatorio&7 per giocare: rientra e accetta il download.\n\n&8(Impostazioni > Multigiocatore > Pacchetti del server: consenti)"

# ---- AVATAR DELLA SKIN ----
# Glifo con la FACCIA della skin del giocatore (piatta, secondo strato compreso),
# disegnato pixel per pixel con un font del pacchetto. Lo usano l'oggetto "avatar" di items.yml
# (nella descrizione) e, via API, chat e tablist (MagixPack.playerAvatar). Grandezza e
# posizione (scale, offset-x, offset-y) si regolano nella voce "avatar" di glyphs.yml, come per
# ogni altra icona. Vedi README.md.
avatar:
  # Il server è in offline-mode: se il profilo non ha una skin (nessun plugin di skin che la
  # imposta), la si chiede a Mojang per NOME, cioè la skin dell'account premium con quel nome.
  # false = solo la skin del profilo.
  mojang-lookup: true

# ---- MODELLI 3D (plugins/MagixPack/models/*.bbmodel, /mpack model) [solo staff] ----
models:
  # Fino a quanti blocchi di distanza i giocatori vedono i modelli messi nel mondo. Il client
  # disegna un'entità display entro (questo valore) blocchi, ridotti dalla sua opzione "Distanza
  # entità"; il server però la manda solo entro la propria view-distance (server.properties, in
  # chunk da 16 blocchi) e il tracciamento dei display di spigot.yml: per vedere un modello a 128
  # blocchi servono view-distance almeno 8 e display almeno 128.
  view-distance: 128
