model-player-only: "&#FF6B6BQuesto si fa solo in gioco: il modello compare dove sei."
model-unknown: "&#FF6B6BNessun modello &f{model}&#FF6B6B in models/. &#9A8CA8Elenco: &#A8DC2C/mpack model list"
model-animation-unknown: "&#FF6B6BNessuna animazione &f{animation}&#FF6B6B in questo modello. &#9A8CA8Ci sono: &f{animations}"
model-spawned: "&#A8DC2CModello &f{model}&#A8DC2C messo qui &8· &#9A8CA8{pieces} pezzi, animazione &f{animation}"
model-removed: "&#A8DC2CModello &f{model}&#A8DC2C tolto."
model-rotated: "&#A8DC2CModello &f{model}&#A8DC2C girato di &f{degrees}&#A8DC2C gradi."
model-scaled: "&#A8DC2CModello &f{model}&#A8DC2C ora in scala &f{scale}&#A8DC2C."
model-glow-on: "&#A8DC2CModello &f{model}&#A8DC2C sempre illuminato &8· &#9A8CA8luce piena anche al buio"
model-glow-off: "&#A8DC2CModello &f{model}&#A8DC2C di nuovo con la luce del posto in cui sta."
model-none-near: "&#FF6B6BNessun modello entro &f{radius}&#FF6B6B blocchi da te."
model-list-empty: "&#9A8CA8Nessun modello in plugins/MagixPack/models/ (servono file .bbmodel di Blockbench)."
model-list-header: "&#5A5068─────&#C046E8&l Modelli &#9A8CA8{count} in models/ &#5A5068─────"
model-list-row: "  &#A8DC2C{model} &8· &#9A8CA8{pieces} pezzi &8· &#9A8CA8animazioni &f{animations} &8· &#9A8CA8nel mondo &f{placed}"

# ---------------------------------------------------------------- /mpack help
# L'elenco dei comandi lo impagina la classe Help (la stessa in tutti i plugin Magix, vedi
# plugins-src/STILE-MAGIX.md): sezioni, frecce per sfogliare, ogni riga cliccabile per
# scriversi il comando in chat. Formato di una riga:  "<comando> [argomenti] :: spiegazione"
#   - staff: true su una sezione = la vede solo chi ha un permesso di MagixPack.
help:
  title: "MagixPack"
  # Il testo di cornice dell'elenco comandi (Help.java, condiviso da tutti i plugin Magix).
  chrome:
    no-commands: "Nessun comando disponibile."
    click-to-write: "Clicca per scriverlo"
    staff-only: "Riservato allo staff"
    click-hint: "clicca un comando per scriverlo"
    back: " « indietro "
    forward: " avanti » "
    page: "Pagina {numero}"
  sections:
    pack:
      title: "Pacchetto risorse"
      staff: true
      entries:
        - "/mpack reload :: ricarica config, oggetti, icone e modelli e rimanda il pacchetto a chi è online"
    items:
      title: "Oggetti custom"
      staff: true
      entries:
        - "/mpack item give <id> [giocatore] :: dà un oggetto custom di items.yml"
        - "/mpack item list :: elenca gli oggetti custom caricati"
    glyphs:
      title: "Icone"
      staff: true
      entries:
        - "/mpack glyph list :: elenca le icone col loro carattere e placeholder"
        - "/mpack glyph show <id> [giocatore] :: mostra un'icona in chat (più id con la virgola: impilate)"
    models:
      title: "Modelli 3D"
      staff: true
      entries:
        - "/mpack model list :: elenca i modelli di models/ e quanti ne sono nel mondo"
        - "/mpack model spawn <id> [valore] [animazione] :: mette il modello ai tuoi piedi, girato verso di te"
        - "/mpack model rotate <gradi> :: gira il modello più vicino"
        - "/mpack model scale <valore> :: cambia la grandezza del modello più vicino"
        - "/mpack model glow <on|off> :: luce piena sul modello più vicino"
        - "/mpack model remove [raggio] :: toglie il modello più vicino"
