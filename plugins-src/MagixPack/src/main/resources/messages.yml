# Testo che il giocatore (in questo caso lo staff, l'unico che usa /mpack) legge in chat.
# Tradotto in automatico da MagixLanguage se installato (vedi lang/Messages.java).
reloaded: "&aMagixPack ricaricato."
unknown-subcommand: "&cSottocomando sconosciuto. Usa &e/mpack help&c."
no-permission: "&cNon hai il permesso per farlo."
player-required: "&cSpecifica un giocatore (comando eseguibile solo da un giocatore, altrimenti)."
player-not-found: "&cGiocatore '{player}' non trovato (deve essere online)."

item-usage: "&eUso: &a/mpack item give <id> [giocatore] &7| &a/mpack item list"
item-unknown: "&cNessun oggetto custom '{item}' in items.yml (o gli manca la texture in items/)."
item-given: "&aDato l'oggetto custom '{item}' a &f{player}&a."
item-avatar-no-skin: "&eNessuna skin trovata per &f{player}&e (account non premium, o Mojang non raggiungibile): l'oggetto avatar non avrà la faccia nella descrizione."
item-list-empty: "&7Nessun oggetto custom in items.yml."
item-list-header: "&e{count} oggetto/i custom in items.yml:"
item-list-row: "&7 - &f{item}"

glyph-usage: "&eUso: &a/mpack glyph list &7| &a/mpack glyph show <id>[,<id>...] [giocatore]"
glyph-list-empty: "&7Nessuna icona custom in glyphs.yml."
glyph-list-heading: "&e{count} icona/e custom in glyphs.yml &7(i caratteri si riassegnano a ogni avvio):"
# {char} = il carattere dell'icona (incollabile in qualunque testo), {placeholder} = quello di PlaceholderAPI.
glyph-list-entry: "&7 - &f{glyph}&7: &f{char} &8({codepoint}) &7{placeholder}"
glyph-list-entry-avatar: "&7 - &f{glyph}&7: avatar del giocatore &7{placeholder}"
# I due pulsanti in fondo a ogni riga: copia negli appunti, oppure scrivi nella barra della chat
# (da lì si usa subito, o si copia con Ctrl+A e Ctrl+C).
glyph-list-button-copy: " &a[copia]"
glyph-list-button-chat: " &b[in chat]"
glyph-list-hover-copy: "&7Copia negli appunti: &f{value}"
glyph-list-hover-chat: "&7Scrivi nella barra della chat: &f{value}"
# Un'icona player-avatar è un PLACEHOLDER (diverso per ogni giocatore, lo risolve
# PlaceholderAPI): il testo digitato in chat NON passa mai da PlaceholderAPI (apposta, per non
# far scrivere a un giocatore il grado di un altro), quindi incollato lì resterebbe testo
# letterale, non l'avatar. Il pulsante [copia] resta (serve per un menu/scoreboard/tablist, dove
# PAPI lo risolve davvero), ma [in chat] qui suggerisce il comando di anteprima vero, non il
# placeholder da incollare.
glyph-list-hover-copy-avatar: "&7Copia negli appunti (per un menu/scoreboard/tablist, non per la chat): &f{value}"
glyph-list-button-preview: " &b[anteprima]"
glyph-list-hover-preview: "&7Vedila in chat: &f{command}"
glyph-unknown: "&cNessuna icona '{glyph}' in glyphs.yml (o le manca la texture in glyphs/)."
glyph-player-only: "&cL'anteprima si vede solo in gioco: comando riservato ai giocatori."
glyph-avatar-loading: "&7Scarico la skin di &f{player}&7..."
glyph-avatar-no-skin: "&cNessuna skin trovata per '{player}' (account non premium, o Mojang non raggiungibile)."
# Finiti i punti di codice per i caratteri-avatar (migliaia di skin diverse in un avvio: non
# dovrebbe succedere mai davvero).
glyph-avatar-chars-full: "&cTroppe skin diverse viste in questo avvio: nessun carattere libero per una nuova."
# Scritto subito a destra dell'icona nell'anteprima di /mpack glyph show.
glyph-show-caption: " &7{glyph}"
# Solo per un avatar: pulsante che copia UN CARATTERE VERO (una texture della faccia, assegnata al
# volo - come Oraxen per le teste custom), non un placeholder né un trucco di codici colore -
# incollato in un messaggio di chat vero funziona per chiunque veda il pacchetto, nessuna
# risoluzione lato server necessaria.
glyph-show-copy-button: " &a[copia]"
glyph-show-copy-hover: "&7Copia negli appunti: funziona incollato in un vero messaggio di chat."

# /mpack model: i modelli Blockbench (.bbmodel) messi in plugins/MagixPack/models/
model-usage: "&eUso: &a/mpack model list &7| &a/mpack model spawn <id> [scala] [animazione|none] &7| &a/mpack model remove [raggio] &7| &a/mpack model rotate <gradi> &7| &a/mpack model scale <valore> &7| &a/mpack model glow <on|off>"
model-player-only: "&cQuesto si fa solo in gioco: il modello compare dove sei."
model-unknown: "&cNessun modello '{model}' in models/ (vedi /mpack model list)."
model-animation-unknown: "&cNessuna animazione '{animation}' in questo modello. Ci sono: &f{animations}"
model-spawned: "&aModello &f{model}&a messo qui ({pieces} pezzi, animazione: &f{animation}&a)."
model-removed: "&aModello &f{model}&a tolto."
model-rotated: "&aModello &f{model}&a girato di {degrees} gradi."
model-scaled: "&aModello &f{model}&a ora in scala {scale}."
model-glow-on: "&aModello &f{model}&a sempre illuminato (luce piena anche al buio)."
model-glow-off: "&aModello &f{model}&a di nuovo con la luce del posto in cui sta."
model-none-near: "&cNessun modello entro {radius} blocchi da te."
model-list-empty: "&7Nessun modello in plugins/MagixPack/models/ (servono file .bbmodel di Blockbench)."
model-list-header: "&e{count} modello/i in models/:"
model-list-row: "&7 - &f{model}&7: {pieces} pezzi, animazioni: &f{animations}&7, messi nel mondo: &f{placed}"

# ---------------------------------------------------------------- /mpack help
# L'elenco dei comandi lo impagina la classe Help (la stessa in tutti i plugin Magix, vedi
# plugins-src/STILE-MAGIX.md): sezioni, frecce per sfogliare, ogni riga cliccabile per
# scriversi il comando in chat. Formato di una riga:  "<comando> [argomenti] :: spiegazione"
#   - staff: true su una sezione = la vede solo chi ha un permesso di MagixPack.
help:
  title: "MagixPack"
  # Il testo di cornice dell'elenco comandi (Help.java, condiviso da tutti i plugin Magix).
  chrome:
    no-commands: "Nessun comando disponibile."
    click-to-write: "Clicca per scriverlo"
    staff-only: "Riservato allo staff"
    click-hint: "clicca un comando per scriverlo"
    back: " « indietro "
    forward: " avanti » "
    page: "Pagina {numero}"
  sections:
    pack:
      title: "Pacchetto risorse"
      staff: true
      entries:
        - "/mpack reload :: ricarica config, oggetti, icone e modelli e rimanda il pacchetto a chi è online"
    items:
      title: "Oggetti custom"
      staff: true
      entries:
        - "/mpack item give <id> [giocatore] :: dà un oggetto custom di items.yml"
        - "/mpack item list :: elenca gli oggetti custom caricati"
    glyphs:
      title: "Icone"
      staff: true
      entries:
        - "/mpack glyph list :: elenca le icone col loro carattere e placeholder"
        - "/mpack glyph show <id> [giocatore] :: mostra un'icona in chat (più id con la virgola: impilate)"
    models:
      title: "Modelli 3D"
      staff: true
      entries:
        - "/mpack model list :: elenca i modelli di models/ e quanti ne sono nel mondo"
        - "/mpack model spawn <id> [valore] [animazione] :: mette il modello ai tuoi piedi, girato verso di te"
        - "/mpack model rotate <gradi> :: gira il modello più vicino"
        - "/mpack model scale <valore> :: cambia la grandezza del modello più vicino"
        - "/mpack model glow <on|off> :: luce piena sul modello più vicino"
        - "/mpack model remove [raggio] :: toglie il modello più vicino"
