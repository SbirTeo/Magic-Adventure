# MagixCosmetics - tutti i testi mostrati ai giocatori.
# Codici colore: & classici (&a, &e, &c...) ed esadecimali &#RRGGBB.
# \n in un testo va a capo (funziona anche senza virgolette attorno alla riga).
#
# PALETTE MAGIX (uguale in tutti i plugin del server, vedi plugins-src/STILE-MAGIX.md):
#   viola  &#C046E8  il MAGIC del logo: nome del plugin, titoli, staff
#   verde  &#A8DC2C  l'ADVENTURE del logo: comandi, conferme, cose cliccabili
#   grigio &#9A8CA8  testo di servizio   |  tenue &#5A5068 cornici e separatori
#   errore &#FF6B6B  |  avviso &#FFD166

# ---------------------------------------------------------------- generici
no-permission: "&cNon hai il permesso per questo comando."
players-only: "&cQuesto comando va eseguito da un giocatore."
unknown-subcommand: "&cSottocomando sconosciuto. Usa &e/cosmetics help&c."
reloaded: "&aConfigurazione ricaricata."

# ---------------------------------------------------------------- /cosmetics info
# {version} = versione del plugin. Sotto la cornice va una riga sullo stato dell'aureola,
# scelta in base a chi guarda (vedi le voci halo-* qui sotto).
info:
  - "&8&m                                        "
  - "  &#C046E8&lMagixCosmetics &7v{version}"
  - "&8&m                                        "

# Righe di stato per un GIOCATORE, secondo il suo caso. {color} = nome del colore (vedi color-names).
halo-on:
  - "  &7Aureola: &#A8DC2CACCESA &8({color}) &8· &7spegnila con &#A8DC2C/halo off"
halo-off:
  - "  &7Aureola: &#FF6B6BSPENTA &8· &7riaccendila con &#A8DC2C/halo on"
halo-in-combat:
  - "  &7Aureola ({color}): &#FFD166nascosta in combattimento &8· &7torna a vedersi poco dopo la fine dello scontro"
halo-no-color:
  - "  &7Aureola: &8nessun colore assegnato &8· &7chiedi allo staff un permesso colore"
halo-vip-only:
  - "  &7Aureola: &8riservata ai &#C046E8VIP&8."
halo-disabled-server:
  - "  &7Aureola: &8disattivata sul server."

# Riga di stato quando /cosmetics info lo lancia la CONSOLE (nessun giocatore a cui riferirsi).
halo-status-server-on:
  - "  &7Aureola: &#A8DC2Cattiva &8(la vedono i giocatori con magixcosmetics.halo e un permesso colore)."
halo-status-server-off:
  - "  &7Aureola: &#FF6B6Bdisattivata &8(halo.enabled: false)."

# ---------------------------------------------------------------- /halo
halo-set-on: "&aLa tua aureola è stata riaccesa."
halo-set-off: "&7La tua aureola è stata spenta."
halo-already-on: "&eLa tua aureola era già accesa."
halo-already-off: "&eLa tua aureola era già spenta."
halo-no-vip: "&cL'aureola è riservata ai VIP."
halo-disabled: "&cIn questo momento l'aureola è disattivata sul server."
halo-usage: "&eUso: &#A8DC2C/halo <on|off> &7oppure &#A8DC2C/halo setcolor <colore>"
# {colors} = elenco dei nomi di colore validi (vedi color-names), separati da virgola.
halo-setcolor-unknown: "&cColore sconosciuto. Colori disponibili: &e{colors}"
# {color} = nome del colore che non gli è permesso.
halo-setcolor-no-permission: "&cNon hai il permesso per il colore &e{color}&c. Chiedilo allo staff."
# {color} = nome del colore appena scelto.
halo-setcolor-set: "&aAureola impostata al colore &e{color}&a."

# Nomi dei colori come li legge un giocatore in chat. Le CHIAVI corrispondono a quelle di
# halo.colors nel config e al permesso magixcosmetics.halo.color.<chiave>: sono l'handle del
# comando "/halo setcolor <chiave>", quindi NON si traducono. Solo i VALORI sono il testo in
# italiano che compare in chat.
color-names:
  yellow: "giallo"
  red: "rosso"
  orange: "arancione"
  lime: "lime"
  aqua: "azzurro"
  blue: "blu"
  purple: "viola"
  pink: "rosa"
  white: "bianco"

# ---------------------------------------------------------------- /firework
firework-disabled: "&cIl firework d'ingresso è disattivato su questo server."
firework-no-permission: "&cNon puoi personalizzare il firework: chiedilo allo staff."
firework-no-permission-fade: "&cNon hai il permesso per la sfumatura. Chiedilo allo staff."
firework-no-permission-flicker: "&cNon hai il permesso per lo sfarfallio. Chiedilo allo staff."
firework-no-permission-trail: "&cNon hai il permesso per la scia. Chiedilo allo staff."
firework-no-permission-preview: "&cNon hai il permesso per l'anteprima."
firework-no-permission-toggle: "&cNon hai il permesso per spegnere o riaccendere il firework."
unknown-subcommand-firework: "&cSottocomando sconosciuto. Usa &e/firework help&c."
firework-usage-color: "&eUso: &#A8DC2C/firework color <colore> [colore]..."
firework-usage-fade: "&eUso: &#A8DC2C/firework fade <colore> [colore]... &7oppure &#A8DC2C/firework fade clear"
firework-usage-shape: "&eUso: &#A8DC2C/firework shape <tipo> &7- forme: &e{shapes}"
firework-usage-flicker: "&eUso: &#A8DC2C/firework flicker <on|off>"
firework-usage-trail: "&eUso: &#A8DC2C/firework trail <on|off>"
# {max} = quanti colori al massimo.
firework-too-many-colors: "&cAl massimo {max} colori."
# {color} = quello scritto dal giocatore, {colors} = i nomi validi.
firework-color-unknown: "&cColore sconosciuto: &e{color}&c. Colori: &e{colors}&c, oppure un esadecimale tipo #FF00FF."
firework-color-no-permission: "&cNon hai il permesso per il colore &e{color}&c. Chiedilo allo staff."
firework-color-set: "&aColori del firework impostati: &e{colors}&a."
firework-fade-set: "&aSfumatura del firework impostata: &e{colors}&a."
firework-fade-cleared: "&7Sfumatura del firework tolta."
firework-shape-unknown: "&cForma sconosciuta. Forme: &e{shapes}"
firework-shape-no-permission: "&cNon hai il permesso per la forma &e{shape}&c. Chiedilo allo staff."
firework-shape-set: "&aForma del firework impostata: &e{shape}&a."
firework-flicker-on: "&aSfarfallio acceso."
firework-flicker-off: "&7Sfarfallio spento."
firework-trail-on: "&aScia accesa."
firework-trail-off: "&7Scia spenta."
firework-reset: "&7Firework riportato al look di serie."
firework-set-on: "&aIl tuo firework d'ingresso è stato riacceso."
firework-set-off: "&7Il tuo firework d'ingresso è stato spento."
# {seconds} = quanti secondi aspettare.
firework-preview-wait: "&eAspetta ancora {seconds} secondi prima di rivedere l'anteprima."
firework-state-on: "acceso"
firework-state-off: "spento"
firework-yes: "sì"
firework-no: "no"
firework-none: "nessuna"
# {state} acceso/spento, {colors}, {fade}, {shape}, {flicker}, {trail} = il look che avresti adesso.
firework-info:
  - "&8&m                                        "
  - "  &#C046E8&lIl tuo firework d'ingresso &8(&7{state}&8)"
  - "  &7Colori: &e{colors}"
  - "  &7Sfumatura: &e{fade}"
  - "  &7Forma: &e{shape} &8· &7Sfarfallio: &e{flicker} &8· &7Scia: &e{trail}"
  - "  &7Comandi: &#A8DC2C/firework help"
  - "&8&m                                        "

# ---------------------------------------------------------------- /cosmetics help
# L'aiuto lo impagina la classe Help (la stessa in tutti i plugin Magix): una sezione per
# volta, frecce per sfogliare, ogni riga cliccabile per scriversi il comando in chat.
# Formato di una riga:  "<comando> [argomenti] :: spiegazione"
#   - staff: true su una sezione = la vede solo chi ha magixcosmetics.admin.
help:
  title: "MagixCosmetics"
  # Il testo di cornice dell'elenco comandi (Help.java, condiviso da tutti i plugin Magix):
  # non cambia da un plugin all'altro, ma vive comunque qui perché Help lo legge da
  # messages.yml come ogni altro testo del giocatore (vedi CLAUDE.md).
  chrome:
    no-commands: "Nessun comando disponibile."
    click-to-write: "Clicca per scriverlo"
    staff-only: "Riservato allo staff"
    click-hint: "clicca un comando per scriverlo"
    back: " « indietro "
    forward: " avanti » "
    page: "Pagina {numero}"
  sections:
    cosmetici:
      title: "Cosmetici"
      entries:
        - "/cosmetics info :: mostra i tuoi cosmetici e il loro stato"
        - "/halo <on|off> :: accendi o spegni la tua aureola (VIP)"
        - "/halo setcolor <colore> :: cambia il colore della tua aureola (serve il permesso di quel colore)"
    firework:
      title: "Firework d'ingresso"
      entries:
        - "/firework :: mostra il tuo firework d'ingresso"
        - "/firework color <colore> :: scegli i colori (servono i permessi dei singoli colori)"
        - "/firework fade <colore|clear> :: scegli i colori della sfumatura finale"
        - "/firework shape <tipo> :: ball, large, star, burst o creeper (serve il permesso della forma)"
        - "/firework flicker <on|off> :: sfarfallio"
        - "/firework trail <on|off> :: scia"
        - "/firework preview :: vedi subito il tuo firework"
        - "/firework reset :: torna al look di serie"
        - "/firework <on|off> :: spegni o riaccendi il tuo firework d'ingresso"
    staff:
      title: "Staff"
      staff: true
      entries:
        - "/cosmetics reload :: ricarica config.yml e messages.yml"
