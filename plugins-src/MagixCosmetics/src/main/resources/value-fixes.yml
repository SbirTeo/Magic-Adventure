# Testi DI SERIE che sono cambiati nel jar e vanno aggiornati anche sul server (vedi
# util/ConfigAlign.applyValueFixes). L'allineamento aggiunge le chiavi nuove ma non tocca i valori
# gia' scelti: qui si elencano le coppie testo vecchio -> testo nuovo, e all'avvio e a ogni reload
# si sostituisce SOLO un valore identico a quello vecchio (uno cambiato a mano resta com'e'), dopo
# averne fatto la copia in .bak/. Nato per gli accenti scritti con l'apostrofo ("piu'", "e'").
messages.yml:
  - old: "&aLa tua aureola e' stata riaccesa."
    new: "&aLa tua aureola è stata riaccesa."
  - old: "&7La tua aureola e' stata spenta."
    new: "&7La tua aureola è stata spenta."
  - old: "&eLa tua aureola era gia' accesa."
    new: "&eLa tua aureola era già accesa."
  - old: "&eLa tua aureola era gia' spenta."
    new: "&eLa tua aureola era già spenta."
  - old: "&cL'aureola e' riservata ai VIP."
    new: "&cL'aureola è riservata ai VIP."
  - old: "&cIn questo momento l'aureola e' disattivata sul server."
    new: "&cIn questo momento l'aureola è disattivata sul server."
