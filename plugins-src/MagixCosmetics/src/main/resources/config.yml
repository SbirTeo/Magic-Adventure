# MagixCosmetics - cosmetici per i giocatori.
# Per ora due cose: l'aureola colorata che gira sopra la testa dei VIP (sezione "halo") e il
# firework di benvenuto che esplode quando un giocatore entra nel server (sezione "join-firework").
#
# Chi vede l'aureola? Chi ha il permesso magixcosmetics.halo (di norma il grado VIP su
# LuckPerms). NON basta però: senza ANCHE un permesso colore (vedi halo.colors sotto)
# l'aureola non ha nessun colore e non si disegna. Non serve nessun comando per accenderla:
# appena i due permessi ci sono, l'aureola compare da sola nel colore giusto.
# I testi e i colori dei messaggi stanno in messages.yml; qui ci sono solo i numeri della resa.

# L'aureola è un SOLO puntino che orbita in cerchio sopra la testa (non un anello pieno).
halo:
  # Interruttore generale dell'aureola. Spento, nessuno la vede e il task non gira.
  enabled: true

  # La tavolozza dei colori disponibili, in esadecimale #RRGGBB. Ogni nome qui sotto è anche
  # un permesso: magixcosmetics.halo.color.<nome> (es. magixcosmetics.halo.color.yellow).
  # NON c'è un colore di default: un giocatore senza nessuno di questi permessi non ha
  # colore, quindi l'aureola non si disegna anche se ha magixcosmetics.halo. Con uno di questi
  # permessi il colore si accende da solo; con più di uno si sceglie con /halo setcolor <nome>.
  colors:
    yellow: "#FFDD33"
    red: "#FF5C5C"
    orange: "#FFA033"
    lime: "#66FF66"
    aqua: "#33DDDD"
    blue: "#3388FF"
    purple: "#B266FF"
    pink: "#FF66CC"
    white: "#F5F5F5"

  # Raggio dell'orbita, in blocchi. 0.25 sta stretto, quasi a sfiorare la testa.
  radius: 0.25

  # Altezza sopra i piedi del giocatore, in blocchi. 2.1 la mette appena sopra la testa.
  height: 2.1

  # Dimensione del puntino (particella DUST). 1.0 è la taglia normale; 0.55 è un puntino sottile,
  # discreto, pensato per non saltare troppo all'occhio.
  particle-size: 0.55

  # Da quanti blocchi si vede l'aureola (giocatori e statue di MagixEntities). Le particelle normali
  # arrivano solo entro 32 blocchi: su una statua gigante, che si vede da molto più lontano,
  # l'aureola spariva prima della statua. Qui si mandano "a lunga distanza"; massimo 512.
  view-distance: 96

  # Ogni quanti tick il puntino avanza (e viene disegnato). 1 = ogni tick, il movimento più fluido.
  # Più alto = più leggero ma il movimento è più a scatti.
  update-interval-ticks: 1

  # Quanto avanza lungo il cerchio a ogni passo, in radianti. Più alto = orbita più veloce.
  # 0.25 fa un giro completo in circa un secondo e mezzo.
  spin-speed: 0.25

  # Nascondi l'aureola a chi è in vanish (staff invisibile): altrimenti lo tradirebbe.
  hide-when-vanished: true

  # Nascondi l'aureola a chi ha la pozione di invisibilità.
  hide-when-invisible: true

  # L'aureola sparisce durante un combattimento PvP e per un po' dopo: da bersaglio colorato
  # diventerebbe un vantaggio ingiusto per chi insegue o scappa in mezzo alla folla.
  combat:
    # Interruttore di questa funzione. Spento, l'aureola resta visibile anche in combattimento.
    hide-while-fighting: true

    # Quanti secondi dopo l'ultimo colpo dato o subito l'aureola torna a vedersi.
    cooldown-after-combat-seconds: 30

# Il firework di benvenuto: quando un giocatore entra in QUESTO server, sopra di lui esplode un
# firework. Di serie è SPENTO (sul faction non serve): si accende solo dove lo si vuole, cioè
# nel config dell'hub. Di serie è una sfera magenta e verde; chi ha i permessi lo personalizza con
# /firework (colori, sfumatura, forma, sfarfallio, scia). Senza permessi nessuno cambia niente.
# Permessi: magixcosmetics.firework (usare /firework) + uno per ogni scelta, vedi i permessi del plugin:
# .color.<nome> (un colore della tavolozza), .color.custom (colori #RRGGBB liberi), .fade, .shape.<forma>,
# .flicker, .trail, .preview, .toggle. Di serie nessuno li ha.
join-firework:
  # Interruttore: spento, nessun firework all'ingresso e /firework risponde "disattivato".
  enabled: false

  # Quanti tick dopo l'ingresso esplode (20 tick = 1 secondo): lascia al giocatore il tempo di caricarsi.
  delay-ticks: 20

  # Nascondi il firework a chi entra in vanish (staff invisibile): altrimenti lo tradirebbe.
  hide-when-vanished: true

  # Quanti colori al massimo, sia per i colori sia per la sfumatura finale (da 1 a 8).
  max-colors: 4

  # Ogni quanti secondi chi ha il permesso può rivedere l'anteprima con /firework preview.
  preview-cooldown-seconds: 15

  # Il look di chi non ha scelto niente (o non ha i permessi per le sue scelte). Colori e sfumatura
  # sono nomi della tavolozza qui sotto oppure esadecimali #RRGGBB.
  default:
    # I colori dell'esplosione. Di serie magenta e verde.
    colors:
      - magenta
      - green
    # I colori in cui sfuma alla fine. Vuoto = nessuna sfumatura.
    fade: []
    # La forma: ball (sfera), large (sfera grande), star (stella), burst (scoppio), creeper (faccia di creeper).
    shape: ball
    # Sfarfallio (le scintille lampeggiano) e scia (le scintille lasciano una coda).
    flicker: false
    trail: false

  # La tavolozza: nome del colore -> esadecimale #RRGGBB. I nomi sono fissi (ognuno ha il suo permesso
  # magixcosmetics.firework.color.<nome>), si cambia solo la tinta.
  palette:
    red: "#FF3030"
    orange: "#FF9020"
    yellow: "#FFE030"
    lime: "#A8DC2C"
    green: "#30E030"
    aqua: "#30E0E0"
    blue: "#3070FF"
    purple: "#9030E0"
    magenta: "#FF20D0"
    pink: "#FF90C0"
    white: "#F5F5F5"
