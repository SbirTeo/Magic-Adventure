# ============================================================
#  MagixFactions - Configurazione
# ============================================================
# Ogni chiave che tocca i giocatori la racconta da sola il tutorial del sito (/tutorial), col valore
# scelto qui. Le regolazioni tecniche o solo estetiche hanno [solo staff] nel commento (sulla chiave o
# sulla sezione che la contiene): il tutorial non ne parla. check_config.py [10] blocca il commit di
# una chiave nuova che non sia né raccontata né marcata.

# ---------------------------- STORAGE ----------------------------- [solo staff]
storage:
  type: sqlite            # sqlite | mariadb
  sqlite:
    file: "magixfactions.db"
  mariadb:
    host: "127.0.0.1"
    port: 3306
    database: "factions_magixfactions"
    user: "magixfactions"
    password: ""
    pool-size: 10
# Per spostare i dati: /mf db migrate <sqlite|mariadb> -> poi cambia 'type' e riavvia.

# ------------------------- NOME FAZIONE ---------------------------
faction-name:
  min-length: 3
  max-length: 15          # lunghezza massima
  max-digits: 2           # massimo numero di CIFRE ammesse nel nome
  # Quante volte DI FILA può comparire lo stesso carattere (maiuscole e minuscole contano uguale).
  # Con 2: "Rossetto" e "Assassini" vanno bene (lettere uguali, ma mai più di due attaccate),
  # "Dragooon" no. Nel nome la stessa lettera può comparire quante volte si vuole. 0 = nessun limite.
  max-consecutive: 2
# Caratteri ammessi: SOLO lettere e numeri (niente spazi, underscore, punteggiatura o simboli).

# ---------------------- DESCRIZIONE FAZIONE -----------------------
faction-description:
  max-length: 100         # lunghezza massima della descrizione (/f description)
  # Descrizione assegnata automaticamente alle nuove fazioni (vuoto = nessuna).
  default: "Questa è una fazione di MagicAdventure. Conquisteremo il Mondo!"

# ----------------------- PAROLE VIETATE ---------------------------
# Filtro applicato a nomi fazione, descrizioni e (in futuro) a qualsiasi testo dei giocatori.
# Il confronto NON distingue maiuscole/minuscole e neutralizza il leetspeak (0->o, 1->i, 3->e,
# 4->a, 5->s, 7->t, @->a, $->s) e i simboli/spazi: così "c4zz0", "c a z z o" ecc. vengono comunque
# bloccati. Il match è per SOTTOSTRINGA: aggiungi/rimuovi liberamente parole qui sotto.
