# --------------------------- CHAT ---------------------------------
# Qui ci sono solo i canali di FAZIONE e ALLEATI (/f chat): un messaggio scritto lì va ai membri
# (e agli alleati), non è chat pubblica e non esce mai verso il sito.
# La chat PUBBLICA (formato con [fazione] colorato secondo la relazione di chi legge, messaggi del
# sito) dalla 0.59 la scrive MagixEssentials, su ogni server della rete: si regola nel suo chat.yml.
# MagixFactions gli dà solo i pezzi di fazione della riga ({faction}, {relcolor}, {rank}).
# Chi ha il permesso magixfactions.chat.hidefactions (default: op) appare nella chat pubblica SENZA
# fazione (usa il format di MagixEssentials invece di faction-format). [solo staff]
chat:
  # Suggerimento che compare passando il mouse su un messaggio dei canali fazione e alleati: ora e
  # provenienza. Metti false per toglierlo. Quello della chat pubblica sta nel chat.yml di MagixEssentials.
  hover-info: true
  hover-format: "&7{ora}  &8•  {origine}"
  hover-gioco: "&a⛏ scritto in gioco"
  hover-web: "&b☁ scritto dal sito"

# -------------------------- MEMBRI --------------------------------
members:
  base: 5                 # limite membri standard (configurabile)
# Il limite può aumentare con permessi VIP del leader: magixfactions.members.<numero>
# (es. magixfactions.members.10 -> fino a 10). In futuro anche con missioni/soldi.

# ------------------- PUNTEGGIO / CLASSIFICA (/f top) --------------
# La "Top fazioni" NON ordina per un solo numero (chi ha più territori, o più soldi): sarebbe
# fuorviante. Ordina per un PUNTEGGIO che sintetizza più caratteristiche con un metodo RELATIVO.
#
# COME NASCE IL PUNTEGGIO:
#   1) In ogni caratteristica la fazione col valore più ALTO vale 1; le altre valgono in proporzione a
#      lei (proprio valore / valore del migliore), quindi fra 0 e 1. Così voci con scale diversissime
#      (territori ~decine, soldi ~centinaia di migliaia) diventano confrontabili senza numeri arbitrari.
#   2) Ogni frazione si moltiplica per il PESO della voce (weights, sotto): col peso 1 la voce vale al
#      massimo 1, col peso 2 il doppio. Il punteggio è la SOMMA dei contributi (peso × frazione).
#      Il massimo possibile è la somma dei pesi (una fazione prima in tutto). Un peso 0 esclude la voce.
# NB: il punteggio è RELATIVO -> può cambiare anche se una fazione non fa nulla, perché un'altra ha
# alzato il record di una voce. È voluto: misura quanto sei vicino al MIGLIORE del momento.
#
# MEDIE NEL TEMPO: di default banca e potenza entrano con la loro MEDIA dalla creazione ("giacenza media",
# "potenza media"), così un picco momentaneo non gonfia la classifica; la media si costruisce campionando
# ogni sample-interval-seconds (dato salvato sul database). Territori, membri e longevità usano il valore
# corrente. NB: sulle fazioni già esistenti la media parte dall'aggiornamento del plugin (non c'è storico
# passato da cui calcolarla); da lì in avanti è esatta.
score:
  # PESO di ogni caratteristica = il massimo che quella voce può dare (quando sei tu il migliore).
  # Con tutti i pesi a 1 ogni voce vale al massimo 1 e contano tutte uguale (punteggio max = 5). Alza un
  # peso per far contare di più quella voce (es. land: 2 -> i territori valgono il doppio). Peso 0 = voce
  # esclusa.
  weights:
    land: 1           # territori (chunk) posseduti
    members: 0        # numero di membri — 0 = ESCLUSO dal punteggio (resta come colonna informativa sul sito)
    bank: 1           # banca di fazione (di default: giacenza media, vedi bank-value)
    longevity: 1      # da quanti giorni esiste la fazione
    power: 1          # potenza di fazione (di default: media nel tempo, vedi power-value)
    kills: 1          # uccisioni della fazione (somma dei membri; vedi combat-metric e sezione combat)
    value: 1          # valore in minerali piazzati nelle land (vedi value-blocks in fondo al file)
  # Cosa entra nella voce "combat" del punteggio:
  #   kills = numero di UCCISIONI valide (default; volume, stabile per il metodo relativo)
  #   kd    = rapporto K/D (uccisioni/morti). NB: un rapporto è instabile in una classifica "relativa al
  #           migliore" (una fazione con poche morti schiaccerebbe tutte le altre) -> consigliato "kills".
  # Il K/D resta comunque mostrato come colonna informativa sul sito, comunque scegli qui.
  combat-metric: kills
  # Fazioni INATTIVE fuori dalla classifica: se TUTTI i membri sono assenti da più di questi giorni (nessuno
  # online e nessun accesso recente), la fazione NON compare in /f top né sul sito, e NON fa da "migliore"
  # per le altre voci (così una fazione morta con la banca piena non falsa il metro degli altri). Conta
  # l'ultimo accesso reale (join/quit), non il decadimento. 0 = disattivato: tutte le fazioni in classifica.
  inactive-days: 7
  # Banca nel punteggio: "average" = giacenza MEDIA (default), "current" = saldo attuale.
  # La GIACENZA MEDIA conta SOLO il tempo in cui almeno un membro è ONLINE: il tempo scorre quando si
  # gioca, si ferma a server vuoto. Così misura i soldi tenuti MENTRE si gioca, e non si può gonfiare la
  # media parcheggiando denaro da offline. (La media resta sempre visibile; è solo il conteggio del tempo
  # a fermarsi.) La POTENZA invece si media sul tempo REALE, perché deve calare anche da offline.
  bank-value: average
  # Potenza nel punteggio: "average" = potenza MEDIA nel tempo (default), "current" = potenza attuale.
  power-value: average
  # Ogni quanti secondi si campiona banca/potenza per costruirne la media nel tempo (min 5). Più basso =
  # media più precisa ma più scritture su DB; 300 (5 min) è un buon compromesso. [solo staff]
  sample-interval-seconds: 30
  # Quante fazioni mostrare in /f top (le prime N). La tua fazione, se è fuori dai primi, viene comunque
  # aggiunta in coda con la sua posizione.
  top-size: 10
  # Cifre decimali del punteggio mostrato (0-4). Coi punteggi piccoli (0..somma pesi) meglio 2. [solo staff]
  decimals: 2

# ------------------- COSTO/CONDIZIONI CREAZIONE -------------------
# Tutto opzionale: lascia vuoto/0 ciò che non vuoi richiedere.
create-cost:
  money: 0                # richiede Vault + plugin economia
  # Tempo minimo di gioco (in secondi) sul server prima di poter fondare una fazione. 0 = nessun minimo.
  # Si legge dalle statistiche di Minecraft, senza bisogno di PlaceholderAPI; il tutorial lo racconta da solo.
  min-playtime-seconds: 0
  items: []              # es: ["DIAMOND:10", "GOLD_INGOT:5"]
  placeholders: []       # es: ["%player_level% >= 10"]  (richiede PlaceholderAPI) [solo staff]
  permission: ""         # es: "magixfactions.create" [solo staff]

# ----------------- COSTO/CONDIZIONI /f sethome -------------------
# Stesso motore di create-cost: costo per impostare la home della fazione. Default: gratis.
sethome-cost:
  money: 0
  items: []
  placeholders: []  # [solo staff]
  permission: ""  # [solo staff]

# ----------------------- WARMUP /f home ---------------------------
# Prima del teletrasporto con /f home il giocatore deve restare fermo per questi secondi:
# muoversi anche di un blocco annulla il teletrasporto (va ripetuto il comando). 0 = teletrasporto
# istantaneo, senza attesa. Personalizzabile PER GIOCATORE col permesso VIP
# magixfactions.warmup.home.<secondi> (...home.0 = istantaneo): fra più permessi di questo tipo
# posseduti vince il più basso, senza nessuno vale questo valore (vedi plugin.yml). Chi ha
# magixfactions.admin salta sempre il warmup, a prescindere da questo valore o dal permesso VIP.
home-warmup:
  seconds: 5

# ----------------------- RINOMINA FAZIONE ------------------------
# /f rename <nuovonome>: SOLO il leader cambia il nome della fazione. Valgono le stesse regole del nome
# in creazione (lunghezza, caratteri, cifre, parole vietate, unicità). Il nuovo nome compare da solo
# anche sul sito (classifiche, profili, chat), che legge il nome dal database.
rename:
  cooldown-days: 30       # giorni minimi tra un cambio nome e il successivo (0 = nessun limite)
  # Costo del cambio nome, a carico del leader. Stesso motore di create-cost. Default: gratis.
  cost:
    money: 0              # richiede Vault + plugin economia
    items: []             # es: ["DIAMOND:10", "GOLD_INGOT:5"]
    placeholders: []      # es: ["%player_level% >= 10"]  (richiede PlaceholderAPI) [solo staff]
    permission: ""        # es: "magixfactions.rename" [solo staff]

# ---------------------- POTENZA (Power) ---------------------------
# Ogni giocatore ha una Potenza intera, da -max a +max.
# La Potenza di fazione = somma delle Potenze dei membri; il max di fazione = somma dei loro max.
# ----------------------- PROTEZIONE TERRITORI ---------------------
# Impedisce a chi NON è della fazione proprietaria di rompere/posare blocchi e di interagire (casse,
# porte, leve, secchi, item frame, armor stand...) dentro un chunk claimato. Terreno neutrale e proprio
# territorio restano liberi. Lo staff con permesso magixfactions.bypass (o magixfactions.admin) costruisce
# ovunque.
protection:
  enabled: true            # false = nessuna protezione (comportamento vecchio: tutti costruiscono ovunque)
  ally-can-build: false    # true = gli ALLEATI possono costruire/interagire nel tuo territorio
  # Vettori di distruzione che NON passano dalla rottura "a mano" (e quindi la aggiravano): senza questi
  # chiunque poteva far saltare/bruciare/svuotare col pistone la land altrui pur non potendo rompere.
  # La land claimata è protetta da QUALSIASI esplosione (dentro i confini non si distrugge, punto).
  block-explosions: true   # true = TNT/creeper/end crystal non distruggono blocchi dentro un claim
  block-fire: true         # true = il fuoco non brucia/propaga sui blocchi dentro un claim
  block-pistons: true      # true = i pistoni non spingono/rubano blocchi oltre il confine di un claim altrui
  block-liquid-flow: true  # true = acqua/lava non possono scorrere DENTRO un claim da fuori o da un'altra land

# --------------------------- COMBAT (PvP) -------------------------
# Regola il PvP di fazione: fuoco amico e conteggio uccisioni/morti valide per le classifiche (K/D).
combat:
  # FUOCO AMICO IMPEDITO: il danno viene ANNULLATO (non "niente crediti": proprio non ci si può colpire).
  friendly-fire:
    faction: true          # true = i membri della STESSA fazione non possono farsi danno
    allies: true           # true = le fazioni ALLEATE non possono farsi danno
  # ANTI FAKE-KILL: difese perché un'uccisione conti verso il K/D (oltre al fuoco amico, che già impedisce
  # di uccidere compagni/alleati). Un'uccisione non valida non conta né come kill per l'uccisore né come
  # morte per la vittima: il K/D resta pulito. Le morti per ambiente non incidono sul K/D.
  min-victim-lifetime-seconds: 60   # la vittima dev'essere viva da almeno tot secondi (0 = disattivato)
  kill-cooldown-minutes: 10         # ri-uccidere la STESSA vittima entro tot minuti non dà crediti (0 = disattivato)
  same-ip-no-credit: true           # niente crediti se uccisore e vittima condividono l'indirizzo di rete (alt)

# I vantaggi VIP sulla Potenza sono PERMESSI (si danno al gruppo con LuckPerms), non comandi:
#   magixfactions.power.powermax.<numero>  -> alza il tetto di Potenza (es. ...powermax.20 = 20)
#   magixfactions.power.speed.<percentuale> -> velocità di RECUPERO online (200 = doppia = metà tempo)
#   magixfactions.power.speed.loss.<perc.>  -> velocità di PERDITA da offline (50 = ci mette il doppio,
#                                              200 = perde il doppio). Vedi offline-decay più sotto.
#   magixfactions.minimap                   -> minimap HUD nell'angolo dello schermo
# Fra più permessi dello STESSO tipo vince il più favorevole al giocatore (il più alto per tetto e
# recupero, il più BASSO per la perdita); se non ne ha nessuno valgono i valori qui sotto. Quindi un
# numero scritto in un permesso fa sempre qualcosa, anche se peggiorativo (es. il solo speed.loss.200).
# Tolto un permesso si torna al valore normale entro un giro: tick-seconds per chi è collegato,
# offline-refresh-minutes per chi non lo è.
power:
  start: 0                 # potenza al primo ingresso
  max: 10                 # tetto di Potenza NORMALE (i VIP lo alzano con magixfactions.power.powermax.<n>)
  gain-amount: 1          # quanta potenza si guadagna a ogni intervallo online
  gain-interval-seconds: 600   # ogni quanti secondi online si guadagna (600 = 10 min) alla velocità normale
  # Ogni quanti secondi il plugin conta l'avanzamento del recupero: è la GRANULARITÀ del conteggio (e
  # il passo con cui rilegge i permessi VIP di chi è collegato), NON la velocità, che resta
  # gain-interval-seconds per un giocatore normale. Ogni giocatore ha un suo contatore personale, quindi
  # il tempo non dipende più da quando si è collegato, e l'avanzamento a metà strada è salvato sul
  # database (colonna players.power_progress): chi esce a 7 minuti dai 10 riprende da lì, non da zero.
  # Chi vuole controllare le proprie velocità scrive /f power: le righe extra compaiono solo a chi ha
  # valori diversi dal normale. [solo staff]
  tick-seconds: 20
  death-loss: 4           # potenza persa a ogni morte
  death-message: true     # avvisa il giocatore (solo lui) di quanta Potenza ha perso e quanta gliene resta [solo staff]
  # Ogni quanti minuti il plugin ripassa i giocatori OFFLINE per riallineare il loro tetto ai permessi
  # e applicare il decadimento qui sotto. Serve perché il maxpower di FAZIONE è la somma dei tetti di
  # TUTTI i membri, anche assenti: senza questo giro un VIP scaduto su un account che non rientra più
  # regalerebbe tetto alla sua fazione per sempre. Legge i permessi via LuckPerms (gli unici leggibili
  # per chi è scollegato); senza LuckPerms resta il valore già noto e la perdita va a velocità normale. [solo staff]
  offline-refresh-minutes: 10
  offline-decay:
    amount: 1            # potenza persa da offline per periodo (0 = disattivato/fermo)
    per: day             # hour | day | week | month  (il mese vale 30 giorni)
    # ATTENZIONE: se scrivi un valore che non è in quell'elenco (un refuso, o "settimana" in italiano)
    # il plugin ripiega sul GIORNO e te lo dice in console — controlla il log se il calo non torna.
    # Coi valori di serie un giocatore normale perde 1 Potenza ogni 24 ore di assenza.
    # Per "1 a settimana" -> amount: 1 e per: week. Cambiando questi valori il conto riparte dall'ultimo
    # periodo già maturato: nessuno viene addebitato due volte, e la Potenza già persa non torna
    # indietro. Se ACCORCI il periodo, chi è via da molto può incassare più perdite tutte insieme al
    # primo giro. Basta /mf reload: sono valori riletti a ogni giro, non serve riavviare.
    # Col permesso magixfactions.power.speed.loss.50 ne perde 1 ogni 48 ore; con ...loss.200 ne perde 1
    # ogni 12 ore (= 2 al giorno); con ...loss.0 non ne perde mai. La perdita ora avviene DAVVERO mentre
    # il giocatore è via (ogni offline-refresh-minutes), non più tutta in blocco al suo rientro: una
    # fazione di assenti cala in tempo reale e diventa raidabile quando deve.

# ------------------------ TERRITORI (claim) -----------------------
# /f claim conquista il chunk in cui ti trovi. Permesso interno di fazione "claim" (default: solo leader).
claims:
  max-percent: 20         # tetto territori = questa % del maxpower della fazione
  # Mondi in cui è consentito rivendicare territori con /f claim (e overclaim di guerra). Solo in questi
  # mondi i giocatori possono claimare: altrove il comando viene rifiutato con un messaggio. Elenco dei
  # NOMI dei mondi come li vede il server (es. "world"). Lista VUOTA = nessuna restrizione (si claima
  # ovunque, comportamento precedente).
  allowed-worlds:
    - world
  # Area protetta centrale (lo SPAWN): un quadrato in cui NON si possono fondare fazioni (/f create) né
  # rivendicare territori (/f claim). Serve a tenere libera la zona di partenza: i giocatori devono
  # uscire da questo quadrato per fondare la fazione e conquistare terreno. Il quadrato è centrato in
  # (center-x, center-z) e ha semilato "radius" (radius 500 = quadrato da -500 a +500 su X e Z).
  protected-spawn:
    enabled: true
    world: world            # mondo in cui vale la protezione
    center-x: 0
    center-z: 0
    radius: 500             # semilato del quadrato in blocchi
  # Costo del claim. MONEY = sistema INCREMENTALE pagato dalla BANCA DI FAZIONE (/f deposit), non dal
  # giocatore. Formato "base,incremento,blocco,moltiplicatore":
  #   - base           = costo del PRIMO territorio
  #   - incremento     = aumento a ogni territorio successivo
  #   - blocco         = ogni quanti territori scatta la moltiplicazione
  #   - moltiplicatore = per quanto vengono moltiplicati costo e incremento a ogni scatto
  #                      (omesso = uguale al blocco, per compatibilità con la vecchia forma a 3 valori)
  #   Esempio "10,10,5,5": 10, 20, 30, 40, 50, 250, 300, 350, 400, 450, 2250, 2500, 2750, 3000, 3250...
  #   Forme brevi: "0" = gratis | "100" = costo fisso a claim | "10,10" = incremento senza blocchi.
  # items/placeholders/permission restano requisiti del GIOCATORE che esegue /f claim (come prima).
  cost:
    money: "10,10,5,5"
    items: []
    placeholders: []  # [solo staff]
    permission: ""  # [solo staff]
  # Rimborso alla BANCA quando un territorio viene rilasciato o perso: questa % di QUANTO FU PAGATO
  # al momento del claim (il prezzo speso è salvato nel DB, perché i costi incrementali cambiano
  # nel tempo). Vale per /f unclaim, /f unclaimall E per la perdita da SOVRACCARICO. 0 = niente
  # rimborsi. NB: il territorio conquistato da un NEMICO (overclaim di guerra) NON rimborsa la vittima.
  unclaim-refund-percent: 25
  # /f unclaimall è irreversibile: il primo utilizzo mostra solo un avviso a schermo, bisogna
  # rieseguire il comando entro questi secondi per confermare davvero.
  unclaim-all-confirm-seconds: 10
  unclaim-all-confirm-sound: "entity.wither.spawn" # suono di pericolo mostrato con l'avviso (vuoto = nessun suono) [solo staff]
  unclaim-all-confirm-sound-volume: 1.0  # [solo staff]
  unclaim-all-confirm-sound-pitch: 1.0  # [solo staff]
  # Allerta a TUTTO il server quando una fazione conquista (overclaim) un territorio nemico: titolo a
  # schermo + suono forte per ogni giocatore online. Non riguarda i claim su terreno neutrale.
  overclaim-alert:
    enabled: true
    sound: "entity.wither.spawn"  # suono forte/"strano" (chiave risorsa; vuoto = nessun suono) [solo staff]
    sound-volume: 1.0  # [solo staff]
    sound-pitch: 0.8              # più basso = più cupo/minaccioso [solo staff]
    fade-in: 10  # [solo staff]
    stay: 60  # [solo staff]
    fade-out: 20  # [solo staff]

# ---------- DECADIMENTO TERRITORI PER SOVRACCARICO (decay) --------
# NB: è un concetto DIVERSO dall'"overclaim di guerra" (la conquista di un chunk nemico, sopra in
# claims.cost / claims.overclaim-alert). Qui si parla della PENALITÀ AUTOMATICA: se una fazione supera
# il tetto territori (es. perde un membro -> il cap scende), i membri online vengono avvisati (titolo +
# suono). Trascorse grace-hours inizia a perdere 1 territorio ogni loss-interval-hours, finché non
# rientra nel cap (es. invitando un altro giocatore). Soglia = territori > maxPower x claims.max-percent%
# (mentre "raidabile" per l'overclaim di guerra guarda la potenza ATTUALE < territori: soglie diverse).
decay:
  warn-interval-seconds: 600     # ogni quanto avvisare i membri (600 = 10 minuti)
  grace-hours: 48                # ore prima di iniziare a perdere territori (tempo per reagire)
  loss-interval-hours: 24        # ore tra una perdita di territorio e l'altra
  sound: "entity.wither.spawn"   # suono di pericolo (chiave risorsa; vuoto = nessun suono) [solo staff]
  sound-volume: 1.0  # [solo staff]
  sound-pitch: 1.0  # [solo staff]

# --------------------------- MAPPA --------------------------------
# /f map (aperto a tutti) consegna un ITEM mappa dinamico: tienilo in mano e mostra, sopra il
# terreno reale, i territori delle fazioni colorati in base alla tua relazione (tua/alleata/
# nemica/altrui). La mappa si ricentra mentre cammini = "/f map" dinamico.
map:
  # Modalità di /f map:
  #   item = mappa da tenere in mano (dinamica, si ricentra mentre cammini)
  #   chat = mappa testuale stampata in chat
  # Default "chat": /f map è aperto a tutti in versione testuale; la mappa-ITEM cartacea è per ora
  # messa da parte. La minimap HUD resta un extra separato, riservato a chi ha il permesso
  #   magixfactions.minimap   (di serie nessuno: si dà al gruppo VIP)
  mode: "chat"

  # Zoom di DEFAULT per i nuovi giocatori, in BLOCCHI PER PIXEL (valore numerico libero).
  # Override per-giocatore con:  /mf admin setmap <giocatore> <bpp>   (es. 0.25, 0.5, 1, 4)
  # Più PICCOLO = più zoom/dettaglio, MENO area (0.25 = 32x32 blocchi = 2x2 chunk visibili).
  # Più GRANDE = più area, meno dettaglio (4 = 512x512 blocchi = 32x32 chunk).
  default-zoom: 0.25

  # =========================================================================================
  # IMPOSTAZIONI CONDIVISE dalla mappa ITEM (in mano) E dalla minimap HUD: le due mappe sono
  # volutamente IDENTICHE nella resa, quindi opacità, colori, refresh, dithering, marcatori,
  # cardinali, ecc. valgono per ENTRAMBE. Solo poche cose sono specifiche di una modalità e stanno
  # nelle sezioni 'item:' e 'minimap:' più sotto.
  # =========================================================================================

  # STILE di resa del terreno (CONDIVISO da mappa-item e minimap):
  #  - "magix" (default): resa migliorata — tinte diverse per specie d'albero (betulla, abete, ciliegio
  #    rosa...), sentieri color sabbia ben visibili, e levigatura "smart" dei bordi (le scalette
  #    diagonali di coste/fiumi diventano linee lisce, senza sfocare).
  #  - "vanilla": resa fedele alla mappa vanilla PURA — fogliame tutto dello stesso verde scuro
  #    classico, niente tinte per specie, NESSUNA levigatura (pixel nudi).
  # I COLORI cambiano a caldo (/mf reload + qualche secondo); la LEVIGATURA è nello shader del
  # resource pack -> quella parte richiede un RIAVVIO del server e il ri-download del pack. [solo staff]
  style: "magix"
  # DITHERING dei colori. Diffonde l'errore di quantizzazione sui pixel vicini per simulare più tinte.
  # DEFAULT FALSE: alla prova dei fatti riempiva le aree uniformi (foreste, oceano, carta) di un
  # "puntinato" rumoroso che rendeva la mappa molto più sporca della vanilla (che non ditherizza:
  # aree piatte pulite + rilievo). Metti true solo se preferisci le sfumature al pulito. /mf reload. [solo staff]
  dither: false
  # Opacità % della tinta della fazione sopra il terreno (0 = invisibile, 100 = pieno). CONDIVISA. [solo staff]
  opacity: 30
  # Opacità % del bordo dei territori (di solito più marcato dell'interno). CONDIVISA. [solo staff]
  opacity-borders: 100
  # Frequenza di refresh di ENTRAMBE le mappe: ogni quanti tick (1 tick = 1/20 s) si ricentrano e
  # ridisegnano. 1 = ogni tick (massima fluidità, il più carico); valori più alti alleggeriscono il
  # carico a scapito della fluidità. CONDIVISA (item e minimap usano lo stesso valore). /mf reload a caldo. [solo staff]
  render-interval-ticks: 1

  # --- Solo mappa in mano (ITEM) ---
  item:
    # ANTI-ALIASING del terreno: rende la mappa più pulita/definita e meno "sgranata" a zoom lontani.
    # Per ogni pixel che copre più blocchi campiona una griglia NxN e sceglie il colore PIÙ FREQUENTE
    # (voto di maggioranza, come vanilla — la media inventava colori intermedi che sporcavano la mappa).
    #   1 = OFF (pixel netti) | 2 = 2x2 (consigliato) | 3-4 = più liscia ma più carico (più campioni).
    # Sotto 1 blocco/pixel (zoom molto ravvicinato) è disattivato in automatico (non serve).
    # NB: vale SOLO per la mappa-item; la minimap HUD forza sempre 1 (ss ogni tick costerebbe troppo). [solo staff]
    supersampling: 3
    # Nome dell'item mappa: {zoom} viene sostituito col valore di zoom (blocchi/pixel, es. 0.25). [solo staff]
    name-format: "&6&lMappa Fazioni &7({zoom}x)"

  # --- Marcatore giocatore su mappa cartacea e minimap ---
  # Il MARCATORE di ogni giocatore è una FRECCIA che punta verso dove guarda, colorata per relazione:
  # BIANCA = tu, VERDE = compagno di fazione, BLU = alleato, ROSSA = nemico (stile Cartographer). È
  # IDENTICA su entrambe le mappe, ma disegnata in due modi diversi per un limite tecnico di Minecraft:
  #  - MAPPA-ITEM (in mano): CURSORI NATIVI, freccia disegnata dal client a risoluzione schermo (ruota
  #    in 16 direzioni, resta NITIDA a qualsiasi angolo).
  #  - MINIMAP HUD: i cursori nativi non si agganciano (i pixel sono spinti via pacchetto+shader), quindi
  #    la freccia la ridisegna lo SHADER a risoluzione schermo (stessa resa: nitida, ruota fluida). La
  #    minimap mostra fino a 6 frecce (i giocatori più vicini + sempre te stesso al centro).
  # Nessun nome viene mostrato: solo la freccia (nessuna opzione da configurare).

  # --- Simbolo HOME della propria fazione (item /f map e minimap) ---
  home-marker:
    enabled: true  # [solo staff]
    color: "&6"   # colore del simbolo (oro di default) [solo staff]

  # Rivela gradualmente sulla mappa anche i chunk lontani GIÀ GENERATI ma non caricati in memoria
  # (le zone che altrimenti restano beige ai bordi). Usa il caricamento ASINCRONO di Paper: non genera
  # nuovi chunk (solo quelli già esistenti) e non blocca mai il thread principale. Utile se il mondo è
  # già pre-generato (es. con Chunky). Metti false per lasciare vuote le zone non caricate. [solo staff]
  reveal-distant-chunks: true
  # Velocità di rivelazione: chunk lontani caricati al secondo (async). È il compromesso FLUIDITÀ/TPS:
  # più alto = la mappa si riempie prima ma più I/O e carico; più basso = riempimento graduale ma TPS
  # più sani. A zoom normali (0.25-2 blocchi/pixel) è quasi istantaneo comunque; conta solo a zoom molto
  # lontano (32-64), dove ci sono migliaia di chunk da caricare. Modificabile a caldo con /mf reload.
  # ATTENZIONE: 80 ha causato un CROLLO TPS reale (~12) durante il riempimento — ogni caricamento ha un
  # costo sul main thread (promozione chunk + eventi ChunkLoad degli altri plugin). 20 (= 1 per tick) è
  # il compromesso sano verificato. Alza con cautela solo se i TPS restano a 20 durante il riempimento. [solo staff]
  reveal-chunks-per-second: 20
  # Distanza MASSIMA (in blocchi dal giocatore) entro cui rivelare i chunk lontani. È un limite di
  # SICUREZZA per lo "sweep" iniziale: la rivelazione riempie l'area entro questo raggio dall'interno
  # verso l'esterno, poi si ferma (i chunk oltre restano beige). Il carico è comunque frenato da
  # reveal-chunks-per-second e da un tetto di richieste in volo; i chunk NON generati vengono provati una
  # sola volta e mai più (niente spreco a zoom lontano su mondo non pre-generato). 4096 = a 64 blocchi/
  # pixel copre l'INTERA minimap; a zoom normali non incide (la mappa inquadra molto meno). Nota: si vede
  # solo terreno GIÀ generato — le zone mai esplorate/generate restano vuote (non si può mostrare terreno
  # che non esiste senza generarlo, e generarlo farebbe crollare i TPS). [solo staff]
  reveal-max-distance: 4096

  # --- Minimap HUD (sperimentale, riservata a chi ha il permesso magixfactions.minimap) ---
  minimap:
    # Quadri "staccati" invece che montati sul giocatore. I quadri fittizi che reggono la minimap, se
    # MONTATI sul giocatore, stanno addosso a lui e intercettano i click (attacco/scavo bloccati). Con
    # "detach" formano invece una CORONA di punti fissi attorno alla testa (raggio ~5.6 blocchi, oltre la
    # portata dei click anche in creativa): qualunque direzione guardi c'è sempre un quadro già nel campo
    # visivo, quindi ruotare la visuale di scatto non fa "flashare" la minimap (le ancore si spostano solo
    # quando ti muovi). Richiede un pacchetto compatibile con la versione del server (verificato all'avvio:
    # se non lo è, si resta automaticamente sui quadri montati). Metti false per il vecchio mount. [solo staff]
    detach-frames: true
    # Forma della minimap: "round" (rotonda, default) o "square" (quadrata).
    # NB: è nello shader del pack -> cambiare richiede un RIAVVIO del server (rigenera il pack).
    shape: "square"
    # Lato dello schermo in cui sta la minimap (col pannello info sotto): "right" (alto a destra) o
    # "left" (alto a sinistra — utile se a destra c'è già la scoreboard, che ci si accavallerebbe).
    # NB: è nello shader del pack -> cambiare richiede un RIAVVIO del server (rigenera il pack).
    position: "left"
    # Cornice della minimap (spessore e colore). ANCHE QUESTE sono cotte nello shader del pack -> cambiarle
    # richiede un RIAVVIO del server e che i client riscarichino il pack.
    #  - border-size: spessore in pixel (0 = nessuna cornice). Consigliato 2-4; sulla minimap ROTONDA oltre
    #    ~6 la cornice tocca il bordo del riquadro e viene tagliata.
    #  - border-color: colore in esadecimale "#RRGGBB" oppure codice colore Minecraft "&X" (es. &8 = grigio
    #    scuro). Il bordo esterno viene reso automaticamente più scuro, per un effetto in rilievo. [solo staff]
    border-size: 3
    border-color: "#5A5A5A"  # [solo staff]
    # Dimensione della minimap a schermo, come FRAZIONE dell'altezza dello schermo (0.22 = default).
    # Più grande = HUD più grande (e pixel più ingranditi). Intervallo utile ~0.10-0.40.
    # NB: è impressa nello shader del resource pack, quindi cambiare valore richiede un RIAVVIO del
    # server (rigenera il pack) e che i client riscarichino il pack; /mf reload da solo non basta. [solo staff]
    screen-size: 0.3
    # (Il refresh del contenuto usa la chiave CONDIVISA map.render-interval-ticks, come la mappa-item.)

    # --- Pannello info sotto la minimap (orologio, coordinate, info a piacere) ---
    # Una striscia larga quanto la minimap, subito SOTTO di essa, con righe di testo che decidi tu. Le
    # righe supportano i placeholder di PlaceholderAPI (se installato): ad es. l'ora la dà MagixTime con
    # %magixtime_mc_time% (ora di gioco, che sul server coincide con quella reale), le coordinate le dà
    # PlaceholderAPI base con %player_x% / %player_y% / %player_z%. Il testo si aggiorna a ogni refresh.
    info-panel:
      # Mostrare il pannello? (riservato, come la minimap, a chi ha il permesso magixfactions.minimap)
      enabled: true
      # Righe del pannello. Il TESTO è live (/mf reload), ma cambiare il NUMERO di righe richiede un
      # RIAVVIO del server: l'altezza della striscia è impressa nello shader del pack (come screen-size).
      # Puoi COLORARE e FORMATTARE il testo con i codici Minecraft:
      #  - colore: &0-&f (i 16 classici), &r (torna al default), RGB esadecimale in tre sintassi
      #    (&#RRGGBB, <#RRGGBB>, legacy &x&R&R&G&G&B&B);
      #  - formato: &l grassetto, &o corsivo, &n sottolineato, &m barrato (resi nei pixel; &k offuscato no).
      # Come in vanilla, un codice colore azzera i formati attivi. Es.: "&6&l%magixtime_mc_time%" oppure
      # "&bX:&f%player_x% &bZ:&f%player_z%" oppure "&#FF8800Ciao". [solo staff]
      lines:
        - "%magixtime_mc_time%"
        - "X:%player_x% Z:%player_z%"
      # Colore di DEFAULT del testo (per le parti senza un codice colore), in esadecimale "#RRGGBB".
      text-color: "#FFFFFF"  # [solo staff]
      # Ombra del testo (una copia spostata di 1px, tiene il testo leggibile sul mondo col fondo
      # trasparente): colore in "#RRGGBB", oppure "none"/"off" per spegnerla del tutto. Live con /mf reload.
      shadow-color: "#000000"  # [solo staff]
      # Sfondo della striscia. "transparent" (o "none") = nessun riquadro, resta solo il testo (le mappe
      # non hanno trasparenza vera: lo shader SCARTA i pixel di sfondo). In alternativa un "#RRGGBB" per un
      # riquadro pieno di quel colore. NB: è inciso nello shader del pack -> cambiarlo richiede un RIAVVIO. [solo staff]
      background-color: "transparent"
      # Spazio tra il bordo basso della minimap e il pannello, come frazione di schermo (NDC). Impresso
      # nello shader: cambiarlo richiede un RIAVVIO del server. Intervallo utile ~0.000-0.030. [solo staff]
      gap: 0.006

    # Quanta area si vede: SEMPRE la stessa dello zoom `/f map` del giocatore (i blocchi/pixel di
    # map.default-zoom / /mf admin setmap) — non è configurabile qui a parte, deve corrispondere
    # esattamente alla sua mappa cartacea.

    # Il resource pack che serve lo shader di forma/cornice della minimap e il logo del tablist NON
    # lo costruisce/serve più questo plugin: un client Minecraft ne applica uno solo alla volta, e
    # tutti i plugin che ci mettono qualcosa (anche MagixAuth) registrano il loro contenuto nel
    # plugin MagixPack, che li fonde in un unico zip. Porta, host pubblico, obbligatorietà,
    # messaggi di espulsione e permesso di bypass stanno ora nel SUO config.yml.

  # Colori di BORDO e SFONDO (fill) dei territori, in base alla relazione con chi guarda la mappa.
  # own = tua fazione, ally = alleata, enemy = nemica (anche senza fazione propria: si è nemici di
  # tutti per default, nessuno stato neutro). In modalità chat viene usato il colore 'fill' per la
  # lettera della fazione. [solo staff]
  colors:
    own:
      border: "&a"          # bordo (verde)
      fill: "&2"            # sfondo (verde scuro)
    ally:
      border: "&d"
      fill: "&5"
    enemy:
      border: "&c"
      fill: "&4"

  # --- Mappa in modalità CHAT ---
  chat:
    # Griglia testuale (quadrata NxN, un carattere = un chunk): segue lo stesso zoom di /f map/della
    # minimap (blocchi/pixel), così un giocatore con lo zoom più lontano vede davvero PIÙ territorio
    # in chat, non solo un numero diverso nell'intestazione. Oltre questa soglia (zoom molto lontani, o
    # override di /mf admin setmap) la griglia smette di crescere e ogni casella rappresenta più chunk
    # invece di continuare ad allungare il messaggio in chat. Usa un numero DISPARI.
    max-rows: 21
    symbols:
      you: "&f&l+"          # dove sei tu (centro mappa)
      home: "&6&l⌂"         # la tua home
      neutral: "&8-"        # terreno libero

# ------------------------- TABLIST --------------------------------
# Il logo del server mostrato nell'intestazione della lista giocatori (tasto Tab) è una
# TEXTURE inclusa nel resource pack (assets/magicadventure/textures/gui/logo.png), iniettata
# come carattere speciale nel font del gioco. L'impaginazione del tablist (quali righe, quali
# info) si regola invece in plugins/CMI/Settings/TabList.yml.
#
# Questi due numeri decidono SOLO dimensione e posizione verticale del logo. Cambiarli
# richiede un riavvio del server (il resource pack viene ricostruito e rimandato ai client). [solo staff]
tablist:
  logo:
    # Altezza del logo in pixel di gioco. Più alto = logo più grande (cresce anche in larghezza,
    # in proporzione). Indicativamente: 32 = piccolo, 40 = medio (default), 56+ = grande.
    # Se lo ingrandisci, aggiungi qualche riga vuota sotto il logo nell'header del tablist
    # (config di MagixEssentials, tablist.header; TabList.yml se il tablist è ancora di CMI),
    # altrimenti il logo copre le righe di informazioni.
    height: 78
    # Quanto il logo sale sopra la riga di testo ("ascent"). Non può superare 'height'.
    # Più alto = logo più su. Se il logo risulta TAGLIATO in cima allo schermo, ABBASSA questo
    # valore; se scende troppo sulle informazioni, ALZALO (restando sotto 'height').
    ascent: -8

# ---------------- TITOLI TERRITORIO (centro schermo) --------------
# Titolo mostrato quando si ENTRA in una zona (fade-in), distinto per relazione con la fazione
# proprietaria: own = tua, ally = alleata, enemy = nemica, neutral = terreno di nessuno.
# Così uscendo dalla tua terra verso il nulla vedi "zona neutrale", non un addio alla tua fazione.
# {faction} = nome della fazione proprietaria (non usato in neutral). Tempi in tick (20 tick = 1 s). [solo staff]
territory-titles:
  enabled: true
  fade-in: 10
  stay: 40
  fade-out: 10
  # Ogni quanti secondi si riallinea la cache di chi sta FERMO (es. claim/unclaim/overclaim/alleanza
  # rotta mentre sei nello stesso chunk, senza muoverti): fa scattare il titolo "mancato" a breve
  # invece di aspettare il prossimo movimento.
  recheck-interval-seconds: 1
  own-enter:
    title: "&a&lTERRITORIO"
    subtitle: "&7Sei entrato nel territorio di &a{faction}"
  ally-enter:
    title: "&d&lTERRITORIO ALLEATO"
    subtitle: "&7Sei entrato nel territorio di &d{faction}"
  enemy-enter:
    title: "&c&lTERRITORIO NEMICO"
    subtitle: "&7Stai entrando nel territorio di &c{faction}"
  neutral-enter:
    title: "&7&lZONA NEUTRALE"
    subtitle: "&7Sei entrato in zona neutrale"

# ------------------------- RELAZIONI ------------------------------
# Esistono solo due relazioni: NEMICO (default: ogni fazione è nemica di tutte) e ALLEATO.
# L'alleanza richiede il consenso di entrambe le fazioni (/f ally su entrambi i lati).
relations:
  max-allies: 0           # numero massimo di fazioni alleate (0 = illimitato)

  # Colore restituito dal placeholder relazionale %rel_magixfactions_relation_color%
  # (il colore che un giocatore vede verso un altro in base alla relazione fra le loro fazioni).
  # Usabile nei groupformat di CMI. Supporta &codici e &#RRGGBB. [solo staff]
  colors:
    member: "&a"          # stesso membro/stessa fazione
    ally: "&d"            # fazione alleata
    enemy: "&c"           # fazione nemica
    none: "&c"            # giocatore senza fazione: rosso, cioè nemico per tutti (scelta voluta)

  # Testo restituito dal placeholder %magixfactions_relation_<nomefazione>%
  # (la relazione del giocatore che legge verso quella fazione). [solo staff]
  names:
    member: "&aStessa fazione"
    ally: "&dAlleata"
    enemy: "&cNemica"
    none: "&7Senza fazione"

# --------------------------- GRADI --------------------------------
# Ordina dal più BASSO al più ALTO. Il leader è sopra tutti (sezione 'leader').
# Puoi aggiungerne/rimuoverne a piacere; ogni grado ha id, nome, tag e permessi.
# Permessi disponibili: invite, kick, promote, demote, relation, claim, unclaim, description, sethome, home, withdraw, * (tutti)
#   withdraw = può prelevare dalla banca di fazione (/f withdraw); il versamento (/f deposit) è aperto a tutti
#   relation = può gestire alleanze/nemici (/f ally|enemy)
#   sethome = governa anche /f unsethome (nessun permesso separato)
# EREDITARIETÀ: i permessi si accumulano dal basso verso l'alto. Ogni grado include
# AUTOMATICAMENTE i permessi di tutti i gradi sotto di lui, quindi qui elenca solo i permessi
# NUOVI di ciascun grado (non serve ripetere quelli dei gradi inferiori).
ranks:
  - id: recruit
    name: "Recluta"
    tag: "&7[R]"
    permissions: []
  - id: member
    name: "Membro"
    tag: "&a[M]"
    permissions: ["invite"]                              # + eredita: (niente dalla Recluta)
  - id: officer
    name: "Ufficiale"
    tag: "&b[U]"
    permissions: ["kick", "promote", "demote", "relation", "withdraw"]   # + eredita: invite (dal Membro)

# Il grado del capo, che sta sopra a tutti quelli elencati qui sopra e ha sempre TUTTI i permessi.
# Non si mette in "ranks": è uno solo per fazione e non si può togliere.
leader:
  name: "Leader"          # come lo chiama il gioco (in /f info, /f help, nei messaggi)
  tag: "&6[L]"            # etichetta accanto al nome in chat, con i codici colore & [solo staff]

# --- Autopilota pregen Chunky ---
# Il pregen dei chunk (plugin Chunky) a piena velocità SATURA il server: misurato TPS da 20 a ~2 con
# un task attivo. Con questa opzione MagixFactions lo pilota da solo: "chunky pause" appena entra il
# PRIMO giocatore, "chunky continue" ~1 minuto dopo che esce l'ULTIMO (e al riavvio se il server è
# vuoto). Il mondo si pre-genera così nelle ore morte, e il lag da "primo accesso" (generazione dei
# chunk al join) sparisce col tempo senza mai disturbare chi gioca. Inerte se Chunky non è installato. [solo staff]
chunky-autopilot: true

# ----------------------- VALORE IN MINERALI -----------------------
# Il "Valore" di una fazione (voce del punteggio, colonna sul sito) è la somma del valore dei BLOCCHI
# elencati qui piazzati DENTRO le sue land. Piazzare un blocco nel proprio territorio aggiunge il suo
# valore, romperlo lo toglie; il valore viaggia col territorio quando viene conquistato. Fuori dalle land
# non conta nulla. Decidi TU quali blocchi valgono e quanto: chiave = nome MATERIALE Minecraft (maiuscolo),
# valore = quanto vale ogni blocco. Aggiungi/togli liberamente; togliere una riga = quel blocco vale 0.
# NB: contano solo i blocchi piazzati DA QUANDO la funzione è attiva (non c'è scansione retroattiva del
# mondo). I blocchi rotti da un conquistatore/raid tolgono valore alla fazione proprietaria del chunk.
value-blocks:
  NETHERITE_BLOCK: 500
  DIAMOND_BLOCK: 100
  EMERALD_BLOCK: 80
  GOLD_BLOCK: 40
  IRON_BLOCK: 20
  LAPIS_BLOCK: 10
  REDSTONE_BLOCK: 8
  COAL_BLOCK: 5

# --------------------------- CONFINI A PARTICELLE ---------------------------
# /f borders (aperto a tutti) accende, per il SINGOLO giocatore, delle particelle leggere lungo i BORDI dei
# territori vicini: si vede a colpo d'occhio dove finisce una land. È una preferenza PERSONALE (per-
# giocatore, non per-fazione) e di serie è SPENTA: ognuno la accende per sé con /f borders on.
# Il COLORE dipende dalla RELAZIONE con la fazione proprietaria: verde la propria, magenta le alleate,
# rosso le nemiche (senza fazione propria si è nemici di tutti, come nel resto del plugin).
# Le particelle le vede solo il giocatore che le ha accese; non pesano sugli altri. /mf reload a caldo.
borders:
  enabled: true            # interruttore GENERALE della feature (false = /f borders resta ma non disegna nulla)
  radius: 2                # raggio in CHUNK attorno al giocatore entro cui disegnare i bordi (più alto = più particelle)
  interval-ticks: 10       # ogni quanti tick ridisegnare (10 = mezzo secondo). Più basso = più fluido ma più carico [solo staff]
  point-spacing: 2.0       # distanza in blocchi tra un punto e l'altro lungo il bordo (più alto = più rado/leggero) [solo staff]
  wall-height: 1           # blocchi di altezza del "muretto" di particelle sopra i piedi (0 = solo una riga a terra) [solo staff]
  size: 1.0                # dimensione delle particelle di polvere [solo staff]
  color-own: "#33FF33"     # colore #RRGGBB dei bordi della TUA fazione (verde) [solo staff]
  color-ally: "#FF33FF"    # colore #RRGGBB dei bordi delle fazioni ALLEATE (magenta) [solo staff]
  color-enemy: "#FF3333"   # colore #RRGGBB dei bordi delle fazioni NEMICHE (rosso) [solo staff]
