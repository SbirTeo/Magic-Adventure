# 4->a, 5->s, 7->t, @->a, $->s) e i simboli/spazi: cosi' "c4zz0", "c a z z o" ecc. vengono comunque
# bloccati. Il match e' per SOTTOSTRINGA: aggiungi/rimuovi liberamente parole qui sotto.
forbidden-words:
  # --- volgarita' italiane ---
  - cazzo
  - merda
  - stronzo
  - stronza
  - puttana
  - troia
  - vaffanculo
