  - diocane
  - madonna
  - dioboia
  - dioladro
  - dioms
  - dio maiale
  - zoccola
  - mignotta
  - frocio
  - ricchione
  - negro
  - checca
  - ritardato
  - handicappato
  - mongoloide
  # --- volgarità inglesi / slur ---
  - fuck
  - shit
  - bitch
  - asshole
  - cunt
  - dick
  - pussy
  - whore
  - slut
  - bastard
  - motherfucker
  - nigger
  - nigga
  - faggot
  - retard
  - rape
  # --- altre lingue ---
