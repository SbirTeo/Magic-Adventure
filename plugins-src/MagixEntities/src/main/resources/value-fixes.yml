# Testi DI SERIE che sono cambiati nel jar e vanno aggiornati anche sul server (vedi
# util/ConfigAlign.applyValueFixes). L'allineamento aggiunge le chiavi nuove ma non tocca i valori
# gia' scelti: qui si elencano le coppie testo vecchio -> testo nuovo, e all'avvio e a ogni reload
# si sostituisce SOLO un valore identico a quello vecchio (uno cambiato a mano resta com'e'), dopo
# averne fatto la copia in .bak/. Nato per gli accenti scritti con l'apostrofo ("piu'", "e'").
messages.yml:
  - old: "&#FF6B6B✖ Esiste gia' un'entita' chiamata &f{name}&7."
    new: "&#FF6B6B✖ Esiste già un'entita' chiamata &f{name}&7."
  - old: "&#FF6B6B✖ Nessuna entita' chiamata &f{name}&7. Vedi &f/mentities list&7."
    new: "&#FF6B6B✖ Nessuna entità chiamata &f{name}&7. Vedi &f/mentities list&7."
  - old: "&#FF6B6B✖ Il mondo &f{world}&7 non e' caricato."
    new: "&#FF6B6B✖ Il mondo &f{world}&7 non è caricato."
  - old: "&#FF6B6B✖ Le pose valgono solo per le entita' di tipo &fplayer&7."
    new: "&#FF6B6B✖ Le pose valgono solo per le entità di tipo &fplayer&7."
  - old: "&#FF6B6B✖ &f{name}&7 non e' di tipo &fplayer&7: non ha una skin."
