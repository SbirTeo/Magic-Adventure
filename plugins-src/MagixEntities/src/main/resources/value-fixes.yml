  - old: "&#FFD166▲ &f{name} &7e' salvata ma un altro plugin ne blocca la nascita nel mondo &f{world}&7. Con WorldGuard: &fmob-spawning: deny &7+ &fmobs.block-plugin-spawning: true&7 — metti quest'ultimo a &ffalse&7 (poi &f/wg reload&7). Dettagli in console."
