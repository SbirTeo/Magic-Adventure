# Testi per i giocatori che stanno FUORI da messages.yml: MagixLanguage li legge dal file vero del
# server e li traduce per frase (vedi MagixLanguage, MenuPhraseSync). Un percorso per riga, '*' =
# ogni chiave di una sezione o ogni voce di una lista. Un testo nuovo fuori da messages.yml va
# aggiunto qui, nello stesso commit, e chi lo mostra lo passa da Messages.phrase(giocatore, testo).
entities.yml:
  # i comandi di ogni entità: solo le righe "msg:", e la frase è quello che segue
  - path: "entities.*.commands"
    # il pezzo davanti alla frase, che non si traduce
    prefix: "msg:"
