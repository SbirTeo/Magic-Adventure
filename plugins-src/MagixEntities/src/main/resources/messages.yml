# -------------------------------------------------------------------- help
# L'aiuto lo impagina la classe Aiuto (la stessa in tutti i plugin Magix): una
# sezione per volta, frecce per sfogliare, ogni riga cliccabile per scriversi il
# comando in chat.
# Formato di una riga:  "<comando> [argomenti] :: spiegazione"
#   - il comando (le parole semplici iniziali) e' quello che il clic scrive;
#   - gli argomenti fra <> o [] restano da riempire a mano;
#   - staff: true su una sezione = la vede solo chi ha magixentities.admin.
help:
  title: "MagixEntities"
  # Il testo di cornice dell'elenco comandi (Help.java, condiviso da tutti i plugin Magix):
  # non cambia da un plugin all'altro, ma vive comunque qui perche' Help lo legge da
  # messages.yml come ogni altro testo del giocatore (vedi CLAUDE.md).
  chrome:
    no-commands: "Nessun comando disponibile."
    click-to-write: "Clicca per scriverlo"
    staff-only: "Riservato allo staff"
    click-hint: "clicca un comando per scriverlo"
    back: " « indietro "
    forward: " avanti » "
    page: "Pagina {numero}"
  sections:
    entita:
      title: "Entita'"
      entries:
        - "/mentities create <nome> <tipo> [displayname] :: crea dove sei (tipo: player o un mob)"
        - "/mentities remove <nome> :: elimina l'entita'"
        - "/mentities list [pagina] :: elenco delle entita'"
        - "/mentities info <nome> :: dettagli di una entita'"
        - "/mentities editor <nome> :: pannello con tutti i comandi dell'entita', posizione compresa"
        - "/mentities type <nome> <tipo> :: cambia il tipo tenendo tutto il resto"
        - "/mentities respawn <nome> :: ricrea l'entita' se e' sparita"
    aspetto:
      title: "Aspetto"
      entries:
        - "/mentities name <nome> <nuovoNome> :: rinomina (per il tipo player la skin segue)"
        - "/mentities displayname <nome> <testo|mirror|reset|off|on> :: scritta sopra la testa"
        - "/mentities skin <nome> <nick|mirror> :: skin della statua (solo tipo player)"
        - "/mentities pose <nome> <posa> :: posa della statua (solo tipo player, include sitting)"
        - "/mentities scale <nome> <valore|reset> :: ingrandisce o rimpicciolisce l'entita' (1 = normale, qualsiasi tipo)"
        - "/mentities equip <nome> :: menu per vestirla (armatura e mani)"
        - "/mentities set <nome> <opzione> <on|off> :: invulnerable, nametag, ai, gravity, glowing... (tab per l'elenco)"
    interazione:
      title: "Interazione"
      entries:
        - "/mentities cmd <nome> add <comando> :: esegue il comando quando la clicchi"
        - "/mentities cmd <nome> list :: comandi associati all'entita'"
        - "/mentities cmd <nome> remove <n> :: toglie il comando numero n"
        - "/mentities cmd <nome> clear :: toglie tutti i comandi"
        - "/mentities set <nome> interact on :: lascia passare il clic ad altri plugin (CMI...)"
    position:
      title: "Posizione e utilita'"
      entries:
        - "/mentities tp <nome> :: teletrasportati dall'entita'"
        - "/mentities here <nome> :: sposta l'entita' dove sei tu"
        - "/mentities position <nome> <x|y|z> <blocchi> :: la sposta di pochi blocchi su un asse (y 0.5 = su di mezzo blocco)"
    staff:
      title: "Staff"
      staff: true
      entries:
        - "/mentities reload :: ricarica config, messaggi ed entita'"
