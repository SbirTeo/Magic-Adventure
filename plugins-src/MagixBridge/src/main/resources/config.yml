# Connessione al database del SITO WEB (magicadventure_web), separato dal DB di MagixFactions.
mariadb:
  host: 127.0.0.1
  port: 3306
  database: magicadventure_web
  user: magicweb
  password: "CHANGE_ME_DB_PASSWORD"

# ------------------------------ NETWORK ------------------------------
# MagixBridge gira su ogni server della rete (faction, hub...), con lo stesso database del sito.
network:
  # Il nome di questo server nella rete: gli altri lo usano in %network_<server>_...%.
  # Senza trattini bassi.
  server-name: faction
  # true su UN solo server della rete: traduzione del sito, elenco dei gruppi, guida per
  # amministratori, pulizia della chat del sito. Su tutti gli altri false: sono lavori da fare una
  # volta sola. La consegna degli acquisti non c'entra: ogni server esegue i comandi della sua
  # modalità (quelli scritti per server-name nel pacchetto dello store).
  site-jobs: true

# Ponte dei placeholder fra le modalità: quello che un server sa calcolare (perché ha il
# plugin) gli altri lo leggono come %network_<server>_<placeholder>%, dal database del sito.
# Es. sull'hub %network_faction_magixfactions_faction% = la fazione del giocatore.
# Lo stesso elenco va bene su ogni server: un placeholder che qui non si risolve non si pubblica.
bridge:
  enabled: true
  # Ogni quanto ricalcolare e pubblicare i valori che sono cambiati (secondi, minimo 5).
  publish-interval-seconds: 10
  # Ogni quanto rileggere i valori degli altri server per chi è connesso qui (secondi, minimo 2).
  read-interval-seconds: 5
  # Placeholder di ogni giocatore (senza %): calcolati per chi è connesso qui e per chi è
  # connesso sugli altri server.
  player-placeholders:
    - magixfactions_faction
    - magixfactions_rank
    - magixfactions_rank_name
    - magixfactions_status
    - magixfactions_status_raw
    - magixfactions_leader
    - magixfactions_members
    - magixfactions_members_online
    - magixfactions_power
    - magixfactions_maxpower
    - magixfactions_claims
    - magixfactions_score
    - magixfactions_position
    - magixfactions_power_player
    - magixfactions_maxpower_player
    # Una voce per ogni valuta CONDIVISA di MagixEssentials (currencies.yml, shared: true): così
    # il saldo si legge anche sui server senza quel plugin, come %network_<server>_...%.
    - magixessentials_balance_magix
  # Placeholder senza giocatore (classifiche, totali).
  global-placeholders:
    - magixfactions_factionstot
    - magixfactions_top_1_name
    - magixfactions_top_1_score
    - magixfactions_top_2_name
    - magixfactions_top_2_score
    - magixfactions_top_3_name
    - magixfactions_top_3_score

# /link non esiste più:l'account nasce in gioco con MagixAuth, e le stesse credenziali
# (nome del giocatore + password) aprono anche magicadventure.it.

# Sincronizzazione del grado LuckPerms (gruppo + prefisso colorato) verso il sito.
# Il sito si aggiorna SUBITO a ogni cambio di gruppo/prefisso (evento di LuckPerms) e a ogni join:
# il giro periodico qui sotto è solo una rete di sicurezza.
ranks:
  # Ogni quanto risincronizzare comunque i giocatori online. 0 = disattivato.
  sync-interval-minutes: 5

# Consegna degli acquisti dello store: il sito accoda i comandi dopo il pagamento
# confermato da PayPal, il plugin li esegue dalla console. Ogni server esegue solo i comandi
# della sua modalità (network.server-name), scritti a parte per ogni server nel pacchetto.
store:
  # Ogni quanto controllare la coda (secondi, minimo 3)
  check-interval-seconds: 10
  # Quanti comandi eseguire al massimo per controllo
  batch-size: 20

# Chat live in home sul sito, in ponte con la chat del server.
chat:
  enabled: true
  # Specchia la chat PUBBLICA del gioco sul sito (quella di fazione/alleati non esce mai di qui).
  mirror-game-chat: true
  # Ogni quanto controllare se il sito ha messaggi da pubblicare in gioco (secondi, minimo 1)
  check-interval-seconds: 2
  # Quanti messaggi del sito pubblicare al massimo per controllo
  batch-size: 20
  # Come appare in gioco un messaggio scritto dal sito ({name} e {message})
  game-format: "&b☁ &f{name}&7: &f{message}"
  # I messaggi del sito più vecchi di così (minuti) non vengono ripubblicati all'avvio:
  # evita il muro di righe dopo che il server è stato spento a lungo.
  skip-older-than-minutes: 5
  # Per quante ore tenere lo storico della chat sul sito.
  # 0 = per sempre (predefinito): la chat del sito non si svuota da sola.
  keep-hours: 0

# La verifica in due passaggi in gioco è passata a MagixAuth: chiave, durate e tastierino
# si configurano nel suo config.yml. Il sito continua a usare le stesse colonne di `users`,
# quindi un codice speso di qua risulta speso anche di là.

# Traduzione automatica del sito: le pagine accodano in site_translations le frasi che
# incontrano e non hanno ancora, questo giro le smaltisce chiedendole a MagixLanguage.
# Usa la stessa quota giornaliera (translations.auto-translate nel config di MagixLanguage,
# vedi il suo README): un traguardo raggiunto da un lato si sente anche dall'altro.
site-translation:
  enabled: true
  # Ogni quanto passare a tradurre le frasi in attesa (secondi, minimo 10).
  check-interval-seconds: 30
  # Quante frasi tradurre al massimo per giro.
  batch-size: 25

# Aureola VIP di MagixCosmetics sulle facce del sito, come la corona del miglior sostenitore.
# Stessa regola della statua in gioco: permesso, colore scelto, /halo off, anche da offline.
halo:
  # Ogni quanto riallineare l'aureola di tutti i giocatori noti al sito (minuti). Chi entra in
  # gioco si aggiorna subito; il giro serve per /halo off, /halo setcolor, permessi cambiati e
  # giocatori offline. 0 = spento: sul sito nessuna aureola.
  sync-interval-minutes: 2

# Guida per amministratori del sito (/manage?section=guida).
# Ogni plugin nostro scrive il proprio capitolo in plugins/<Nome>/guida-staff.html;
# MagixBridge li raccoglie e li porta sul sito. Le credenziali del sito restano solo qui.
guide:
  enabled: true
  # Ogni quanto ricontrollare i file dei capitoli (minuti). Il primo giro parte 10 secondi
  # dopo l'avvio, quando tutti i plugin hanno già scritto il loro.
  check-interval-minutes: 15
