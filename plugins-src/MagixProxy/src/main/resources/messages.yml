# ===========================================================================
#  MagixProxy — i testi che un giocatore legge, arrivati dal proxy.
#  Colori con & (come negli altri plugin Magix). MagixLanguage, installato anche sul
#  proxy, li traduce da solo e il proxy li manda nella lingua di ogni giocatore; una
#  traduzione che non convince si corregge in
#  plugins/magixlanguage/translations/magixproxy/<lingua>-overrides.yml.
# ===========================================================================

login:
  # Il database del sito non risponde: non si può sapere chi è il giocatore, quindi
  # si tiene fuori (meglio pochi minuti fuori che qualcuno dentro col nome di un altro).
  kick-database: "&cIl server non riesce a verificare il tuo account in questo momento.\n&7Riprova tra qualche minuto."

network:
  # Chiede un altro server prima di aver fatto il login sul server principale.
  login-first: "&cPrima fai il login qui (&f/login&c), poi potrai cambiare server."
  # Il server principale indicato in config.yml non esiste in velocity.toml (errore di configurazione).
  main-missing: "&cIl server non è raggiungibile in questo momento.\n&7Riprova tra qualche minuto."
  # Il server {server} (non il principale) si è chiuso o l'ha fatto uscire: è stato portato sul principale.
  moved-to-main: "&eIl server &f{server}&e non è più disponibile: ti ho riportato nel server principale."
  # /hub (alias /lobby): porta nell'hub da qualunque server.
  hub:
    sent: "&aSei stato portato nell'&fhub&a."
    already-here: "&eSei già nell'hub."
    unavailable: "&cL'hub non è raggiungibile in questo momento.\n&7Riprova tra qualche minuto."
    players-only: "&cQuesto comando si usa solo da giocatore."
