# ==========================================================================================
#  cornice-test.yml — banco di prova per la cornice a glifo font (vedi CLAUDE.md,
#  "Copiare un file BINARIO nuovo sul VPS" e MagixPack/overrides-vps/).
#
#  Il titolo contiene solo il glifo (nessun testo visibile): serve a vedere DOVE cade la
#  cornice rispetto al baule 6 righe, per tarare ascent/height nel font.json di MagixPack.
#  Una volta calibrata, il titolo si scrive normalmente e ci si mette il glifo in coda.
#
#  NESSUN item negli slot apposta: il client disegna il testo del titolo (quindi il glifo)
#  PRIMA delle icone degli item, che quindi lo coprirebbero del tutto — era per questo che il
#  primo test, con lo sfondo di vetro colorato su ogni slot, sembrava non mostrare niente.
# ==========================================================================================

