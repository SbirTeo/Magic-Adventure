# Nomi degli argomenti dei comandi ("/f join <fazione>"), tradotti a mano.
#
# Vale in due posti:
#  - la SINTASSI delle righe di aiuto (la parte prima di "::"), che non passa mai dal traduttore
#    automatico: MyMemory ci metteva parole di un'altra lingua ("[jugador|clear]" in un testo
#    inglese) e poteva tradurre un sottocomando che il giocatore deve scrivere così com'e'. Qui si
#    traducono le parole dentro < > e [ ];
#  - ogni <...> in qualunque altro messaggio ("Uso: /f join <fazione>"): il traduttore lo
#    protegge per intero (senza, MyMemory lo scambiava per un tag HTML e mangiava gli spazi), e al
#    ritorno lo si traduce con questo glossario invece di rimetterlo in italiano.
# Si traducono solo le voci di "words"; tutto il resto resta identico.
#
# Letto dal jar, mai copiato nella cartella dati: si cambia qui, nel sorgente di MagixLanguage.
# check_config.py [8] blocca il commit se un messages.yml usa tra < > (o tra [ ] in una riga di
# aiuto) una parola che non è né in "words" né in "keep".

# Una voce per nome di argomento: "it" è la parola come compare in messages.yml, le altre lingue
# la sostituiscono (una lingua mancante lascia la parola italiana). Una voce può essere una parola
# col trattino ("blocchi-per-pixel") o di più parole ("codice a sei cifre"): conta intera.
words:
  - {it: "nome", en: "name", es: "nombre", de: "Name"}
  - {it: "giocatore", en: "player", es: "jugador", de: "Spieler"}
  - {it: "fazione", en: "faction", es: "facción", de: "Fraktion"}
  - {it: "password", en: "password", es: "contraseña", de: "Passwort"}
  - {it: "ripeti", en: "repeat", es: "repetir", de: "wiederholen"}
  - {it: "codice", en: "code", es: "código", de: "Code"}
  - {it: "vecchia", en: "old", es: "antigua", de: "alt"}
  - {it: "nuova", en: "new", es: "nueva", de: "neu"}
  - {it: "tipo", en: "type", es: "tipo", de: "Typ"}
  - {it: "testo", en: "text", es: "texto", de: "Text"}
  - {it: "gradi", en: "degrees", es: "grados", de: "Grad"}
  - {it: "animazione", en: "animation", es: "animación", de: "Animation"}
  - {it: "raggio", en: "radius", es: "radio", de: "Radius"}
  - {it: "posa", en: "pose", es: "pose", de: "Pose"}
  - {it: "soldi", en: "money", es: "dinero", de: "Geld"}
  - {it: "menu", en: "menu", es: "menú", de: "Menü"}
  - {it: "motivo", en: "reason", es: "motivo", de: "Grund"}
  - {it: "pagina", en: "page", es: "página", de: "Seite"}
  - {it: "minuti", en: "minutes", es: "minutos", de: "Minuten"}
  - {it: "valore", en: "value", es: "valor", de: "Wert"}
  - {it: "stagione", en: "season", es: "estación", de: "Jahreszeit"}
  - {it: "blocchi", en: "blocks", es: "bloques", de: "Blöcke"}
  - {it: "colore", en: "color", es: "color", de: "Farbe"}
  - {it: "comando", en: "command", es: "comando", de: "Befehl"}
  - {it: "indirizzo", en: "address", es: "dirección", de: "Adresse"}
  - {it: "opzione", en: "option", es: "opción", de: "Option"}
  - {it: "nuovoNome", en: "newName", es: "nuevoNombre", de: "neuerName"}
  - {it: "nuovonome", en: "newname", es: "nuevonombre", de: "neuername"}
  - {it: "categoria", en: "category", es: "categoría", de: "Kategorie"}
  - {it: "durata", en: "duration", es: "duración", de: "Dauer"}
  - {it: "minMembri", en: "minMembers", es: "minMiembros", de: "minMitglieder"}
  - {it: "maxMembri", en: "maxMembers", es: "maxMiembros", de: "maxMitglieder"}
  - {it: "blocchi-per-pixel", en: "blocks-per-pixel", es: "bloques-por-píxel", de: "Blöcke-pro-Pixel"}
  - {it: "codice a sei cifre", en: "six-digit code", es: "código de seis cifras", de: "sechsstelliger Code"}

# Parole tra < > o [ ] che restano IDENTICHE in ogni lingua: opzioni che il giocatore scrive
# davvero ("on|off", "clear", "pubblico" di /mg dossier...) e nomi già uguali ovunque ("nick").
keep: ["on", "off", "it", "en", "es", "de", "public", "faction", "ally", "enemy", "clear", "reset",
       "mirror", "auto", "info", "migrate", "sqlite", "mariadb", "x", "y", "z", "rain", "storm",
       "nick", "nick2", "displayname", "n", "a", "b", "zoom", "pubblico", "add", "list", "remove",
       "create", "disband", "fake", "home", "setmap", "setpower", "bypass", "id", "rename",
       "join", "promote", "demote", "all"]
