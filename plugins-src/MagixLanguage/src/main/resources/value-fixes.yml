# Testi DI SERIE che sono cambiati nel jar e vanno aggiornati anche sul server (vedi
# util/ConfigAlign.applyValueFixes). L'allineamento aggiunge le chiavi nuove ma non tocca i valori
# gia' scelti: qui si elencano le coppie testo vecchio -> testo nuovo, e all'avvio e a ogni reload
# si sostituisce SOLO un valore identico a quello vecchio (uno cambiato a mano resta com'e'), dopo
# averne fatto la copia in .bak/. Nato per gli accenti scritti con l'apostrofo ("piu'", "e'").
messages.yml:
  - old: "&aSincronizzazione completata: &e{plugins}&a plugin, &e{translated}&a chiavi tradotte, &e{reused}&a gia' in cache, &e{failed}&a fallite."
    new: "&aSincronizzazione completata: &e{plugins}&a plugin, &e{translated}&a chiavi tradotte, &e{reused}&a già in cache, &e{failed}&a fallite."
  - old: "&eSincronizzazione in corso: puo' volerci un po' se ci sono molte chiavi nuove da tradurre..."
    new: "&eSincronizzazione in corso: può volerci un po' se ci sono molte chiavi nuove da tradurre..."
  - old: "&eUna sincronizzazione e' gia' in corso: aspetta che finisca (l'esito arriva da solo, o guarda &f/language status&e)."
    new: "&eUna sincronizzazione è già in corso: aspetta che finisca (l'esito arriva da solo, o guarda &f/language status&e)."
