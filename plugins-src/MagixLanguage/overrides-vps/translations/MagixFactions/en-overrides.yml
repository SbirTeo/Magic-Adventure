# Le TUE correzioni per la lingua "en": una chiave messa qui vince sempre sulla traduzione automatica in en.yml (nella stessa cartella), e questo file non viene MAI toccato dalla sincronizzazione.
# Sorgente nel repo: plugins-src/MagixLanguage/overrides-vps/translations/MagixFactions/ (si cambia lì e si porta sul VPS con deploy-plugin-override.yml).
# /f info, /f top, canali della chat e allerta di conquista in inglese, scritti a mano. ATTENZIONE: se cambia il testo italiano di una di queste chiavi in messages.yml, va aggiornata anche qui (vince sempre questa).

"chat":
