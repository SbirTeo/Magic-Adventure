# ============================================================================
#  MagixScoreboard - configurazione
#  Scoreboard laterale con placeholder PlaceholderAPI (compresi quelli degli
#  altri plugin Magix) e condizioni di permesso/mondo/regione WorldGuard, con
#  un peso a decidere quale mostrare quando piu' di una corrisponde.
#  Documentazione completa: plugins/MagixScoreboard/README.md
# ============================================================================

# Interruttore generale: a false nessuno vede nessuna scoreboard (utile per
# disattivare il plugin senza disinstallarlo).
enabled: true

# Ogni quanti tick (20 = 1 secondo) il plugin ricalcola la scoreboard giusta per
# ogni giocatore online (condizioni e placeholder). Le animazioni NON dipendono
# da questo valore: gli "interval-ticks" di titolo e righe (piu' sotto) possono
# essere qualunque numero, anche piu' basso (es. 5 con questo a 10), e ogni
# frame cambia esattamente al suo tempo. Un valore piu' basso qui aggiorna i
# placeholder piu' spesso ma ricalcola le condizioni (permesso/mondo/regione)
# piu' spesso.
update-interval-ticks: 10

# Sfondo della sidebar (il riquadro semitrasparente dietro titolo e righe). Lo disegna il client,
# non il plugin: lo si cambia con uno shader nel pacchetto risorse di MagixPack (serve MagixPack
# installato; senza, resta quello vanilla). Titolo e righe hanno lo STESSO colore e la stessa
# opacita' (in vanilla il titolo e' un po' piu' scuro). Si applica con /mscoreboard reload; i
# giocatori gia' connessi lo vedono dal prossimo ingresso (quando riscaricano il pacchetto).
sidebar-background:
  enabled: true           # false = nessuno sfondo: restano solo le scritte (e il bordo, se acceso)
  color: "#000000"        # colore dello sfondo, "#RRGGBB"
  opacity: 30             # opacita' dello sfondo in percentuale, 0-100 (vanilla: 30 le righe, 40 il titolo)
  # Bordo sui lati sopra, sinistra e sotto (quello destro no), sfumato da sinistra a destra come i
  # bordi del sito.
  border:
    enabled: true         # false = nessun bordo
    width: 1              # spessore in pixel dell'interfaccia (1-8)
    color-start: "#A3E635"  # colore a sinistra (verde del sito)
    color-end: "#C04FF0"    # colore a destra (magenta del sito)
    opacity: 100          # opacita' del bordo in percentuale, 0-100

# Posizione verticale della sidebar. Il client la mette sempre un po' sopra la meta' dello schermo
# e non si puo' cambiare da server: la si SPOSTA con gli shader del pacchetto risorse (sfondo da
# MagixScoreboard, scritte e icone dallo shader del testo di MagixFactions, che serve installato).
# Si spostano tutte le scritte che cadono nella fascia destra dello schermo dove sta la sidebar: se
# un menu o un'altra scritta finisce li', si sposta anch'essa (restringi zone-width). Si applica con
# /mscoreboard reload; i giocatori gia' connessi lo vedono dal prossimo ingresso.
sidebar-position:
  offset-y: 0             # pixel dell'interfaccia verso il BASSO (negativo = in alto), -200..200. 0 = vanilla
  zone-width: 200         # larghezza della fascia destra (pixel dell'interfaccia) in cui le scritte si spostano

# In caso di PARITA' di peso fra piu' scoreboard che corrispondono allo stesso
# giocatore, decide quale vince: l'elenco va dal piu' specifico al meno
# specifico. Valori ammessi (uno o piu', in qualunque ordine):
#   region      -> ha una condizione "regions" (si trova in una di quelle regioni WorldGuard)
#   permission  -> ha una condizione "permission" (ha quel permesso)
#   world       -> ha una condizione "worlds" (si trova in uno di quei mondi)
#   placeholder -> ha una condizione "placeholders" (vedi sotto)
# Di serie una regione batte un permesso, che batte un mondo, che batte una
# condizione sui placeholder. Una scoreboard che unisce piu' condizioni somma i
# punti di ciascuna, quindi vince comunque su chi ne ha una sola piu' in basso
# in questo elenco. A parita' anche di questo, vince la prima scoreboard
# definita qui sotto.
priority-order:
  - region
  - permission
  - world
  - placeholder

# ----------------------------------------------------------------------------
# LE SCOREBOARD
# ----------------------------------------------------------------------------
# Una voce per scoreboard, con una chiave libera (qui "default", "vip", "spawn"):
#
#   enabled    : true/false, per disattivarne una senza cancellarla
#   weight     : il peso; a parita' di condizioni soddisfatte vince quella col
#                valore PIU' ALTO. Una scoreboard senza nessuna condizione
#                (permission/worlds/regions tutti vuoti) fa da riserva per chi
#                non rientra in nessun'altra: dalle un peso basso.
#   permission : nodo di permesso richiesto ("" = nessuno)
#   worlds     : elenco di mondi richiesti (vuoto = qualunque mondo)
#   regions    : elenco di ID di regioni WorldGuard richieste — basta trovarsi in
#                UNA delle regioni elencate (vuoto = qualunque posizione; con
#                WorldGuard non installato queste condizioni non corrispondono mai)
#   placeholders : elenco di condizioni "%placeholder% OP valore" (OP: >= <= ==
#                != > <), risolte con PlaceholderAPI (vuoto = nessuna). Es. per
#                mostrare una scoreboard solo a chi ha una fazione:
#                ["%magixfactions_faction% != "]. Numeri a destra e a sinistra
#                si confrontano come numeri, il resto come testo (senza
#                distinguere maiuscole/minuscole). Copre qualunque placeholder,
#                non solo quelli dei plugin Magix.
#   placeholders-mode : con PIU' di una condizione in "placeholders", decide se
#                servono TUTTE (all, il default) o ne basta UNA (any). Con una
#                sola condizione (o nessuna) non cambia niente.
#   title      : il titolo, con interval-ticks + frames (vedi sotto)
#   lines      : le righe, dall'alto verso il basso (max 15, il limite di
#                Minecraft), ognuna con interval-ticks + frames
#
# "frames" e' l'elenco dei testi che si alternano in quello slot (titolo o riga):
# con un solo elemento lo slot e' fisso (i placeholder si aggiornano comunque a
# ogni update-interval-ticks), con piu' elementi il plugin li alterna IN ORDINE
# ogni "interval-ticks" tick, tornando al primo dopo l'ultimo — sia per una
# scritta che "respira" (frame quasi identici, es. un puntino che si sposta) sia
# per righe del tutto diverse che si alternano nello stesso posto (es. saldo e
# ping a turno). Il conteggio dei tick e' lo stesso per tutti i giocatori: due
# che vedono la stessa animazione la vedono sincronizzata, non ognuno per conto
# suo. I placeholder sono quelli di PlaceholderAPI: sia quelli standard
# (%player_name%, %server_online%...) sia quelli degli altri plugin Magix, che
# si espongono ognuno come propria expansion (%magixfactions_...%,
# %magixtime_...%, %magixweb_...%...) senza bisogno di configurarli qui.
#
# "scroll" (facoltativo, su titolo o riga): il testo SCORRE da destra verso
# sinistra come un'insegna luminosa, in una finestra di caratteri fissa. Si
# applica al testo gia' risolto e colorato, placeholder compresi, e ogni
# carattere tiene il suo colore. Esempio, lo stato della fazione che scorre:
#   - interval-ticks: 20
#     frames:
#       - "%magixfactions_status%"
#     scroll:
#       width: 24         # caratteri visibili alla volta (0 = niente scorrimento)
#       gap: 6            # spazi vuoti fra la fine del testo e il suo nuovo inizio
#       speed-ticks: 2    # ogni quanti tick avanza di un carattere (20 = 1 secondo)
# La scoreboard si ridisegna da sola al passo dello scorrimento, qualunque sia
# update-interval-ticks: non serve abbassarlo.
scoreboards:
  default:
    enabled: true
    weight: 0
    permission: ""
    worlds: []
    regions: []
    placeholders: []
    placeholders-mode: all
    title:
      interval-ticks: 20
      frames:
        - "&#C046E8&lMAGIC&#A8DC2C&lADVENTURE"
    lines:
      - interval-ticks: 20
        frames:
          - "&7Giocatore: &f%player_name%"
      - interval-ticks: 20
        frames:
          - "&7Online: &f%server_online%&7/&f%server_max_players%"
      - interval-ticks: 60
        frames:
          - "&8&m                     "
          - "&7magicadventure.it"

  vip:
    enabled: true
    # Peso piu' alto del default: chi ha il permesso vede questa al posto della
    # scoreboard di riserva.
    weight: 10
    permission: "magixscoreboard.board.vip"
    worlds: []
    regions: []
    placeholders: []
    placeholders-mode: all
    title:
      interval-ticks: 20
      frames:
        - "&#C046E8&lMAGIC&#A8DC2C&lADVENTURE &7VIP"
    lines:
      - interval-ticks: 20
        frames:
          - "&7Saldo: &a%vault_eco_balance_formatted%"
      # Due frame diversi che si alternano nello stesso posto ogni 40 tick (2s).
      - interval-ticks: 40
        frames:
          - "&7Uccisioni: &c%statistic_player_kills%"
          - "&7Morti: &c%statistic_deaths%"

  spawn:
    enabled: true
    # Stesso peso di "vip": a parita' di peso decide priority-order, e "region"
    # viene prima di "permission", quindi chi e' allo spawn vede questa anche se
    # ha anche il permesso della VIP.
    weight: 10
    permission: ""
    worlds: []
    regions:
      - "spawn"
    placeholders: []
    placeholders-mode: all
    title:
      interval-ticks: 20
      frames:
        - "&#C046E8&lMAGIC&#A8DC2C&lADVENTURE &7Spawn"
    lines:
      - interval-ticks: 20
        frames:
          - "&7Benvenuto su MagicAdventure!"
      - interval-ticks: 20
        frames:
          - "&7Online: &f%server_online%&7/&f%server_max_players%"

  # Esempio di condizione sui placeholder: due scoreboard mutualmente esclusive
  # a seconda che il giocatore abbia una fazione (MagixFactions) o no. Il
  # placeholder %magixfactions_faction% vale il nome della fazione, o "" (vuoto)
  # senza fazione: "!= " confrontato con un testo vuoto vale "diverso da niente".
  faction:
    enabled: true
    weight: 5
    permission: ""
    worlds: []
    regions: []
    placeholders:
      - "%magixfactions_faction% != "
    # Una sola condizione qui: "all" o "any" darebbero lo stesso risultato.
    # Con piu' di una condizione, "any" vorrebbe dire "basta una delle due",
    # es. ["%magixfactions_faction% != ", "%vault_eco_balance% >= 1000"].
    placeholders-mode: all
    title:
      interval-ticks: 20
      frames:
        - "&#C046E8&lMAGIC&#A8DC2C&lADVENTURE &7Fazione"
    lines:
      - interval-ticks: 20
        frames:
          - "&7Fazione: &f%magixfactions_faction%"
      - interval-ticks: 20
        frames:
          - "&7Potenza: &f%magixfactions_power%&7/&f%magixfactions_maxpower%"

  no-faction:
    enabled: true
    weight: 5
    permission: ""
    worlds: []
    regions: []
    placeholders:
      - "%magixfactions_faction% == "
    placeholders-mode: all
    title:
      interval-ticks: 20
      frames:
        - "&#C046E8&lMAGIC&#A8DC2C&lADVENTURE"
    lines:
      - interval-ticks: 20
        frames:
          - "&7Non hai ancora una fazione!"
      - interval-ticks: 20
        frames:
          - "&7Usa &f/f create <nome>&7 per crearne una."
