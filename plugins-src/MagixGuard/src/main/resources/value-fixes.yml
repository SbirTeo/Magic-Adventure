# Testi DI SERIE che sono cambiati nel jar e vanno aggiornati anche sul server (vedi
# util/ConfigAlign.applyValueFixes). L'allineamento aggiunge le chiavi nuove ma non tocca i valori
# gia' scelti: qui si elencano le coppie testo vecchio -> testo nuovo, e all'avvio e a ogni reload
# si sostituisce SOLO un valore identico a quello vecchio (uno cambiato a mano resta com'e'), dopo
# averne fatto la copia in .bak/. Nato per gli accenti scritti con l'apostrofo ("piu'", "e'").
sanctions.yml:
  - old: "Pubblicita' di altri server"
    new: "Pubblicità di altri server"
  - old: "Volo, velocita' e movimenti impossibili."
    new: "Volo, velocità e movimenti impossibili."
  - old: "Ogni violazione vale dei punti. I punti si sommano e dimezzano ogni {dimezzamento} giorni: chi sbaglia una volta non se lo porta dietro per sempre, chi insiste paga di piu'."
    new: "Ogni violazione vale dei punti. I punti si sommano e dimezzano ogni {dimezzamento} giorni: chi sbaglia una volta non se lo porta dietro per sempre, chi insiste paga di più."
