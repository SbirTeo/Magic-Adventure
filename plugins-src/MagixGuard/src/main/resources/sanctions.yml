# =====================================================================
#  MagixGuard - sanzioni
#
#  Questo file e' la FONTE della tabella delle sanzioni che compare nel
#  regolamento del sito: il plugin la rigenera a ogni avvio e a ogni
#  /mg reload. La tabella nel regolamento NON si scrive a mano.
#
#  Disegno completo: plugins-src/MagixGuard/PROGETTO-SANZIONI.md
# =====================================================================

# Collegamento al database del SITO, dove vivono sanzioni, ricorsi e coda.
# E' lo stesso database che usa MagixWeb: qui le sanzioni le SCRIVE il plugin,
# il sito le legge (e ci aggiunge solo ricorsi e decisioni dello staff).
site:
  host: "127.0.0.1"
  port: 3306
  database: "magicadventure_web"
  user: "magicweb"
  password: "CHANGE_ME_DB_PASSWORD"
  pool-size: 3
  # Ogni quanto rileggere le decisioni prese sul sito: revoche da eseguire in
  # gioco e proposte confermate dallo staff. Secondi.
  check-seconds: 10

# --------------------------- SEGNALAZIONI ----------------------------
# /report <giocatore> <motivo>: apre un caso nella stessa coda dei rilevamenti
# automatici. Non fa scattare nessuna sanzione da solo: decide sempre una persona.
report:
  active: true
  # Pausa fra una segnalazione e l'altra, per lo stesso giocatore (secondi).
  pause-seconds: 60
  # Quante segnalazioni ancora aperte puo' avere una persona alla volta.
  # Serve a evitare che qualcuno riempia la coda per ripicca.
  max-open: 3
  # Lunghezza minima del motivo. "barare" non dice niente a chi dovra' controllare.
  min-reason: 15

# --------------------------- APPLICAZIONE ----------------------------
application:
  # misto      = automatico solo ad alta confidenza e per durate brevi, il resto
  #              finisce nella coda di revisione del gestionale (PREDEFINITO)
  # automatico = il plugin applica sempre da solo, entro il tetto qui sotto
  # proposta   = il plugin non applica mai niente da solo: tutto in coda
  mode: misto
  # Nessun automatismo puo' superare questa durata: oltre, diventa una proposta.
  # 0 = nessun automatismo di durata (solo warn e mute brevi).
  auto-max-duration: 30d
  # Il ban PERMANENTE non e' mai automatico, qualunque cosa dica 'modo'.
  # Non e' configurabile di proposito: e' la decisione piu' grave che esista.

  # Cosa vede il giocatore quando viene espulso o bloccato.
  # {motivo} {durata} {scadenza} {id} vengono sostituiti.
  ban-message: |
    &#FF6B6B&lSei stato bandito da MAGICADVENTURE
    &7Motivo: &f{motivo}
    &7Durata: &f{durata}
    &7Puoi fare ricorso qui:
    &#A8DC2Chttps://magicadventure.it/sanzione/{id}
  kick-message: |
    &#FFD166&lSei stato espulso
    &7Motivo: &f{motivo}
  # Messaggio a chi prova a scrivere mentre e' silenziato.
  mute-message: "&#FF6B6BNon puoi scrivere in chat: &f{motivo} &7(finisce fra {scadenza})"

# ------------------------------ PUNTI --------------------------------
points:
  # I punti si sommano e DECADONO: meta' del loro valore ogni N giorni.
  # E' la stessa curva del punteggio multi-account: chi sbaglia una volta a marzo
  # non se lo porta dietro per sempre, il recidivo si'.
  halving-days: 90
  # Soglie: raggiunti i punti indicati, scatta il provvedimento.
  # Si legge dall'alto verso il basso: vince la soglia piu' alta superata.
  thresholds:
    - points: 10
      type: mute
      duration: 30m
    - points: 25
      type: mute
      duration: 6h
    - points: 50
      type: ban
      duration: 3d
    - points: 80
      type: ban
      duration: 30d
    - points: 120
      type: ban
      duration: permanente

# ---------------------------- CATEGORIE ------------------------------
# Ogni violazione appartiene a una categoria. Da qui escono: i punti, l'ambito
# (dove vale il provvedimento) e se il provvedimento puo' essere automatico.
# Il 'nome' e' quello che legge il pubblico nel regolamento e nell'elenco.
categories:
  chat.spam:
    name: "Spam in chat"
    description: "Messaggi ripetuti, troppo rapidi o tutti in maiuscolo."
    points: 3
    scope: entrambi
    automatic: true
  chat.insulti:
    name: "Insulti"
    description: "Offese e linguaggio volgare verso altre persone."
    points: 8
    scope: entrambi
    automatic: true
  chat.pubblicita:
    name: "Pubblicita' di altri server"
    description: "Indirizzi, inviti e richiami verso altri server."
    points: 25
    scope: entrambi
    automatic: true
  chat.dati-personali:
    name: "Dati personali"
    description: "Numeri, indirizzi, richieste di contatti o foto ad altri giocatori."
    points: 20
    scope: entrambi
    # MAI automatico: il pubblico e' in larga parte minorenne e qui un falso
    # positivo pesa molto meno di uno staff che non viene avvisato.
    automatic: false
  cheat.movimento:
    name: "Cheat di movimento"
    description: "Volo, velocita' e movimenti impossibili."
    points: 40
    scope: gioco
    automatic: true
  cheat.combat:
    name: "Cheat in combattimento"
    description: "Mira automatica, portata e colpi impossibili."
    points: 40
    scope: gioco
    automatic: true
  cheat.xray:
    name: "X-ray"
    description: "Scavo guidato verso minerali non visibili."
    points: 50
    scope: gioco
    automatic: true
  afk.elusione:
    name: "Elusione dell'anti-AFK"
    description: "Macro, autoclicker e trucchi per risultare attivi da fermi."
    points: 15
    scope: gioco
    automatic: true
  report.confermato:
    name: "Segnalazione confermata"
    description: "Comportamento accertato dallo staff dopo la segnalazione di un giocatore."
    points: 0
    scope: entrambi
    automatic: false
  manuale:
    name: "Decisione dello staff"
    description: "Provvedimento preso da un membro dello staff."
    points: 0
    scope: entrambi
    automatic: false

# --------------------------- POTERI STAFF ----------------------------
# Tetto di durata per grado (gruppo primario LuckPerms). Oltre il tetto la
# sanzione NON viene rifiutata: diventa una proposta motivata per il grado
# superiore, con le prove gia' allegate. Chi vede il problema non perde il lavoro.
#   -1 = nessun limite     0 = non puo' dare quel tipo di sanzione
powers:
  helper:
    mute: 1h
    ban: 0
  moderatore:
    mute: 24h
    ban: 7d
  admin:
    mute: -1
    ban: -1

# ---------------------------- REGOLAMENTO ----------------------------
rulebook:
  # Rigenera il blocco [[SANZIONI]] del regolamento sul sito a ogni avvio
  # e a ogni /mg reload.
  generate: true
  # Riga di apertura del blocco generato.
  intro: "Ogni violazione vale dei punti. I punti si sommano e dimezzano ogni {dimezzamento} giorni: chi sbaglia una volta non se lo porta dietro per sempre, chi insiste paga di piu'."
