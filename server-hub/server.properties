# HUB - scritto da .github/workflows/predisponi-hub.yml. Paper completa da solo le chiavi mancanti.
# Porta solo interna (127.0.0.1): nessun giocatore lo raggiunge finche' non c'e' Velocity davanti.
server-ip=127.0.0.1
server-port=25566
online-mode=false
enforce-secure-profile=false
prevent-proxy-connections=false
network-compression-threshold=256
max-players=100
motd=MagicAdventure Hub
level-name=world
level-type=minecraft\:flat
generator-settings={"biome"\:"minecraft\:the_void","layers"\:[{"block"\:"minecraft\:air","height"\:1}]}
generate-structures=false
allow-nether=false
spawn-protection=0
difficulty=peaceful
gamemode=adventure
force-gamemode=true
pvp=false
view-distance=6
simulation-distance=4
white-list=false
